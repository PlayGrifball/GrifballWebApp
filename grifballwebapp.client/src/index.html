<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Play Grifball</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#060B13">
  <meta name="description" content="Halo Infinite Grifball seasons, teams, schedules, brackets and match stats.">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <!-- Starts the API calls of the page being opened while the app's scripts download; the app uses
       each answer once, instead of asking again (src/app/earlyFetch.interceptor.ts). The URLs must
       match what the pages ask for (with the same query): a URL nobody asks for is just not used. -->
  <script>
    (function () {
      if (!window.fetch || !window.Promise) return;
      var path = location.pathname.replace(/\/+$/, '') || '/';
      var tab = new URLSearchParams(location.search).get('tab');
      var m, urls = ['/api/Season/getCurrentSeasonID/', '/api/CommitHash', '/api/CommitDate'];
      var token = null;
      try { token = JSON.parse(localStorage.getItem('access_token')).accessToken || null; } catch (e) { }
      if (token) urls.push('/api/identity/metaInfo');
      if (path === '/') {
        urls.push('/api/Home/CurrentAndFutureEvents/', '/api/Home/PastSeasons?pageSize=10&pageNumber=1');
      } else if ((m = /^\/season\/([1-9]\d*)$/.exec(path))) {
        urls.push('/api/Season/getSeasonName/' + m[1]);
        if (tab === 'schedule') urls.push('/api/MatchPlanner/GetUnscheduledMatches/' + m[1], '/api/MatchPlanner/GetScheduledMatches/' + m[1]);
        else if (tab === 'bracket') urls.push('/api/Brackets/GetViewerData?seasonID=' + m[1]);
        else urls.push('/api/TeamStandings/GetTeamStandings/' + m[1], '/api/MatchPlanner/GetScheduledMatches/' + m[1]);
      } else if ((m = /^\/seasonmatch\/([1-9]\d*)$/.exec(path))) {
        urls.push('/api/SeasonMatch/GetSeasonMatchPage/' + m[1], '/api/SeasonMatch/GetPossibleMatches/' + m[1]);
      } else if ((m = /^\/profile\/([1-9]\d*)$/.exec(path))) {
        urls.push('/api/profile/getgamertag/' + m[1]);
      }
      var headers = token ? { Authorization: 'Bearer ' + token } : {};
      var responses = {};
      urls.forEach(function (url) {
        responses[url] = fetch(url, { headers: headers, credentials: 'same-origin' })
          .then(function (r) { return r.text().then(function (body) { return { status: r.status, contentType: r.headers.get('Content-Type'), body: body }; }); })
          .catch(function () { return null; });
      });
      window.grifEarly = { at: Date.now(), token: token, responses: responses };
    })();
  </script>

  <!-- The fonts are self-hosted (src/styles/_fonts.scss). The text fonts every page uses are
       fetched at once rather than after the app has rendered, so the text does not reflow. -->
  <link rel="preload" href="fonts/rajdhani-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/rajdhani-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/rajdhani-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/share-tech-mono-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <!-- Shown until the app starts (Angular replaces what is inside <app-root>): the page background
       and the header bar, so something is on screen while the scripts load. Matches the real header. -->
  <style>
    body { margin: 0; background: #060B13; }
    .boot-shell { min-height: 100vh; background: radial-gradient(ellipse at 70% 0%, #12304A 0%, #08131F 45%, #060B13 100%); }
    .boot-shell__bar { border-bottom: 1px solid #1E3A52; }
    .boot-shell__brand { box-sizing: border-box; max-width: 1240px; margin: 0 auto; padding: 0 24px; height: 68px; display: flex; align-items: center;
      font: 700 26px Rajdhani, system-ui, sans-serif; letter-spacing: 0.22em; text-transform: uppercase; color: #FFFFFF; }
    @media (max-width: 720px) { .boot-shell__brand { height: 60px; padding: 0 16px 0 68px; font-size: 20px; letter-spacing: 0.18em; } }
  </style>
</head>
<body class="mat-typography mat-app-background">
  <app-root>
    <div class="boot-shell" aria-hidden="true"><div class="boot-shell__bar"><div class="boot-shell__brand">Grifball</div></div></div>
  </app-root>
</body>
