  <!-- The fonts are self-hosted (src/styles/_fonts.scss). The text fonts every page uses are
       fetched at once rather than after the app has rendered. -->
  <link rel="preload" href="fonts/rajdhani-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/rajdhani-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/rajdhani-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/share-tech-mono-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <!-- The page, rendered on the server, is painted at once, before those fonts are in: its text shows in a
       local font sized like them (the "Fallback" faces: Arial or Liberation Sans scaled to Rajdhani's widths and
       heights, Courier New or Liberation Mono to Share Tech Mono's), and keeps its place when they arrive. The
       faces are declared here too (as in src/styles/_fonts.scss), not only in the stylesheet that loads later. -->
  <style>
    @font-face { font-family: 'Rajdhani'; font-style: normal; font-display: swap; font-weight: 500; src: url('/fonts/rajdhani-latin-500-normal.woff2') format('woff2'); unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
    @font-face { font-family: 'Rajdhani'; font-style: normal; font-display: swap; font-weight: 600; src: url('/fonts/rajdhani-latin-600-normal.woff2') format('woff2'); unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
    @font-face { font-family: 'Rajdhani'; font-style: normal; font-display: swap; font-weight: 700; src: url('/fonts/rajdhani-latin-700-normal.woff2') format('woff2'); unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
    @font-face { font-family: 'Share Tech Mono'; font-style: normal; font-display: swap; font-weight: 400; src: url('/fonts/share-tech-mono-latin-400-normal.woff2') format('woff2'); unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
    @font-face { font-family: 'Rajdhani Fallback'; font-weight: 400 600; src: local('Arial'), local('Liberation Sans'), local('Arimo'); size-adjust: 92.7%; ascent-override: 100.3%; descent-override: 37.3%; line-gap-override: 0%; }
    @font-face { font-family: 'Rajdhani Fallback'; font-weight: 700 900; src: local('Arial Bold'), local('Arial-BoldMT'), local('Liberation Sans Bold'), local('Arimo Bold'); size-adjust: 86.1%; ascent-override: 108%; descent-override: 40.2%; line-gap-override: 0%; }
    @font-face { font-family: 'Share Tech Mono Fallback'; src: local('Courier New'), local('Liberation Mono'), local('Cousine'); size-adjust: 90%; ascent-override: 98.3%; descent-override: 26.9%; line-gap-override: 0%; }
  </style>

    .boot-shell__brand { box-sizing: border-box; max-width: 1240px; margin: 0 auto; padding: 0 24px; height: 68px; display: flex; align-items: center;
      font: 700 26px Rajdhani, 'Rajdhani Fallback', system-ui, sans-serif; letter-spacing: 0.22em; text-transform: uppercase; color: #FFFFFF; }
    @media (max-width: 720px) { .boot-shell__brand { height: 60px; padding: 0 16px 0 68px; font-size: 20px; letter-spacing: 0.18em; } }

<body class="mat-typography mat-app-background">
  <app-root>
    <div class="boot-shell" aria-hidden="true"><div class="boot-shell__bar"><div class="boot-shell__brand">Grifball</div></div></div>
  </app-root>
  <!-- Starts the API calls of the page being opened while the app's scripts download; the app uses
       each answer once, instead of asking again (src/app/core/http/earlyFetch.interceptor.ts). The URLs must
       match what the pages ask for (with the same query): a URL nobody asks for is just not used.
       Not for a page the server rendered (app-root has ng-server-context then): the server sends
       its API answers with the page, and the app uses those. -->
  <script>
    (function () {
      if (!window.fetch || !window.Promise || document.querySelector('app-root[ng-server-context]')) return;
      // The path without its trailing slashes (a loop: linear), '/' for the home page
      var path = location.pathname;
      while (path.length > 1 && path.charAt(path.length - 1) === '/') path = path.slice(0, -1);
      var tab = new URLSearchParams(location.search).get('tab');
      // Who is signed in (the session cookie goes with every call; a visitor gets 204)
      var m, urls = ['/api/seasons/current', '/api/CommitHash', '/api/CommitDate', '/api/identity/me'];
      if (path === '/') {
        urls.push('/api/events', '/api/seasons?ended=true&pageNumber=1&pageSize=10');
      } else if ((m = /^\/season\/([1-9]\d*)$/.exec(path))) {
        urls.push('/api/seasons/' + m[1] + '/summary');
        if (tab === 'schedule') urls.push(`/api/seasons/${m[1]}/matches/unscheduled`, `/api/seasons/${m[1]}/matches/scheduled`);
        else if (tab === 'bracket') urls.push('/api/seasons/' + m[1] + '/bracket/viewer-data');
        else urls.push('/api/seasons/' + m[1] + '/standings', `/api/seasons/${m[1]}/matches/scheduled`);
      } else if ((m = /^\/seasonmatch\/([1-9]\d*)$/.exec(path))) {
        urls.push('/api/season-matches/' + m[1]);
      } else if ((m = /^\/profile\/([1-9]\d*)$/.exec(path))) {
        urls.push('/api/users/' + m[1] + '/gamertag', '/api/users/' + m[1] + '/stats');
      }
      var responses = {};
      urls.forEach(function (url) {
        responses[url] = fetch(url, { credentials: 'same-origin' })
          .then(function (r) { return r.text().then(function (body) { return { status: r.status, contentType: r.headers.get('Content-Type'), body: body }; }); })
          .catch(function () { return null; });
      });
      window.grifEarly = { at: Date.now(), responses: responses };
    })();
  </script>
</body>
