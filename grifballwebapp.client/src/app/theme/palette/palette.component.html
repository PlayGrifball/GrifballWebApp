<mat-form-field>
    <mat-label>Color picker</mat-label>
    <input matInput [formControl]="color" [mtxColorpicker]="picker" format="hex">
    <mtx-colorpicker-toggle matSuffix [for]="picker" />
    <mtx-colorpicker #picker />
</mat-form-field>

<div class="flex">
    <div>{{paletteName()}}</div>
    <app-tile [paletteName]="paletteName()" [i]="null" class="inline-flex w-20" />
</div>

<div class="flex">
    @for (i of range(); track i) {
        <app-tile [paletteName]="paletteName()" [i]="i" class="inline-flex w-20 h-24" />
    }
</div>
