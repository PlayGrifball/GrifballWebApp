<mat-form-field appearance="outline" class="palette-picker">
    <mat-label>{{paletteName()}} colour</mat-label>
    <input matInput [formControl]="color" [mtxColorpicker]="picker" format="hex">
    <mtx-colorpicker-toggle matSuffix [for]="picker" [aria-label]="'Pick the ' + paletteName() + ' colour'" />
    <mtx-colorpicker #picker />
</mat-form-field>

<div class="palette-seed">
    <div class="palette-name">{{paletteName()}}</div>
    <app-tile [paletteName]="paletteName()" [i]="null" class="palette-tile" />
</div>

<div class="palette-tones">
    @for (i of range(); track i) {
        <app-tile [paletteName]="paletteName()" [i]="i" class="palette-tile" />
    }
</div>
