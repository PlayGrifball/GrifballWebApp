<div class="hud-page">
<div class="hud-page-head">
  <span class="hud-kicker">&gt; Season roster</span>
  <h1 id="tableLabel" class="hud-title">Signups</h1>
</div>

<app-season-tabs active="signups" />

@if (noSignups()) {
<app-data-notice message="This season was backfilled from historical records: its signup data isn't available." [sourceUrl]="summary()?.historicalSourceUrl" />
} @else {
<span class="hud-label">{{signUps().length}} signed up</span>

<!-- Scrolls sideways on phones: focusable, so it scrolls with the keyboard too -->
<div class="hud-table-wrap" tabindex="0" role="region" aria-labelledby="tableLabel">
<table mat-table [dataSource]="signUps()" aria-labelledby="tableLabel">

  <!--- Note that these columns can be defined in any order.
        The actual rendered columns are set as a property on the row definition" -->
  <!-- personName Column -->
  <ng-container matColumnDef="personName">
    <th mat-header-cell *matHeaderCellDef>Player</th>
    <td mat-cell *matCellDef="let row"> {{row.personName}} </td>
  </ng-container>

  <!-- timestamp Column -->
  <ng-container matColumnDef="timestamp">
    <th mat-header-cell *matHeaderCellDef>Signed up</th>
    <td mat-cell *matCellDef="let row"> {{row.timestamp | date:'short' }} </td>
  </ng-container>

  <!-- teamName Column -->
  <ng-container matColumnDef="teamName">
    <th mat-header-cell *matHeaderCellDef>Team name</th>
    <td mat-cell *matCellDef="let row"> {{row.teamName}} </td>
  </ng-container>

  <!-- willCaptain Column -->
  <ng-container matColumnDef="willCaptain">
    <th mat-header-cell *matHeaderCellDef>Will captain</th>
    <td mat-cell *matCellDef="let row"> {{row.willCaptain}} </td>
  </ng-container>

  <!-- requiresAssistanceDrafting Column -->
  <ng-container matColumnDef="requiresAssistanceDrafting">
    <th mat-header-cell *matHeaderCellDef>Needs drafting help</th>
    <td mat-cell *matCellDef="let row"> {{row.requiresAssistanceDrafting}} </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>
</div>

}
</div>
