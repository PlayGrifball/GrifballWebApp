@if (dtos().length > 0) {
<div class="hud-table-wrap">
<table mat-table [dataSource]="dtos()" [trackBy]="trackRow">
  @for (time of timeColumns(); track time) {
  <ng-container [matColumnDef]="time">
    <th mat-header-cell *matHeaderCellDef>
      @if (time === timeColumns()[0]) { {{time}} } @else {
      <button type="button" class="hud-cell-btn" (click)="timeClicked(time)" [attr.aria-label]="'Toggle ' + time + ' on every day'">{{time}}</button>
      }
    </th>
    <td mat-cell *matCellDef="let row">
      @if (getCell(time, row); as cell) {
        @if (cell.isHeader) {
        <button type="button" class="hud-cell-btn" (click)="dayOfWeekClicked(cell.time, row)">
          {{ cell.time }}
        </button>
        }
        @else {
        <mat-checkbox [ngModel]="cell.isChecked" (ngModelChange)="setChecked([cell], $event)" [disabled]="cell.isDisabled" [aria-label]="row[0].time + ' ' + cell.time" />
        }
      }
    </td>
  </ng-container>
  }
  <tr mat-header-row *matHeaderRowDef="timeColumns()"></tr>
  <tr mat-row *matRowDef="let row; columns: timeColumns();"></tr>
</table>
</div>
}
