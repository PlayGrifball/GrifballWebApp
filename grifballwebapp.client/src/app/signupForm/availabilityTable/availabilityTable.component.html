@if (dtos().length > 0) {
<table mat-table [dataSource]="dtos()" [trackBy]="trackRow" class="mat-elevation-z8">
  @for (time of timeColumns(); track time) {
  <ng-container [matColumnDef]="time">
    <th mat-header-cell *matHeaderCellDef (click)="timeClicked(time)">
      {{time}}
    </th>
    <td mat-cell *matCellDef="let row">
      @if (getCell(time, row); as cell) {
        @if (cell.isHeader) {
        <div (click)="dayOfWeekClicked(cell.time, row)">
          {{ cell.time }}
        </div>
        }
        @else {
        <mat-checkbox [ngModel]="cell.isChecked" (ngModelChange)="setChecked([cell], $event)" [disabled]="cell.isDisabled" />
        }
      }
    </td>
  </ng-container>
  }
  <tr mat-header-row *matHeaderRowDef="timeColumns()"></tr>
  <tr mat-row *matRowDef="let row; columns: timeColumns();"></tr>
</table>
}
