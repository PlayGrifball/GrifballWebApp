<div class="theme-head">
  <h2 class="hud-h2" id="theme-title">Theme</h2>
  <div class="theme-head__actions">
    <button class="hud-btn" type="button" (click)="reset()">Reset to Spartan HUD</button>
    @if (dialogRef) {
      <button mat-icon-button type="button" class="theme-close" aria-label="Close" (click)="close()">
        <mat-icon>close</mat-icon>
      </button>
    }
  </div>
</div>

<div class="theme-body">
  <mat-form-field appearance="outline" class="theme-font">
      <mat-label>Font</mat-label>
      <mat-select [formControl]="font" name="font">
        @for (font of fonts; track font) {
          <mat-option [value]="font">{{font}}</mat-option>
        }
      </mat-select>
  </mat-form-field>

  <!-- Re-created on a reset, so each editor starts again from the reset colour. -->
  @for (generation of [resets()]; track generation) {
  <app-palette paletteName="primary" />
  <app-palette paletteName="secondary" />
  <app-palette paletteName="tertiary" />
  <app-palette paletteName="neutral" />
  <app-palette paletteName="neutral-variant" />
  <app-palette paletteName="error" />
  }
</div>

@if (dialogRef) {
  <div class="theme-foot">
    <button class="hud-btn hud-btn--primary" type="button" (click)="close()">Done</button>
  </div>
}
