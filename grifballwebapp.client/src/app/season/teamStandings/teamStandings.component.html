<div class="hud-table-wrap">
  <table mat-table [dataSource]="teamStandings()" class="standings">

    <ng-container matColumnDef="rank">
      <th mat-header-cell *matHeaderCellDef class="standings__rank">#</th>
      <td mat-cell *matCellDef="let row; let i = index" class="standings__rank" [class.hud-gold]="i === 0">{{i + 1}}</td>
    </ng-container>

    <ng-container matColumnDef="teamName">
      <th mat-header-cell *matHeaderCellDef>Team</th>
      <td mat-cell *matCellDef="let row"><a class="standings__team" [routerLink]="['team', row.teamID]">{{row.teamName}}</a></td>
    </ng-container>

    <ng-container matColumnDef="wins">
      <th mat-header-cell *matHeaderCellDef class="hud-num">W</th>
      <td mat-cell *matCellDef="let row" class="hud-num">{{row.wins}}</td>
    </ng-container>

    <ng-container matColumnDef="losses">
      <th mat-header-cell *matHeaderCellDef class="hud-num">L</th>
      <td mat-cell *matCellDef="let row" class="hud-num">{{row.losses}}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns; let i = index" [class.standings__leader]="i === 0"></tr>
  </table>
  @if (loaded() && teamStandings().length === 0) {
    <p class="standings__empty hud-muted">No standings yet.</p>
  }
</div>
