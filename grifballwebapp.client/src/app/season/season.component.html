<div class="hud-page" [class.hud-waiting]="!nameLoaded()">

  <div class="season-head">
    <div class="hud-page-head">
      <span class="hud-kicker">&gt; {{kicker()}}</span>
      <h1 class="hud-title">{{seasonName()}}</h1>
    </div>
    <div class="hud-actions">
      <a class="hud-btn" [routerLink]="['signupForm']">Sign up</a>
    </div>
  </div>

  <app-season-tabs [seasonID]="seasonID()" [active]="view()" />

  @switch (view()) {
    @case ('schedule') {
      <section class="hud-section" aria-labelledby="season-schedule">
        <h2 id="season-schedule" class="hud-h2">Regular season schedule</h2>
        <app-schedule-list />
      </section>
    }
    @case ('bracket') {
      <section class="hud-section" aria-labelledby="season-bracket">
        <h2 id="season-bracket" class="hud-h2">Playoffs</h2>
        <app-playoff-bracket />
      </section>
    }
    @default {
      <div class="season-overview">
        <section class="hud-section season-overview__standings" aria-labelledby="season-standings">
          <h2 id="season-standings" class="hud-h2">Standings</h2>
          <app-team-standings #standings />
        </section>
        <!-- Below the standings on phones: shown once they are in, so they do not push it down. -->
        <aside class="hud-section season-overview__week" aria-labelledby="season-week" [class.hud-waiting]="!standings.loaded()">
          <h2 id="season-week" class="hud-h2">This week</h2>
          <app-season-this-week [seasonID]="seasonID()" />
        </aside>
      </div>
    }
  }

</div>
