<h2 mat-dialog-title>Set Custom Seed Order</h2>

<mat-dialog-content>
  @if (loading()) {
    <p>Loading team standings...</p>
  } @else {
    <p>Drag and drop teams to reorder their seeding:</p>
    
    <div class="seed-list"
         dndDropzone
         [dndDropzone]="['team']"
         (dndDrop)="onDrop($event)">
      
      <!-- Placeholder for drag and drop -->
      <div class="seed-item dndPlaceholder" dndPlaceholderRef>
        <div class="seed-content">
          <div class="seed-number">-</div>
          <div class="team-info">
            <div class="team-name">Drop here</div>
          </div>
        </div>
      </div>
      
      @for (team of teams(); track team.teamID; let i = $index) {
        <div class="seed-item"
             [dndDraggable]="team"
             dndEffectAllowed="move"
             [dndType]="'team'">
        
        <div class="seed-content">
          <div class="seed-number">{{ team.seed }}</div>
          <div class="team-info">
            <div class="team-name">{{ team.teamName }}</div>
            <div class="team-record">{{ team.wins }}W - {{ team.losses }}L</div>
          </div>
          <!-- The same moves without dragging: for the keyboard and screen readers -->
          <button mat-icon-button type="button" [disabled]="i === 0" (click)="move(i, -1)" [attr.aria-label]="'Move ' + team.teamName + ' up'">
            <mat-icon>arrow_upward</mat-icon>
          </button>
          <button mat-icon-button type="button" [disabled]="i === teams().length - 1" (click)="move(i, 1)" [attr.aria-label]="'Move ' + team.teamName + ' down'">
            <mat-icon>arrow_downward</mat-icon>
          </button>
          <mat-icon class="drag-handle" aria-hidden="true">drag_indicator</mat-icon>
        </div>
      </div>
      }
    </div>
  }
</mat-dialog-content>

<mat-dialog-actions>
  <button mat-button (click)="onCancel()">Cancel</button>
  <button mat-flat-button 
          color="primary" 
          (click)="onSubmit()" 
          [disabled]="loading()">
    Set Seeds
  </button>
</mat-dialog-actions>
