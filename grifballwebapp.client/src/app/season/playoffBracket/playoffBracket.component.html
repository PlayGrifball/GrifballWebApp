@if (accountService.isEventOrganizer()) {
<div class="hud-actions">
  <button mat-flat-button (click)="openDialog()">Create Bracket</button>
  <button mat-stroked-button (click)="setSeeds()">Set Seeds</button>
</div>
}

@if(!hasBracket()) {
  <p class="hud-empty">No bracket created</p>
}
<div class="bracket-box" [hidden]="!hasBracket()">
  <div class="brackets-viewer"></div>
</div>
@if (hasBracket()) {
<div class="bracket-legend">
  <span class="bracket-legend__key"><span class="bracket-legend__swatch" aria-hidden="true"></span>Advanced</span>
  <span>BYE = auto-advance</span>
  <span>Select a match to open it</span>
</div>
}
