@if (profile()?.files?.length) {
  <div class="spartan-files">
    @if (hasFile('neutral-body')) { <img [src]="fileUrl('neutral-body')" [alt]="name() + ', full body'" width="350" height="500"> }
    @if (hasFile('stance-body')) { <img [src]="fileUrl('stance-body')" [alt]="name() + ' in their stance'" width="350" height="500"> }
    @if (hasFile('neutral-head')) { <img [src]="fileUrl('neutral-head')" [alt]="name() + '\'s helmet'" width="350" height="500"> }
  </div>
  @if (hasFile('glb')) {
    <div class="spartan-model">
      <app-spartan-viewer [url]="fileUrl('glb')" [clip]="pose()" [label]="name() + ' in 3D'" (clipNames)="shown($event)" />
      @if (poses().length > 1) {
        <div class="spartan-actions">
          <label [for]="'spartan-pose-' + userID()">Pose</label>
          <select [id]="'spartan-pose-' + userID()" (change)="choose($event)">
            @for (p of poses(); track p.clip) { <option [value]="p.clip" [selected]="p.clip === pose()">{{p.label}}</option> }
          </select>
        </div>
      }
    </div>
  }
}
