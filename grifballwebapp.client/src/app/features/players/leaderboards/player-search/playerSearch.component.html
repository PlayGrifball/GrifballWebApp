<label for="playerSearchInput" class="hud-label">Find player standing</label>
<div class="search">
  <span class="search__field">
    <input
      id="playerSearchInput"
      type="text"
      autocomplete="off"
      role="combobox"
      aria-autocomplete="list"
      aria-controls="playerSearchList"
      [attr.aria-expanded]="open()"
      [attr.aria-activedescendant]="active() >= 0 ? 'playerSearchOption' + active() : null"
      placeholder="Search player or past gamertag..."
      [value]="query()"
      (input)="onInput($any($event.target).value)"
      (keydown)="onKeydown($event)"
      (blur)="close()"
    />
    @if (query()) {
      <button type="button" class="search__clear" aria-label="Clear search" (click)="clear()">✕</button>
    }
  </span>
  <button type="button" class="hud-btn" (click)="submit()">Search</button>

  <ul id="playerSearchList" class="search__list" role="listbox" aria-label="Players found" [hidden]="!open()">
    @for (res of results(); track res.userID; let i = $index) {
      <li [id]="'playerSearchOption' + i" role="option" [attr.aria-selected]="i === active()" [class.search__option--active]="i === active()" (mousedown)="pick(res)">
        <strong>{{ res.name }}</strong>
        @let said = detail(res);
        @if (said) {
          <span class="hud-muted"> {{ said }}</span>
        }
      </li>
    }
  </ul>
</div>
