<div class="hud-page hud-page--narrow login">

  <section class="login-panel hud-panel hud-panel--chamfer-lg" aria-labelledby="login-title">
    <div class="hud-page-head">
      <span class="hud-kicker">&gt; Identify, Spartan</span>
      <h1 id="login-title" class="hud-title hud-title--md">Login</h1>
    </div>

    <form class="app-form" #loginForm="ngForm" (ngSubmit)="onSubmit()">
      <mat-form-field appearance="outline" class="app-full-width">
        <mat-label>Username</mat-label>
        <input matInput required [(ngModel)]="model.username" name="username" autocomplete="username">
        <app-error-message [control]="loginForm.controls['username']" />
      </mat-form-field>

      <mat-form-field appearance="outline" class="app-full-width">
        <mat-label>Password</mat-label>
        <input matInput [type]="hide ? 'password' : 'text'" required [(ngModel)]="model.password" name="password" autocomplete="current-password">
        <button mat-icon-button matSuffix type="button" (click)="hide = !hide" [attr.aria-label]="'Hide password'" [attr.aria-pressed]="hide">
          <mat-icon>{{hide ? 'visibility_off' : 'visibility'}}</mat-icon>
        </button>
        <app-error-message [control]="loginForm.controls['password']" />
      </mat-form-field>

      <button class="hud-btn hud-btn--primary" [disabled]="!loginForm.form.valid">
        Submit
      </button>
    </form>

    @if (accountService.isLoggedIn()) {
    <button class="hud-btn" (click)="accountService.logout()">
      Logout
    </button>
    }
  </section>

  <aside class="login-side hud-section">
    <h2 class="hud-h2">External Login Providers:</h2>
    <a class="login-discord" [href]="discordUrl()">
      <img src="https://assets-global.website-files.com/6257adef93867e50d84d30e2/636e0b5061df29d55a92d945_full_logo_blurple_RGB.svg"
           alt="Sign in with Discord" width="509" height="96">
    </a>

    <h2 class="hud-h2">Not registered?</h2>
    <a class="hud-btn" [routerLink]="['/register']">Register</a>
  </aside>

</div>
