<div class="hud-page hud-page--narrow">
  <section class="hud-panel hud-panel--chamfer-lg reset-panel" aria-labelledby="reset-title">
    <div class="hud-page-head">
      <span class="hud-kicker">&gt; Account recovery</span>
      <h1 id="reset-title" class="hud-title hud-title--md">Reset Your Password</h1>
      <p class="hud-muted reset-sub">Enter your new password below</p>
    </div>

    <form class="password-reset-form" #resetForm="ngForm" (ngSubmit)="onSubmit()">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>New Password</mat-label>
        <input matInput
               [type]="hide ? 'password' : 'text'"
               required
               minlength="6"
               [(ngModel)]="model.newPassword"
               name="newPassword"
               autocomplete="new-password">
        <button mat-icon-button matSuffix (click)="hide = !hide" [attr.aria-label]="'Hide password'" [attr.aria-pressed]="hide" type="button">
          <mat-icon>{{hide ? 'visibility_off' : 'visibility'}}</mat-icon>
        </button>
        <mat-hint>At least 6 characters</mat-hint>
        <app-error-message [control]="resetForm.controls['newPassword']" />
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Confirm New Password</mat-label>
        <input matInput
               [type]="hideConfirm ? 'password' : 'text'"
               required
               minlength="6"
               [(ngModel)]="model.confirmPassword"
               name="confirmPassword"
               autocomplete="new-password">
        <button mat-icon-button matSuffix (click)="hideConfirm = !hideConfirm" [attr.aria-label]="'Hide password'" [attr.aria-pressed]="hideConfirm" type="button">
          <mat-icon>{{hideConfirm ? 'visibility_off' : 'visibility'}}</mat-icon>
        </button>
        <app-error-message [control]="resetForm.controls['confirmPassword']" />
      </mat-form-field>

      <div class="hud-actions">
        <button mat-flat-button
                type="submit"
                [disabled]="!resetForm.form.valid || isLoading()">
          @if (isLoading()) {
            Resetting Password...
          } @else {
            Reset Password
          }
        </button>

        <a mat-stroked-button routerLink="/login">
          Back to Login
        </a>
      </div>
    </form>
  </section>
</div>
