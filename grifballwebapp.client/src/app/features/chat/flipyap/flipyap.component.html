@if (!onChatPage()) {
  <div class="flipyap" #box [style.right.px]="margin - offset().x" [style.bottom.px]="margin - offset().y"
       [style.--flipyap-chat-room.px]="chatRoomPx()" [class.flipyap--below]="nearTop()" [class.flipyap--start]="nearLeft()">
    @if (everOpened()) {
      <div class="flipyap__chat" id="flipyap-chat" role="region" aria-label="Chat with Flipyap" [hidden]="!open()">
        @defer (when everOpened()) {
          <app-flipyap-chat (closed)="close()" (talking)="onTalking($event)" />
        }
      </div>
    }
    @if (greeting() && !open()) {
      <p class="flipyap__greeting">Wawawa! Flipyap know the league. Ask!</p>
    }
    <button #pet class="flipyap__pet" type="button" aria-label="Chat with Flipyap" aria-controls="flipyap-chat"
            [attr.aria-expanded]="open()" [class.flipyap__pet--hop]="hopping()" [class.flipyap__pet--held]="held()"
            (click)="toggle()" (pointerdown)="onPointerDown($event)" (pointermove)="onPointerMove($event)"
            (pointerup)="onPointerEnd($event)" (pointercancel)="onPointerEnd($event)">
      <svg class="flipyap__sprite" [attr.viewBox]="'0 0 ' + size + ' ' + size" shape-rendering="crispEdges" aria-hidden="true">
        @for (pixel of pixels(); track $index) {
          <rect [attr.x]="pixel.x" [attr.y]="pixel.y" width="1" height="1" [attr.fill]="pixel.fill" />
        }
      </svg>
    </button>
  </div>
}
