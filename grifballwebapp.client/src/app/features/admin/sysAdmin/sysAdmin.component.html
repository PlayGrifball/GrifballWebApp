<div class="hud-page">
  <div class="hud-page-head">
    <span class="hud-kicker">&gt; Admin</span>
    <h1 class="hud-title hud-title--md">SysAdmin</h1>
  </div>

  <nav class="hud-grid" aria-label="SysAdmin tools">
    @for (tool of tools; track tool.path) {
      <a class="hud-card" [routerLink]="tool.path">
        <span class="hud-card__title">{{tool.title}}</span>
        <span>{{tool.description}}</span>
      </a>
    }
  </nav>
</div>
