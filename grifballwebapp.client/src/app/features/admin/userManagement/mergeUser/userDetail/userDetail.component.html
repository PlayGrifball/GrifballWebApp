@if (user(); as u) {
  <dl class="hud-details hud-well detail">
    <dt>ID</dt><dd>{{ u.userID }}</dd>
    <dt>Username</dt><dd>{{ u.userName }}</dd>
    <dt>Display name</dt><dd>{{ u.displayName }}</dd>
    <dt>Gamertag</dt><dd>{{ u.gamertag }}</dd>
    <dt>Discord</dt><dd>{{ u.discord }}</dd>
    <dt>Linked logins</dt><dd>{{ u.externalAuthCount }}</dd>
  </dl>
} @else {
  <p class="hud-empty">User not found.</p>
}
