<h2>Edit User {{model().userID}}</h2>

<form class="app-form" #userForm="ngForm" (ngSubmit)="onSubmit()">
  <mat-form-field class="app-full-width">
    <mat-label>userName</mat-label>
    <input matInput required [ngModel]="model().userName" (ngModelChange)="patch({ userName: $event })" name="userName">
    <app-error-message [control]="userForm.controls['userName']" />
  </mat-form-field>

  <mat-form-field class="app-full-width">
    <mat-label>lockoutEnd</mat-label>
    <input matInput [mtxDatetimepicker]="datetimePicker1" [ngModel]="model().lockoutEnd" (ngModelChange)="patch({ lockoutEnd: $event })" name="lockoutEnd">
    <mtx-datetimepicker-toggle [for]="datetimePicker1" matSuffix />
    <mtx-datetimepicker #datetimePicker1 [timeInput]="true" [twelvehour]="true" type="datetime" />
    <app-error-message [control]="userForm.controls['lockoutEnd']" />
  </mat-form-field>

  <mat-checkbox [ngModel]="model().lockoutEnabled" (ngModelChange)="patch({ lockoutEnabled: $event })" name="lockoutEnabled">
    Lockout Enabled
  </mat-checkbox>

  <mat-checkbox [ngModel]="model().isDummyUser" (ngModelChange)="patch({ isDummyUser: $event })" name="isDummyUser">
    Is Dummy User
  </mat-checkbox>

  <div>Roles:</div>
  <div>
    @for (role of model().roles; track i; let i = $index) {
    <mat-checkbox [ngModel]="role.hasRole" (ngModelChange)="setRole(i, $event)" [ngModelOptions]="{standalone: true}">{{role.roleName}}</mat-checkbox>
    }
  </div>

  <mat-form-field class="app-full-width">
    <mat-label>displayName</mat-label>
    <input matInput [ngModel]="model().displayName" (ngModelChange)="patch({ displayName: $event })" name="displayName">
    <app-error-message [control]="userForm.controls['displayName']" />
  </mat-form-field>

  <mat-form-field class="app-full-width">
    <mat-label>gamertag</mat-label>
    <input matInput [ngModel]="model().gamertag" (ngModelChange)="patch({ gamertag: $event })" name="gamertag">
    <app-error-message [control]="userForm.controls['gamertag']" />
  </mat-form-field>

  <button mat-flat-button color="primary" [disabled]="!userForm.form.valid">
    Update User
  </button>
</form>

@if (model().userID) {
<app-linked-accounts [userID]="model().userID" />
}
