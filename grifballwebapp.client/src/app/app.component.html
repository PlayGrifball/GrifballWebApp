<div class="app-container">
  <a class="skip-link" href="#main">Skip to content</a>

  <app-toolbar [snav]="snav" [showMenu]="showMenu()">
    <div class="toolbar-links">
      <a class="nav-link" [routerLink]="'/'" style="visibility: hidden; position: absolute;" id="hidden" aria-hidden="true" tabindex="-1">
        Hidden
      </a>
      @for (nav of visibleNavLinks(); track nav) {
        @if (nav.show()) {
          <a class="nav-link" [routerLink]="nav.path" routerLinkActive="nav-link--active"
             [routerLinkActiveOptions]="{ exact: nav.path === '' }" ariaCurrentWhenActive="page">
            {{nav.title}}
          </a>
        }
      }
    </div>
  </app-toolbar>

  <mat-sidenav-container class="app-sidenav-container">

    <mat-sidenav #snav [mode]="'over'" class="app-drawer">
      <div class="app-drawer__head">
        <span class="hud-label hud-label--accent">&gt; Navigation</span>
        <button mat-icon-button (click)="snav.close()" aria-label="Close menu">
          <mat-icon>close</mat-icon>
        </button>
      </div>
      <nav class="app-drawer__links" aria-label="Menu">
        @for (nav of navLinks(); track nav) {
          @if (nav.show()) {
            <a class="app-drawer__link" [routerLink]="nav.path" routerLinkActive="app-drawer__link--active"
               [routerLinkActiveOptions]="{ exact: nav.path === '' }" ariaCurrentWhenActive="page"
               (click)="snav.toggle(false)">
              {{ nav.title }}
            </a>
          }
        }
      </nav>
    </mat-sidenav>

    <mat-sidenav-content class="app-content">
      <main id="main" tabindex="-1">
        <router-outlet />
      </main>
      <app-site-footer />
    </mat-sidenav-content>

  </mat-sidenav-container>

</div>
