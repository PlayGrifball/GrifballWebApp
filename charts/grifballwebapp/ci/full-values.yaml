# Most features on: the chart's SQL Server with an NFS backup volume, a Traefik IngressRoute,
# OpenTelemetry, settings from Secrets. Example values only. Rendered and schema-checked by the Helm
# chart workflow.
defaultServiceAccount:
  manage: true
database:
  connectionString:
    secretName: grif-secrets
    key: SQL_CONNECTION_STRING
backend:
  image:
    tag: test
    pullPolicy: Always
  config:
    Discord:
      DisableGlobally: null
    GoogleSheets:
      Sheets:
        - Name: Example
          SpreadsheetID: example-spreadsheet-id
          SheetName: Season Match History
    ForwardedHeaders:
      KnownIPNetworks: [10.0.0.0/16]
      ForwardedForHeaderName: X-Real-IP
  secretConfig:
    Discord:ClientId: DiscordClientId
    Discord:ClientSecret: DiscordClientSecret
    Discord:Token: DiscordToken
    Discord:DraftChannel: DiscordDraftChannel
    Discord:DisableGlobally: DiscordDisableGlobally
    Discord:QueueChannel: DiscordQueueChannel
    Discord:EventsChannel: DiscordEventsChannel
    ClientConfiguration:ClientId: InfiniteClientId
    ClientConfiguration:ClientSecret: InfiniteClientSecret
    ClientConfiguration:RedirectUrl: InfiniteRedirectUrl
    BaseUrl: BaseUrl
  telemetry:
    enabled: true
    endpoint: http://otel-collector.example:4317
    environment: test
  googleCredentials:
    secretName: google-credentials
  persistence:
    storageClass: standard
frontend:
  image:
    tag: test
    pullPolicy: Always
ingressRoute:
  enabled: true
  host: grifball.example
  middlewares:
    - name: security-headers
      namespace: traefik
  tls:
    secretName: grifball-tls
mssql:
  acceptEula: true
  loadBalancer:
    enabled: true
    port: 14330
  persistence:
    storageClass: standard
  backup:
    nfs:
      server: nfs.example
      path: /exports/sql-backups
mssqlTools:
  enabled: true
