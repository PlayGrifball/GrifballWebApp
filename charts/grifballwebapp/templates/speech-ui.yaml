{{- $s := .Values.speech -}}
{{- if and $s.enabled $s.ui.enabled }}
{{- with $s.ui.ingress }}
{{- if .enabled }}
# speaches' web UI (speech.ui), through an Ingress.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grif-speech-ui
  labels:
    {{- include "grif.labels" $ | nindent 4 }}
    app.kubernetes.io/component: speech
  {{- with .annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range required "speech.ui.ingress.hosts is required when speech.ui.ingress.enabled" .hosts }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grif-speech
                port:
                  name: speech
    {{- end }}
---
{{- end }}
{{- end }}
{{- with $s.ui.ingressRoute }}
{{- if .enabled }}
# speaches' web UI (speech.ui), through a Traefik IngressRoute: put a login on it with middlewares.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ .name }}
  labels:
    {{- include "grif.labels" $ | nindent 4 }}
    app.kubernetes.io/component: speech
  {{- with .annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .entryPoints }}
  entryPoints:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  routes:
    {{- range .extraRoutes }}
    - {{ toYaml . | nindent 6 | trim }}
    {{- end }}
    - match: Host(`{{ required "speech.ui.ingressRoute.host is required when speech.ui.ingressRoute.enabled" .host }}`)
      kind: Rule
      {{- with .middlewares }}
      middlewares:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      services:
        - name: grif-speech
          port: {{ $s.port }}
  {{- with .tls.secretName }}
  tls:
    secretName: {{ . }}
  {{- end }}
---
{{- end }}
{{- end }}
{{- end }}
