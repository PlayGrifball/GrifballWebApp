{{- $b := .Values.backend -}}
{{- if and $b.persistence.enabled (not $b.persistence.existingClaim) }}
# The backend's working directory, where Grunt kept the Halo Infinite tokens before they moved to the
# database (imported from here once).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $b.persistence.claimName }}
  labels:
    {{- include "grif.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
  {{- with $b.persistence.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  accessModes:
    {{- toYaml $b.persistence.accessModes | nindent 4 }}
  resources:
    requests:
      storage: {{ $b.persistence.size }}
  {{- with $b.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
---
{{- end }}
{{- if and (gt (int $b.replicas) 1) (not .Values.worker.enabled) }}
{{- fail "backend.replicas above 1 needs worker.enabled: the Discord gateway and the background services must run in one process only" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grif-backend
  labels:
    {{- include "grif.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ $b.replicas }}
  selector:
    matchLabels:
      app: grif-backend
  strategy:
    {{- toYaml (include "grif.backendStrategy" . | fromYaml) | nindent 4 }}
  template:
    {{- /* With a worker: the API role, and the state volume is the worker's. */}}
    {{- $worker := .Values.worker.enabled }}
    {{- include "grif.backendPodTemplate" (dict "root" . "app" "grif-backend" "component" "backend" "role" (ternary "api" "" $worker) "state" (and $b.persistence.enabled (not $worker)) "pod" $b) | nindent 4 }}
---
# The frontend's nginx proxies /api to this name and port.
apiVersion: v1
kind: Service
metadata:
  name: {{ $b.service.name }}
  labels:
    {{- include "grif.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
  {{- with $b.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ $b.service.type }}
  selector:
    app: grif-backend
  ports:
    - name: http
      port: {{ $b.port }}
      targetPort: http
