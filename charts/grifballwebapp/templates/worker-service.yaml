{{- if .Values.worker.enabled }}
# The API pods' way to the worker: the Database Backup page's file, made by a job on the worker, is fetched
# from it (DatabaseBackup:WorkerUrl), with a token only the app's pods can make.
apiVersion: v1
kind: Service
metadata:
  name: grif-worker
  labels:
    {{- include "grif.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  selector:
    app: grif-worker
  ports:
    - name: http
      port: {{ .Values.backend.port }}
      targetPort: http
{{- end }}
