{{- $o := .Values.ollama -}}
{{- if and $o.enabled $o.external.url }}
{{- fail "ollama: enable the chart's (ollama.enabled) or name an external one (ollama.external.url), not both" }}
{{- end }}
{{- if $o.enabled }}
{{- if not $o.model }}
{{- fail "ollama.model is required with ollama.enabled: the model the chart's server pulls and the chats use" }}
{{- end }}
{{- if and (not $o.pull.enabled) (not $o.persistence.existingClaim) }}
{{- fail "ollama.persistence.existingClaim is required with ollama.pull.enabled false: the volume the model is on already" }}
{{- end }}
{{- if and $o.gpu.enabled (not $o.gpu.resources) }}
{{- fail "ollama.gpu.resources is required with ollama.gpu.enabled: the GPU resource the cluster offers (squat.ai/dri: 1, amd.com/gpu: 1, nvidia.com/gpu: 1)" }}
{{- end }}
{{- if not $o.persistence.existingClaim }}
# The models, kept across restarts: the init container pulls the model once, and finds it here after.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $o.persistence.claimName }}
  labels:
    {{- include "grif.labels" . | nindent 4 }}
    app.kubernetes.io/component: ollama
  {{- with $o.persistence.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  accessModes:
    {{- toYaml $o.persistence.accessModes | nindent 4 }}
  resources:
    requests:
      storage: {{ $o.persistence.size }}
  {{- with $o.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
---
{{- end }}
# The chats' model: an Ollama server for the site's chat and the Discord bot's (Ollama:Url).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grif-ollama
  labels:
    {{- include "grif.labels" . | nindent 4 }}
    app.kubernetes.io/component: ollama
    {{- with include "grif.onDemandLabels" (dict "root" . "component" "ollama" "replicas" 1) | trim }}{{ . | nindent 4 }}{{ end }}
spec:
  {{- with include "grif.replicas" (dict "root" . "component" "ollama" "replicas" 1) }}
  {{ . }}
  {{- end }}
  selector:
    matchLabels:
      app: grif-ollama
  # One server on the models' ReadWriteOnce volume at a time.
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: grif-ollama
        {{- include "grif.podLabels" . | nindent 8 }}
        app.kubernetes.io/component: ollama
        {{- with $o.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with $o.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $podSecurity := deepCopy ($o.podSecurityContext | default dict) }}
      {{- if and $o.gpu.enabled $o.gpu.supplementalGroups }}
      {{- $_ := set $podSecurity "supplementalGroups" $o.gpu.supplementalGroups }}
      {{- end }}
      {{- with $podSecurity }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        # The model, pulled onto the volume unless it is there already: a restart downloads nothing. The pull talks
        # to a server of its own, on localhost, that ends with this container. Within ollama.pull.timeoutSeconds,
        # the server's start and the download together, so a server that never starts or a stalled download fails
        # the pod instead of leaving it in Init. With ollama.pull.enabled false it downloads nothing, and only checks
        # the model is on the existing volume.
        - name: {{ ternary "pull-model" "check-model" $o.pull.enabled }}
          image: {{ include "grif.image" $o.image }}
          imagePullPolicy: {{ $o.image.pullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              deadline=$(( $(date +%s) + GRIF_OLLAMA_PULL_TIMEOUT ))
              ollama serve >/dev/null 2>&1 &
              until ollama list >/dev/null 2>&1; do
                if [ "$(date +%s)" -ge "$deadline" ]; then
                  echo "the local Ollama server didn't start within ${GRIF_OLLAMA_PULL_TIMEOUT}s (ollama.pull.timeoutSeconds)" >&2
                  exit 1
                fi
                sleep 1
              done
              if ollama show "$GRIF_OLLAMA_MODEL" >/dev/null 2>&1; then
                echo "$GRIF_OLLAMA_MODEL is on the volume already"
                exit 0
              fi
              {{- if $o.pull.enabled }}
              remaining=$(( deadline - $(date +%s) ))
              [ "$remaining" -gt 0 ] || remaining=1
              timeout "$remaining" ollama pull "$GRIF_OLLAMA_MODEL"
              status=$?
              if [ "$status" -eq 124 ]; then
                echo "$GRIF_OLLAMA_MODEL wasn't pulled within ${GRIF_OLLAMA_PULL_TIMEOUT}s (ollama.pull.timeoutSeconds)" >&2
              fi
              exit "$status"
              {{- else }}
              echo "$GRIF_OLLAMA_MODEL isn't on the volume, and ollama.pull.enabled is false" >&2
              exit 1
              {{- end }}
          env:
            {{- include "grif.ollamaEnv" . | nindent 12 }}
            - name: GRIF_OLLAMA_MODEL
              value: {{ $o.model | quote }}
            - name: GRIF_OLLAMA_PULL_TIMEOUT
              value: {{ $o.pull.timeoutSeconds | quote }}
          # Alone before the server starts, so the same resources: limited like every other container
          {{- with $o.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $o.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      containers:
        - name: ollama
          image: {{ include "grif.image" $o.image }}
          imagePullPolicy: {{ $o.image.pullPolicy }}
          args: ["serve"]
          env:
            {{- include "grif.ollamaEnv" . | nindent 12 }}
            # Every pod's address, not only localhost: the backend, the workers and grif-discord (NetworkPolicy).
            - name: OLLAMA_HOST
              value: {{ printf "0.0.0.0:%v" $o.port | quote }}
            {{- if $o.gpu.enabled }}
            {{- range $name, $value := $o.gpu.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
          ports:
            - name: ollama
              containerPort: {{ $o.port }}
          readinessProbe:
            httpGet:
              path: /
              port: ollama
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: ollama
            periodSeconds: 20
          # With a GPU: its resource beside the CPU and memory ones (the pull above needs none)
          {{- $resources := deepCopy ($o.resources | default dict) }}
          {{- if $o.gpu.enabled }}
          {{- $limits := merge (deepCopy ($resources.limits | default dict)) $o.gpu.resources }}
          {{- $_ := set $resources "limits" $limits }}
          {{- end }}
          {{- with $resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $o.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ $o.persistence.existingClaim | default $o.persistence.claimName }}
        - name: tmp
          emptyDir: {}
      {{- with $o.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $o.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $o.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: grif-ollama
  labels:
    {{- include "grif.labels" . | nindent 4 }}
    app.kubernetes.io/component: ollama
spec:
  selector:
    app: grif-ollama
  ports:
    - name: ollama
      port: {{ $o.port }}
      targetPort: ollama
{{- end }}
