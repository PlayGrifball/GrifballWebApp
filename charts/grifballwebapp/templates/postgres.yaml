{{- $p := .Values.postgres -}}
{{- if include "grif.postgres" . }}
{{- with .Values.migrations.backup }}
{{- if .enabled }}
{{- /* The backup volume: pg_dump runs in the chart's pods, so it's theirs, the chart's PostgreSQL or not. */}}
{{- with .volume }}
{{- if not .existingClaim }}
{{- if .nfs.server }}
# Not namespaced: named after the namespace, so each release's export is its own; -pg-, so it's never
# SQL Server's (mssql.backup) after a switch of provider.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ $.Release.Namespace }}-pg-nfs-pv
  labels:
    {{- include "grif.labels" $ | nindent 4 }}
    app.kubernetes.io/component: backup
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    {{- with .annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  capacity:
    storage: {{ .size }}
  accessModes:
    {{- toYaml .accessModes | nindent 4 }}
  storageClassName: ""
  nfs:
    server: {{ .nfs.server }}
    path: {{ required "migrations.backup.volume.nfs.path is required with nfs.server" .nfs.path }}
---
{{- end }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .claimName }}
  labels:
    {{- include "grif.labels" $ | nindent 4 }}
    app.kubernetes.io/component: backup
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    {{- with .annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  accessModes:
    {{- toYaml .accessModes | nindent 4 }}
  resources:
    requests:
      storage: {{ .size }}
  {{- if .nfs.server }}
  storageClassName: ""
  volumeName: {{ $.Release.Namespace }}-pg-nfs-pv
  {{- else if .storageClass }}
  storageClassName: {{ .storageClass }}
  {{- end }}
---
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- /* PostgreSQL is sync wave -2 under Argo CD, as SQL Server: up before the migration Job (-1) and the app (0). */}}
{{- if $p.enabled }}
{{- if not $p.persistence.existingClaim }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $p.persistence.claimName }}
  labels:
    {{- include "grif.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    {{- with $p.persistence.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  accessModes:
    {{- toYaml $p.persistence.accessModes | nindent 4 }}
  resources:
    requests:
      storage: {{ $p.persistence.size }}
  {{- with $p.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $p.service.name }}
  labels:
    {{- include "grif.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  type: ClusterIP
  selector:
    app: grif-postgres
  ports:
    - name: postgres
      port: {{ $p.service.port }}
      targetPort: postgres
---
{{- with $p.loadBalancer }}
{{- if .enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .name }}
  labels:
    {{- include "grif.labels" $ | nindent 4 }}
    app.kubernetes.io/component: postgres
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    {{- with .annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  type: LoadBalancer
  selector:
    app: grif-postgres
  ports:
    - name: postgres
      port: {{ .port }}
      targetPort: postgres
---
{{- end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grif-postgres
  labels:
    {{- include "grif.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grif-postgres
  # Stop the old PostgreSQL before starting the new one: a ReadWriteOnce volume allows every pod on the
  # same node, and two servers must never share one data folder.
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: grif-postgres
        {{- include "grif.podLabels" . | nindent 8 }}
        app.kubernetes.io/component: postgres
        {{- with $p.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with $p.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $p.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        # PostgreSQL runs as 70 and creates its data folder (<major>/docker) in the volume, whose root
        # kubelet may leave root-owned. PostgreSQL's own image, as root: nothing else to pull.
        - name: fix-permissions-data
          image: {{ include "grif.image" $p.image }}
          imagePullPolicy: {{ $p.image.pullPolicy }}
          command: ["sh", "-c", "chown -R 70:70 /var/lib/postgresql"]
          securityContext:
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql
      containers:
        - name: grif-postgres
          image: {{ include "grif.image" $p.image }}
          imagePullPolicy: {{ $p.image.pullPolicy }}
          {{- with $p.settings }}
          args:
            - postgres
            {{- range $name, $value := . }}
            - -c
            - {{ printf "%s=%v" $name $value | quote }}
            {{- end }}
          {{- end }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            # Read only when the data folder is first created.
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "grif.secretName" (dict "secretName" $p.password.secretName "root" .) }}
                  key: {{ $p.password.key }}
            {{- with $p.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          # Over TCP, so the first start's initdb (a server on the socket only) doesn't count as ready.
          startupProbe:
            exec:
              command: ["pg_isready", "-q", "-h", "127.0.0.1", "-p", "5432"]
            {{- toYaml $p.startupProbe | nindent 12 }}
          livenessProbe:
            exec:
              command: ["pg_isready", "-q", "-h", "127.0.0.1", "-p", "5432"]
            {{- toYaml $p.livenessProbe | nindent 12 }}
          readinessProbe:
            exec:
              command: ["pg_isready", "-q", "-h", "127.0.0.1", "-p", "5432"]
            {{- toYaml $p.readinessProbe | nindent 12 }}
          {{- with $p.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $p.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql
            # The socket and the server's lock file.
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
            # Shared memory for parallel queries: the container runtime's default /dev/shm is 64Mi.
            - name: shm
              mountPath: /dev/shm
            {{- with $p.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: {{ $p.persistence.existingClaim | default $p.persistence.claimName }}
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: shm
          emptyDir:
            medium: Memory
        {{- with $p.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with $p.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $p.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $p.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- end }}
