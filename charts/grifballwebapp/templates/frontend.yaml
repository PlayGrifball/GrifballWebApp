{{- $f := .Values.frontend -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grif-frontend
  labels:
    {{- include "grif.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ $f.replicas }}
  selector:
    matchLabels:
      app: grif-frontend
  {{- with $f.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  template:
    metadata:
      labels:
        app: grif-frontend
        {{- include "grif.podLabels" . | nindent 8 }}
        app.kubernetes.io/component: frontend
        {{- with $f.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with $f.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $f.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        # The app's server: the public pages rendered on the server, the built files, and /api,
        # /hub and /signin-discord proxied to the backend's Service.
        - name: grif-frontend
          image: {{ include "grif.image" $f.image }}
          imagePullPolicy: {{ $f.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
          {{- with $f.readinessProbe }}
          readinessProbe:
            httpGet:
              path: /
              port: http
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $f.livenessProbe }}
          livenessProbe:
            httpGet:
              path: /
              port: http
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $f.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $f.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- $t := $f.telemetry | default dict }}
          {{- if or $t.enabled $t.logLevel $f.extraEnv }}
          env:
            {{- if $t.enabled }}
            # OpenTelemetry (frontend.telemetry), as the backend's service (grif.otelServiceEnv)
            {{- include "grif.otelServiceEnv" . | nindent 12 }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ required "frontend.telemetry.endpoint is required when telemetry is enabled" $t.endpoint | quote }}
            {{- end }}
            {{- if $t.logLevel }}
            - name: LOG_LEVEL
              value: {{ $t.logLevel | quote }}
            {{- end }}
            {{- with $f.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          # A writable /tmp, with a read-only root filesystem.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- with $f.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- with $f.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with $f.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $f.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $f.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $f.service.name }}
  labels:
    {{- include "grif.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
  {{- with $f.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ $f.service.type }}
  selector:
    app: grif-frontend
  ports:
    - name: http
      port: {{ $f.service.port }}
      targetPort: http
