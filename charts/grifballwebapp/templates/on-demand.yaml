{{- $o := .Values.onDemand -}}
{{- if $o.enabled }}
{{- if not .Values.ingressRoute.enabled }}
{{- fail "onDemand.enabled needs ingressRoute.enabled: Sablier starts the release from the Traefik Middleware on the IngressRoute's routes" }}
{{- end }}
# On demand (onDemand): Sablier's Traefik plugin, on every route of the IngressRoute. A visit starts the group (every
# Deployment of the release, labelled grif.onDemandLabels) and renews its session; sessionDuration after the last
# one, Sablier stops them all.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: grif-on-demand
  labels:
    {{- include "grif.labels" . | nindent 4 }}
spec:
  plugin:
    sablier:
      sablierUrl: {{ $o.sablierUrl | quote }}
      group: {{ include "grif.onDemandGroup" . | quote }}
      sessionDuration: {{ $o.sessionDuration | quote }}
      {{- with $o.keepAliveInterval }}
      keepAliveInterval: {{ . | quote }}
      {{- end }}
      {{- with $o.ignoreUserAgent }}
      ignoreUserAgent:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if eq $o.strategy "blocking" }}
      blocking:
        timeout: {{ required "onDemand.blocking.timeout is required with strategy blocking" $o.blocking.timeout | quote }}
      {{- else }}
      {{- $d := $o.dynamic }}
      {{- /* Never an empty dynamic: the plugin picks its strategy by which one is set. */}}
      {{- $dynamic := dict "displayName" ($d.displayName | default "grif-on-demand") }}
      {{- if not (kindIs "invalid" $d.showDetails) }}{{ $_ := set $dynamic "showDetails" $d.showDetails }}{{ end }}
      {{- with $d.theme }}{{ $_ := set $dynamic "theme" . }}{{ end }}
      {{- with $d.refreshFrequency }}{{ $_ := set $dynamic "refreshFrequency" . }}{{ end }}
      dynamic:
        {{- toYaml $dynamic | nindent 8 }}
      {{- end }}
{{- end }}
