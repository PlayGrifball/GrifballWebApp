{{- if .Values.sqlExporter.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sql-exporter
  labels:
    {{- include "grif.labels" . | nindent 4 }}
    app.kubernetes.io/component: sql-exporter
  annotations:
    # First (Argo CD), so every pod is covered from its start.
    argocd.argoproj.io/sync-wave: "-3"
spec:
  podSelector:
    matchLabels:
      app: sql-exporter
  policyTypes: [Ingress, Egress]
