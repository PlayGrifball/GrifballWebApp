{{- if .Values.ollama.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grif-ollama
  labels:
    {{- include "grif.labels" . | nindent 4 }}
    app.kubernetes.io/component: ollama
