{{- if .Values.worker.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grif-discord
  labels:
    {{- include "grif.labels" . | nindent 4 }}
    app.kubernetes.io/component: discord
  annotations:
    # First (Argo CD), so every pod is covered from its start.
    argocd.argoproj.io/sync-wave: "-3"
spec:
  podSelector:
    matchLabels:
      app: grif-discord
  # In: nothing (its health endpoints are the kubelet's). Out: the backend's (Discord, the Halo gateway, the database).
  # Plus networkPolicy.discord.extra*, each the workers' (networkPolicy.worker.extra*) unless set: the gateway
  # ran on grif-worker before grif-discord, so rules added there for it carry over.
  policyTypes: [Ingress, Egress]
  {{- $discordNp := $np.discord | default (dict) }}
  {{- $discordIngress := hasKey $discordNp "extraIngress" | ternary $discordNp.extraIngress $np.worker.extraIngress }}
  {{- $discordEgress := hasKey $discordNp "extraEgress" | ternary $discordNp.extraEgress $np.worker.extraEgress }}
  {{- with $discordIngress }}
  ingress:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  egress:
    {{- include "grif.backendEgress" (dict "root" . "dns" $dns "database" $database) | nindent 4 }}
    {{- include "grif.voiceEgress" . | nindent 4 }}
    {{- with $discordEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
---
{{- end }}
{{- end }}
{{- range $np.extraPolicies }}
{{ tpl (toYaml .) $ }}
---
{{- end }}

{{/* The backend's egress, the workers' and grif-discord's too: DNS, the database, HTTPS out, telemetry, backend.extraEgress. */}}
{{- define "grif.backendEgress" -}}
{{- $np := .root.Values.networkPolicy -}}
{{- toYaml (list .dns) }}
{{- with .database }}
{{ toYaml (list .) }}
{{- end }}
{{- with $np.backend.httpsTo }}
# Discord, Halo Infinite, Google Sheets, Cloudflare's ranges.
- to:
    {{- toYaml . | nindent 4 }}
  ports:
    - protocol: TCP
      port: 443
{{- end }}
{{- with .root.Values.backend.telemetry }}
{{- if and .enabled .endpoint }}
{{- $port := include "grif.urlPort" .endpoint }}
# OpenTelemetry collector.
- ports:
    - protocol: TCP
      port: {{ $port | int }}
  {{- with $np.backend.telemetryTo }}
  to:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
{{- with .root.Values.frontend.telemetry }}
{{- if and .browser .endpoint }}
{{- $port := include "grif.urlPort" .endpoint }}
# OpenTelemetry collector's OTLP/HTTP: the browser's telemetry, passed on (frontend.telemetry.browser).
- ports:
    - protocol: TCP
      port: {{ $port | int }}
  {{- with $np.backend.telemetryTo }}
  to:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
{{- $haloGateway := include "grif.haloGatewayUrl" .root }}
{{- if and (eq (include "grif.haloMode" .root) "gateway") $haloGateway }}
{{- $port := include "grif.urlPort" $haloGateway }}
{{- if include "grif.haloGatewayInRelease" .root }}
# The bundled Halo gateway (halo-gateway.enabled), in this namespace, on its pods' port.
- to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: halo-gateway
          app.kubernetes.io/instance: {{ .root.Release.Name }}
  ports:
    - protocol: TCP
      port: 8080
{{- else }}
# The Halo gateway (backend.halo, Gateway mode).
- ports:
    - protocol: TCP
      port: {{ $port | int }}
  {{- with $np.backend.haloGatewayTo }}
  to:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
{{- with .root.Values.redis }}
{{- if .enabled }}
# The SignalR backplane.
- to:
    - podSelector:
        matchLabels:
          app: grif-redis
  ports:
    - protocol: TCP
      port: {{ .port }}
{{- else if .external.connectionString.secretName }}
# The SignalR backplane (external).
- ports:
    - protocol: TCP
      port: {{ $np.redis.port }}
  {{- with $np.redis.to }}
  to:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
{{- with .root.Values.ollama }}
{{- if .enabled }}
# The chats' model (the chart's Ollama).
- to:
    - podSelector:
        matchLabels:
          app: grif-ollama
  ports:
    - protocol: TCP
      port: {{ .port }}
{{- else if .external.url }}
# The chats' model (an external Ollama, ollama.external.url).
- ports:
    - protocol: TCP
      port: {{ $np.ollama.port | default (include "grif.urlPort" .external.url) | int }}
  {{- with $np.ollama.to }}
  to:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
{{- with .root.Values.speech }}
{{- if .enabled }}
# The voice chat's speech (the chart's speaches).
- to:
    - podSelector:
        matchLabels:
          app: grif-speech
  ports:
    - protocol: TCP
      port: {{ .port }}
{{- else if .external.url }}
# The voice chat's speech (an external server, speech.external.url).
- ports:
    - protocol: TCP
      port: {{ $np.speech.port | default (include "grif.urlPort" .external.url) | int }}
  {{- with $np.speech.to }}
  to:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
# The Spartan render service (SpartanRender:BaseAddress, by default its Service in the cluster), on its port.
- ports:
    - protocol: TCP
      port: 8080
  {{- with $np.backend.spartanRenderTo }}
  to:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- with $np.backend.extraEgress }}
{{ toYaml . }}
{{- end }}
{{- end }}

{{/* Discord voice (the bot's /voice): UDP to Discord's voice servers, from the pod that runs the Discord gateway; when speech is on and networkPolicy.voice.enabled. */}}
{{- define "grif.voiceEgress" -}}
{{- $np := .Values.networkPolicy -}}
{{- if and $np.voice.enabled (or .Values.speech.enabled .Values.speech.external.url) }}
# Discord voice: its voice servers' UDP ports and the websocket's TCP on Cloudflare's HTTPS ports (networkPolicy.voice).
# Not only 50000 and up: Discord voice servers are also seen on ports like 19298.
- ports:
    - protocol: UDP
      port: 1024
      endPort: 65535
    - protocol: TCP
      port: 2053
    - protocol: TCP
      port: 2083
    - protocol: TCP
      port: 2087
    - protocol: TCP
      port: 2096
    - protocol: TCP
      port: 8443
  {{- with $np.voice.to }}
  to:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}

{{/* The Database Backup page's scratch server (backupScratch) and, onDemand, the Kubernetes API: the egress of the pod that runs the jobs (grif.jobsApp). */}}
{{- define "grif.backupScratchEgress" -}}
{{- $root := . -}}
{{- if $root.Values.backupScratch.enabled }}
# The Database Backup page's scratch server (backupScratch).
- to:
    - podSelector:
        matchLabels:
          app: grif-backup-scratch
  ports:
    - protocol: TCP
      port: {{ ternary 5432 1433 (eq (include "grif.backupScratchPostgres" $root) "true") }}
{{- if include "grif.backupScratchOnDemand" $root }}
# The Kubernetes API, to start and stop it (backupScratch.mode onDemand).
- ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 6443
  {{- with $root.Values.networkPolicy.backend.apiServerTo }}
  to:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}

{{/* The Telemetry page's backends (backend.telemetry.query): the backend's egress only, as the API serves the page. */}}
{{- define "grif.telemetryQueryEgress" -}}
{{- $peers := .Values.networkPolicy.backend.telemetryQuery -}}
{{- with .Values.backend.telemetry }}
{{- if .enabled }}
{{- range $name, $url := .query }}
{{- if $url }}
{{- $peer := get $peers (trimSuffix "Url" $name) | default dict }}
{{- $port := $peer.port | default (include "grif.urlPort" $url) }}
# The Telemetry page: {{ trimSuffix "Url" $name | title }} (backend.telemetry.query).
- ports:
    - protocol: TCP
      port: {{ $port | int }}
  {{- with $peer.to }}
  to:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
