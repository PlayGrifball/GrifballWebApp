    {{- toYaml . | nindent 4 }}
    {{- end }}
---
{{- end }}
{{- if .Values.sqlExporter.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sql-exporter
  labels:
    {{- include "grif.labels" . | nindent 4 }}
    app.kubernetes.io/component: sql-exporter
  annotations:
    # First (Argo CD), so every pod is covered from its start.
    argocd.argoproj.io/sync-wave: "-3"
spec:
  podSelector:
    matchLabels:
      app: sql-exporter
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - protocol: TCP
          port: {{ .Values.sqlExporter.port }}
      {{- with $np.sqlExporter.from }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  egress:
    {{- toYaml (list $dns) | nindent 4 }}
    {{- toYaml (list $database) | nindent 4 }}
    {{- with $np.sqlExporter.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
---
{{- end }}
{{- end }}
{{- range $np.extraPolicies }}
{{ tpl (toYaml .) $ }}
---
{{- end }}

{{/* The backend's egress, the worker's too: DNS, the database, HTTPS out, telemetry, backend.extraEgress. */}}
{{- define "grif.backendEgress" -}}
{{- $np := .root.Values.networkPolicy -}}
{{- toYaml (list .dns) }}
{{ toYaml (list .database) }}
{{- with $np.backend.httpsTo }}
# Discord, Halo Infinite, Google Sheets, Cloudflare's ranges.
- to:
    {{- toYaml . | nindent 4 }}
  ports:
    - protocol: TCP
      port: 443
{{- end }}
{{- with .root.Values.backend.telemetry }}
{{- if and .enabled .endpoint }}
{{- $u := urlParse .endpoint }}
{{- $port := regexFind "[0-9]+$" $u.host | default (ternary "443" "80" (eq $u.scheme "https")) }}
# OpenTelemetry collector.
- ports:
    - protocol: TCP
      port: {{ $port | int }}
  {{- with $np.backend.telemetryTo }}
  to:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
{{- $haloGateway := include "grif.haloGatewayUrl" .root }}
{{- if and (eq (include "grif.haloMode" .root) "gateway") $haloGateway }}
{{- $u := urlParse $haloGateway }}
{{- $port := regexFind "[0-9]+$" $u.host | default (ternary "443" "80" (eq $u.scheme "https")) }}
# The Halo gateway (backend.halo, Gateway mode).
- ports:
    - protocol: TCP
      port: {{ $port | int }}
  {{- with $np.backend.haloGatewayTo }}
  to:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- with .root.Values.redis }}
{{- if .enabled }}
# The SignalR backplane.
- to:
    - podSelector:
        matchLabels:
          app: grif-redis
  ports:
    - protocol: TCP
      port: {{ .port }}
{{- else if .external.connectionString.secretName }}
# The SignalR backplane (external).
- ports:
    - protocol: TCP
      port: {{ $np.redis.port }}
  {{- with $np.redis.to }}
  to:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
{{- with $np.backend.extraEgress }}
{{ toYaml . }}
{{- end }}
{{- end }}
