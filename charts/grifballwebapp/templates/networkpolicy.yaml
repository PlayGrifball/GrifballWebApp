{{- $np := .Values.networkPolicy -}}
{{- if $np.enabled }}
{{- $pg := include "grif.postgres" . }}
{{- $bundled := and (include "grif.bundled" .) (not .Values.database.host) }}
{{- /* Egress rules shared by the pods: DNS, and the database (the chart's SQL Server or an external one). */}}
{{- $dns := dict "ports" (list (dict "protocol" "UDP" "port" 53) (dict "protocol" "TCP" "port" 53)) }}
{{- with $np.dns.to }}{{ $_ := set $dns "to" . }}{{ end }}
{{- $database := dict }}
{{- if include "grif.sqlite" . }}
{{- /* SQLite: a file in the backend's pod, no database to reach. */}}
{{- else if $bundled }}
{{- $database = dict "to" (list (dict "podSelector" (dict "matchLabels" (dict "app" (ternary "grif-postgres" "grif-mssql" (eq $pg "true")))))) "ports" (list (dict "protocol" "TCP" "port" (ternary 5432 1433 (eq $pg "true")))) }}
{{- else }}
{{- $database = dict "ports" (list (dict "protocol" "TCP" "port" (include "grif.dbPort" . | int))) }}
{{- with $np.database.to }}{{ $_ := set $database "to" . }}{{ end }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grif-frontend
  labels:
    {{- include "grif.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
  annotations:
    # First (Argo CD), so every pod is covered from its start.
    argocd.argoproj.io/sync-wave: "-3"
spec:
  podSelector:
    matchLabels:
      app: grif-frontend
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - protocol: TCP
          port: 80
      {{- with $np.frontend.from }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- with $np.frontend.extraIngress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  egress:
    {{- toYaml (list $dns) | nindent 4 }}
    # /api, proxied to the backend.
    - to:
        - podSelector:
            matchLabels:
              app: grif-backend
      ports:
        - protocol: TCP
          port: {{ .Values.backend.port }}
    {{- with .Values.frontend.telemetry }}
    {{- if and .enabled .endpoint }}
    {{- $u := urlParse .endpoint }}
    {{- $port := regexFind "[0-9]+$" $u.host | default (ternary "443" "80" (eq $u.scheme "https")) }}
    # OpenTelemetry collector (frontend.telemetry).
    - ports:
        - protocol: TCP
          port: {{ $port | int }}
      {{- with $np.frontend.telemetryTo }}
      to:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- end }}
    {{- end }}
    {{- with $np.frontend.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grif-backend
  labels:
    {{- include "grif.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
  annotations:
    # First (Argo CD), so every pod is covered from its start.
    argocd.argoproj.io/sync-wave: "-3"
spec:
  podSelector:
    matchLabels:
      app: grif-backend
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: grif-frontend
      ports:
        - protocol: TCP
          port: {{ .Values.backend.port }}
    {{- with $np.backend.extraIngress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  egress:
    {{- include "grif.backendEgress" (dict "root" . "dns" $dns "database" $database) | nindent 4 }}
    {{- include "grif.telemetryQueryEgress" . | nindent 4 }}
    {{- if and (eq (include "grif.jobsApp" .) "grif-backend") .Values.backupScratch.enabled }}
    {{- include "grif.backupScratchEgress" . | trim | nindent 4 }}
    {{- end }}
    {{- if .Values.worker.enabled }}
    # The worker: the Database Backup page's file, made by a job there.
    - to:
        - podSelector:
            matchLabels:
              app: grif-worker
      ports:
        - protocol: TCP
          port: {{ .Values.backend.port }}
    {{- end }}
---
{{- if .Values.worker.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grif-worker
  labels:
    {{- include "grif.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
  annotations:
    # First (Argo CD), so every pod is covered from its start.
    argocd.argoproj.io/sync-wave: "-3"
spec:
  podSelector:
    matchLabels:
      app: grif-worker
  policyTypes: [Ingress, Egress]
  # In: the backend, for the Database Backup page's file a job made here (its health endpoints are the kubelet's).
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: grif-backend
      ports:
        - protocol: TCP
          port: {{ .Values.backend.port }}
    {{- with $np.worker.extraIngress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  egress:
    {{- include "grif.backendEgress" (dict "root" . "dns" $dns "database" $database) | nindent 4 }}
    {{- if .Values.backupScratch.enabled }}
    {{- include "grif.backupScratchEgress" . | trim | nindent 4 }}
    {{- end }}
    {{- with $np.worker.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
---
{{- end }}
{{- if include "grif.bundledHaloGateway" . }}
# The bundled Halo gateway (halo-gateway.enabled) takes calls from the backend, the workers and grif-discord; added to the
# gateway chart's own policy, which allows its egress and the ingress controller (NetworkPolicies add up).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grif-halo-gateway-ingress
  labels:
    {{- include "grif.labels" . | nindent 4 }}
    app.kubernetes.io/component: halo-gateway
  annotations:
    # First (Argo CD), so every pod is covered from its start.
    argocd.argoproj.io/sync-wave: "-3"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: halo-gateway
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: grif-backend
        {{- if .Values.worker.enabled }}
        - podSelector:
            matchLabels:
              app: grif-worker
        - podSelector:
            matchLabels:
              app: grif-discord
        {{- end }}
      ports:
        - protocol: TCP
          port: 8080
---
{{- end }}
{{- if .Values.redis.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grif-redis
  labels:
    {{- include "grif.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
  annotations:
    # First (Argo CD), so every pod is covered from its start.
    argocd.argoproj.io/sync-wave: "-3"
spec:
  podSelector:
    matchLabels:
      app: grif-redis
  # In: the backend, the workers and grif-discord. Out: nothing.
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: grif-backend
        {{- if .Values.worker.enabled }}
        - podSelector:
            matchLabels:
              app: grif-worker
        - podSelector:
            matchLabels:
              app: grif-discord
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.redis.port }}
    {{- with $np.redis.extraIngress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
---
{{- end }}
{{- if and .Values.mssql.enabled (not $pg) }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grif-mssql
  labels:
    {{- include "grif.labels" . | nindent 4 }}
    app.kubernetes.io/component: mssql
  annotations:
    # First (Argo CD), so every pod is covered from its start.
    argocd.argoproj.io/sync-wave: "-3"
spec:
  podSelector:
    matchLabels:
      app: grif-mssql
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: grif-backend
        {{- if .Values.worker.enabled }}
        - podSelector:
            matchLabels:
              app: grif-worker
        - podSelector:
            matchLabels:
              app: grif-discord
        {{- end }}
        {{- if .Values.migrations.enabled }}
        - podSelector:
            matchLabels:
              app: grif-migrate
        {{- end }}
        {{- if and .Values.migrations.enabled .Values.migrations.backup.enabled .Values.migrations.backup.retention.enabled }}
        - podSelector:
            matchLabels:
              app: grif-backup-retention
        {{- end }}
        {{- if and .Values.migrations.enabled .Values.migrations.backup.enabled .Values.migrations.backup.scheduled.enabled }}
        - podSelector:
            matchLabels:
              app: grif-backup
        {{- end }}
        {{- if .Values.sqlExporter.enabled }}
        - podSelector:
            matchLabels:
              app: sql-exporter
        {{- end }}
      ports:
        - protocol: TCP
          port: 1433
    {{- if .Values.mssql.loadBalancer.enabled }}
    # The LoadBalancer Service.
    - ports:
        - protocol: TCP
          port: 1433
      {{- with $np.mssql.loadBalancerFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- end }}
    {{- with $np.mssql.extraIngress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  egress:
    {{- toYaml (list $dns) | nindent 4 }}
    {{- with $np.mssql.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
---
{{- end }}
{{- if and $pg .Values.postgres.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grif-postgres
  labels:
    {{- include "grif.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
  annotations:
    # First (Argo CD), so every pod is covered from its start.
    argocd.argoproj.io/sync-wave: "-3"
spec:
  podSelector:
    matchLabels:
      app: grif-postgres
  policyTypes: [Ingress, Egress]
  ingress:
    # Backup retention isn't here: it only deletes files on the backup volume.
    - from:
        - podSelector:
            matchLabels:
              app: grif-backend
        {{- if .Values.worker.enabled }}
        - podSelector:
            matchLabels:
              app: grif-worker
        - podSelector:
            matchLabels:
              app: grif-discord
        {{- end }}
        {{- if .Values.migrations.enabled }}
        - podSelector:
            matchLabels:
              app: grif-migrate
        {{- end }}
        {{- if and .Values.migrations.enabled .Values.migrations.backup.enabled .Values.migrations.backup.scheduled.enabled }}
        - podSelector:
            matchLabels:
              app: grif-backup
        {{- end }}
        {{- if .Values.sqlExporter.enabled }}
        - podSelector:
            matchLabels:
              app: sql-exporter
        {{- end }}
      ports:
        - protocol: TCP
          port: 5432
    {{- if .Values.postgres.loadBalancer.enabled }}
    # The LoadBalancer Service.
    - ports:
        - protocol: TCP
          port: 5432
      {{- with $np.postgres.loadBalancerFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- end }}
    {{- with $np.postgres.extraIngress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  egress:
    {{- toYaml (list $dns) | nindent 4 }}
    {{- with $np.postgres.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
---
{{- end }}
{{- if .Values.migrations.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grif-migrate
  labels:
    {{- include "grif.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrations
  annotations:
    # First (Argo CD), so every pod is covered from its start.
    argocd.argoproj.io/sync-wave: "-3"
spec:
  podSelector:
    matchLabels:
      app: grif-migrate
  policyTypes: [Ingress, Egress]
  egress:
    {{- toYaml (list $dns) | nindent 4 }}
    {{- toYaml (list $database) | nindent 4 }}
    {{- with $np.migrations.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
---
{{- end }}
{{- if and .Values.migrations.enabled .Values.migrations.backup.enabled .Values.migrations.backup.retention.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grif-backup-retention
  labels:
