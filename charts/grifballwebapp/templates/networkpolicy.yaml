{{- if and .Values.mssql.enabled (not $pg) }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grif-mssql
  labels:
    {{- include "grif.labels" . | nindent 4 }}
    app.kubernetes.io/component: mssql
  annotations:
    # First (Argo CD), so every pod is covered from its start.
    argocd.argoproj.io/sync-wave: "-3"
spec:
  podSelector:
    matchLabels:
      app: grif-mssql
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: grif-backend
        {{- if .Values.worker.enabled }}
        - podSelector:
            matchLabels:
              app: grif-worker
