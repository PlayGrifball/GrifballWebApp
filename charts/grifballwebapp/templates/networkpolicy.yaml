    - ports:
        - protocol: TCP
          port: {{ .Values.sqlExporter.port }}
      {{- with $np.sqlExporter.from }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  egress:
    {{- toYaml (list $dns) | nindent 4 }}
    {{- toYaml (list $database) | nindent 4 }}
    {{- with $np.sqlExporter.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
---
{{- end }}
{{- if .Values.worker.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grif-discord
  labels:
    {{- include "grif.labels" . | nindent 4 }}
    app.kubernetes.io/component: discord
  annotations:
    # First (Argo CD), so every pod is covered from its start.
    argocd.argoproj.io/sync-wave: "-3"
spec:
  podSelector:
    matchLabels:
      app: grif-discord
  # In: nothing (its health endpoints are the kubelet's). Out: the backend's (Discord, the Halo gateway, the database).
  # Plus networkPolicy.discord.extra*, each the workers' (networkPolicy.worker.extra*) unless set: the gateway
  # ran on grif-worker before grif-discord, so rules added there for it carry over.
  policyTypes: [Ingress, Egress]
  {{- $discordNp := $np.discord | default (dict) }}
  {{- $discordIngress := hasKey $discordNp "extraIngress" | ternary $discordNp.extraIngress $np.worker.extraIngress }}
  {{- $discordEgress := hasKey $discordNp "extraEgress" | ternary $discordNp.extraEgress $np.worker.extraEgress }}
  {{- with $discordIngress }}
  ingress:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  egress:
    {{- include "grif.backendEgress" (dict "root" . "dns" $dns "database" $database) | nindent 4 }}
    {{- with $discordEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
---
{{- end }}
{{- end }}
{{- range $np.extraPolicies }}
{{ tpl (toYaml .) $ }}
---
{{- end }}

{{/* The backend's egress, the workers' and grif-discord's too: DNS, the database, HTTPS out, telemetry, backend.extraEgress. */}}
{{- define "grif.backendEgress" -}}
{{- $np := .root.Values.networkPolicy -}}
{{- toYaml (list .dns) }}
{{- with .database }}
{{ toYaml (list .) }}
{{- end }}
{{- with $np.backend.httpsTo }}
# Discord, Halo Infinite, Google Sheets, Cloudflare's ranges.
- to:
    {{- toYaml . | nindent 4 }}
  ports:
    - protocol: TCP
      port: 443
{{- end }}
{{- with .root.Values.backend.telemetry }}
{{- if and .enabled .endpoint }}
{{- $u := urlParse .endpoint }}
{{- $port := regexFind "[0-9]+$" $u.host | default (ternary "443" "80" (eq $u.scheme "https")) }}
# OpenTelemetry collector.
- ports:
    - protocol: TCP
      port: {{ $port | int }}
  {{- with $np.backend.telemetryTo }}
  to:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
{{- $haloGateway := include "grif.haloGatewayUrl" .root }}
{{- if and (eq (include "grif.haloMode" .root) "gateway") $haloGateway }}
{{- $u := urlParse $haloGateway }}
{{- $port := regexFind "[0-9]+$" $u.host | default (ternary "443" "80" (eq $u.scheme "https")) }}
{{- if include "grif.haloGatewayInRelease" .root }}
# The bundled Halo gateway (halo-gateway.enabled), in this namespace, on its pods' port.
- to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: halo-gateway
          app.kubernetes.io/instance: {{ .root.Release.Name }}
  ports:
    - protocol: TCP
      port: 8080
{{- else }}
# The Halo gateway (backend.halo, Gateway mode).
- ports:
    - protocol: TCP
      port: {{ $port | int }}
  {{- with $np.backend.haloGatewayTo }}
  to:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
{{- with .root.Values.redis }}
{{- if .enabled }}
# The SignalR backplane.
- to:
    - podSelector:
        matchLabels:
          app: grif-redis
  ports:
    - protocol: TCP
      port: {{ .port }}
{{- else if .external.connectionString.secretName }}
# The SignalR backplane (external).
- ports:
    - protocol: TCP
      port: {{ $np.redis.port }}
  {{- with $np.redis.to }}
  to:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
{{- with $np.backend.extraEgress }}
{{ toYaml . }}
{{- end }}
{{- end }}

{{/* The Database Backup page's scratch server (backupScratch) and, onDemand, the Kubernetes API: the egress of the pod that runs the jobs (grif.jobsApp). */}}
{{- define "grif.backupScratchEgress" -}}
{{- $root := . -}}
{{- if $root.Values.backupScratch.enabled }}
# The Database Backup page's scratch server (backupScratch).
- to:
    - podSelector:
        matchLabels:
          app: grif-backup-scratch
  ports:
    - protocol: TCP
      port: {{ ternary 5432 1433 (eq (include "grif.backupScratchPostgres" $root) "true") }}
{{- if include "grif.backupScratchOnDemand" $root }}
# The Kubernetes API, to start and stop it (backupScratch.mode onDemand).
- ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 6443
  {{- with $root.Values.networkPolicy.backend.apiServerTo }}
  to:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}

{{/* The Telemetry page's backends (backend.telemetry.query): the backend's egress only, as the API serves the page. */}}
{{- define "grif.telemetryQueryEgress" -}}
{{- $peers := .Values.networkPolicy.backend.telemetryQuery -}}
{{- with .Values.backend.telemetry }}
{{- if .enabled }}
{{- range $name, $url := .query }}
{{- if $url }}
{{- $peer := get $peers (trimSuffix "Url" $name) | default dict }}
{{- $u := urlParse $url }}
{{- $port := $peer.port | default (trimPrefix ":" (regexFind ":[0-9]+$" $u.host)) | default (ternary "443" "80" (eq $u.scheme "https")) }}
# The Telemetry page: {{ trimSuffix "Url" $name | title }} (backend.telemetry.query).
- ports:
    - protocol: TCP
      port: {{ $port | int }}
  {{- with $peer.to }}
  to:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
