{{- $np := .Values.networkPolicy -}}
{{- if $np.enabled }}
{{- $pg := include "grif.postgres" . }}
{{- $bundled := and (include "grif.bundled" .) (not .Values.database.host) }}
{{- /* Egress rules shared by the pods: DNS, and the database (the chart's SQL Server or an external one). */}}
{{- $dns := dict "ports" (list (dict "protocol" "UDP" "port" 53) (dict "protocol" "TCP" "port" 53)) }}
{{- with $np.dns.to }}{{ $_ := set $dns "to" . }}{{ end }}
{{- $database := dict }}
{{- if include "grif.sqlite" . }}
{{- /* SQLite: a file in the backend's pod, no database to reach. */}}
{{- else if $bundled }}
{{- $database = dict "to" (list (dict "podSelector" (dict "matchLabels" (dict "app" (ternary "grif-postgres" "grif-mssql" (eq $pg "true")))))) "ports" (list (dict "protocol" "TCP" "port" (ternary 5432 1433 (eq $pg "true")))) }}
{{- else }}
{{- $database = dict "ports" (list (dict "protocol" "TCP" "port" (include "grif.dbPort" . | int))) }}
{{- with $np.database.to }}{{ $_ := set $database "to" . }}{{ end }}
{{- end }}
{{- /* onDemand with the chart's database: Sablier's API, which the Jobs that wait for the database call first (grif.waitForDatabaseScript). */}}
{{- $sablier := list }}
{{- if include "grif.onDemandWakesDatabase" . }}
{{- $o := .Values.onDemand }}
{{- $rule := dict "ports" (list (dict "protocol" "TCP" "port" (include "grif.urlPort" (include "grif.sablierUrl" .) | int))) }}
{{- with $o.networkPolicy.sablierNamespace }}{{ $_ := set $rule "to" (list (dict "namespaceSelector" (dict "matchLabels" (dict "kubernetes.io/metadata.name" .)))) }}{{ end }}
{{- $sablier = list $rule }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grif-frontend
  labels:
    {{- include "grif.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
  annotations:
    # First (Argo CD), so every pod is covered from its start.
    argocd.argoproj.io/sync-wave: "-3"
spec:
  podSelector:
    matchLabels:
      app: grif-frontend
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - protocol: TCP
          port: 80
      {{- with $np.frontend.from }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- with $np.frontend.extraIngress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  egress:
    {{- toYaml (list $dns) | nindent 4 }}
    # /api, proxied to the backend.
    - to:
        - podSelector:
            matchLabels:
              app: grif-backend
      ports:
        - protocol: TCP
          port: {{ .Values.backend.port }}
    {{- with .Values.frontend.telemetry }}
    {{- if and .enabled .endpoint }}
    {{- $port := include "grif.urlPort" .endpoint }}
    # OpenTelemetry collector (frontend.telemetry).
    - ports:
        - protocol: TCP
          port: {{ $port | int }}
      {{- with $np.frontend.telemetryTo }}
      to:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- end }}
    {{- end }}
    {{- with $np.frontend.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grif-backend
  labels:
    {{- include "grif.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
  annotations:
    # First (Argo CD), so every pod is covered from its start.
    argocd.argoproj.io/sync-wave: "-3"
spec:
  podSelector:
    matchLabels:
      app: grif-backend
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: grif-frontend
      ports:
        - protocol: TCP
          port: {{ .Values.backend.port }}
    {{- if and .Values.ingressRoute.enabled (or .Values.ingressRoute.hubs.enabled .Values.ingressRoute.api.enabled) }}
    {{- if not $np.frontend.from }}
    {{- fail "ingressRoute.hubs or .api sends traffic straight to the backend, which trusts the pod network's X-Real-IP: set networkPolicy.frontend.from to the ingress controller, or turn the direct routes off (ingressRoute.enabled false, or both .hubs.enabled and .api.enabled false)" }}
    {{- end }}
    # The API and the hubs, straight from the ingress controller (ingressRoute.api and .hubs): whoever may reach the
    # frontend
    - ports:
        - protocol: TCP
          port: {{ .Values.backend.port }}
      from:
        {{- toYaml $np.frontend.from | nindent 8 }}
    {{- end }}
    {{- with $np.backend.extraIngress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  egress:
    {{- include "grif.backendEgress" (dict "root" . "dns" $dns "database" $database) | nindent 4 }}
    {{- include "grif.telemetryQueryEgress" . | nindent 4 }}
    {{- if not .Values.worker.enabled }}
    {{- include "grif.voiceEgress" . | nindent 4 }}
    {{- end }}
    {{- if and (eq (include "grif.jobsApp" .) "grif-backend") .Values.backupScratch.enabled }}
    {{- include "grif.backupScratchEgress" . | trim | nindent 4 }}
    {{- end }}
    {{- if .Values.worker.enabled }}
    # The worker: the Database Backup page's file, made by a job there.
    - to:
        - podSelector:
            matchLabels:
              app: grif-worker
      ports:
        - protocol: TCP
          port: {{ .Values.backend.port }}
    {{- end }}
---
{{- if .Values.worker.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grif-worker
  labels:
    {{- include "grif.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
  annotations:
    # First (Argo CD), so every pod is covered from its start.
    argocd.argoproj.io/sync-wave: "-3"
spec:
  podSelector:
    matchLabels:
      app: grif-worker
  policyTypes: [Ingress, Egress]
  # In: the backend, for the Database Backup page's file a job made here (its health endpoints are the kubelet's).
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: grif-backend
      ports:
        - protocol: TCP
          port: {{ .Values.backend.port }}
    {{- with $np.worker.extraIngress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  egress:
    {{- include "grif.backendEgress" (dict "root" . "dns" $dns "database" $database) | nindent 4 }}
    {{- if .Values.backupScratch.enabled }}
    {{- include "grif.backupScratchEgress" . | trim | nindent 4 }}
    {{- end }}
    {{- with $np.worker.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
---
{{- end }}
{{- if include "grif.bundledHaloGateway" . }}
# The bundled Halo gateway (halo-gateway.enabled) takes calls from the backend, the workers and grif-discord; added to the
# gateway chart's own policy, which allows its egress and the ingress controller (NetworkPolicies add up).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grif-halo-gateway-ingress
  labels:
    {{- include "grif.labels" . | nindent 4 }}
    app.kubernetes.io/component: halo-gateway
  annotations:
    # First (Argo CD), so every pod is covered from its start.
    argocd.argoproj.io/sync-wave: "-3"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: halo-gateway
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: grif-backend
        {{- if .Values.worker.enabled }}
        - podSelector:
            matchLabels:
              app: grif-worker
        - podSelector:
            matchLabels:
              app: grif-discord
        {{- end }}
      ports:
        - protocol: TCP
          port: 8080
---
{{- end }}
{{- if .Values.redis.enabled }}
