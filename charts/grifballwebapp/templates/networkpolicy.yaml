            matchLabels:
              app: grif-backup
        {{- end }}
        {{- if .Values.sqlExporter.enabled }}
        - podSelector:
            matchLabels:
              app: sql-exporter
        {{- end }}
      ports:
        - protocol: TCP
          port: 5432
    {{- if .Values.postgres.loadBalancer.enabled }}
    # The LoadBalancer Service.
    - ports:
        - protocol: TCP
          port: 5432
      {{- with $np.postgres.loadBalancerFrom }}
      from:
