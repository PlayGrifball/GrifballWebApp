{{- $svc := .Values.frontend.service -}}
{{- with .Values.ingress }}
{{- if .enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grif-frontend
  labels:
    {{- include "grif.labels" $ | nindent 4 }}
  {{- with .annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range required "ingress.hosts is required when ingress.enabled" .hosts }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $svc.name }}
                port:
                  name: http
    {{- end }}
---
{{- end }}
{{- end }}
{{- with .Values.ingressRoute }}
{{- if .enabled }}
{{- /* The site's middlewares, then (onDemand) Sablier's on every route: a browser's page, API call or hub
   connection starts the release and renews its session. The site's route gets grif-on-demand (onDemand.strategy:
   the starting page by default), the hub and API routes grif-on-demand-api (onDemand.apiStrategy: blocking by
   default, so they never get the page's HTML). The frontend's own calls to the backend go to its Service, not
   through here, so only visitors count. */}}
{{- $middlewares := .middlewares | default list }}
{{- $backendMiddlewares := $middlewares }}
{{- if $.Values.onDemand.enabled }}
{{- $middlewares = append $middlewares (dict "name" "grif-on-demand") }}
{{- $backendMiddlewares = append $backendMiddlewares (dict "name" "grif-on-demand-api") }}
{{- end }}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ .name }}
  labels:
    {{- include "grif.labels" $ | nindent 4 }}
  {{- with .annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .entryPoints }}
  entryPoints:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  routes:
    - match: Host(`{{ required "ingressRoute.host is required when ingressRoute.enabled" .host }}`)
      kind: Rule
      {{- with $middlewares }}
      middlewares:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      services:
        - name: {{ $svc.name }}
          port: {{ $svc.port }}
    {{- if .hubs.enabled }}
    # The hubs, straight to the backend and sticky (ingressRoute.hubs); their paths as the frontend's proxy sends them
    - match: 'Host(`{{ .host }}`) && PathRegexp(`^/(hub|signalr-dev)/\w*Hub(/|$)`)'
      kind: Rule
      middlewares:
        {{- with $backendMiddlewares }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        - name: grif-backend-path
      services:
        - name: {{ $.Values.backend.service.name }}
          port: {{ $.Values.backend.port }}
          sticky:
            cookie:
              name: {{ .hubs.cookie }}
              httpOnly: true
              secure: true
              sameSite: lax
    {{- end }}
    {{- if .api.enabled }}
    # The API and the Discord sign-in's callback, straight to the backend (ingressRoute.api); their paths as the
    # frontend's proxy sends them
    - match: 'Host(`{{ .host }}`) && PathRegexp(`^/(api/|signin-discord(/|$))`)'
      kind: Rule
      middlewares:
        {{- with $backendMiddlewares }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        - name: grif-backend-path
      services:
        - name: {{ $.Values.backend.service.name }}
          port: {{ $.Values.backend.port }}
    {{- end }}
  {{- with .tls.secretName }}
  tls:
    secretName: {{ . }}
  {{- end }}
{{- end }}
{{- end }}
