{{- $svc := .Values.frontend.service -}}
{{- with .Values.ingress }}
{{- if .enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grif-frontend
  labels:
    {{- include "grif.labels" $ | nindent 4 }}
  {{- with .annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range required "ingress.hosts is required when ingress.enabled" .hosts }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $svc.name }}
                port:
                  name: http
    {{- end }}
---
{{- end }}
{{- end }}
{{- with .Values.ingressRoute }}
{{- if .enabled }}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ .name }}
  labels:
    {{- include "grif.labels" $ | nindent 4 }}
  {{- with .annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .entryPoints }}
  entryPoints:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  routes:
    - match: Host(`{{ required "ingressRoute.host is required when ingressRoute.enabled" .host }}`)
      kind: Rule
      {{- with .middlewares }}
      middlewares:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      services:
        - name: {{ $svc.name }}
          port: {{ $svc.port }}
    {{- if .hubs.enabled }}
    # The hubs, straight to the backend and sticky (ingressRoute.hubs); their paths as the frontend's proxy sends them
    - match: 'Host(`{{ .host }}`) && PathRegexp(`^/(hub|signalr-dev)/\w*Hub(/|$)`)'
      kind: Rule
      middlewares:
        {{- with .middlewares }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        - name: grif-backend-path
      services:
        - name: {{ $.Values.backend.service.name }}
          port: {{ $.Values.backend.port }}
          sticky:
            cookie:
              name: {{ .hubs.cookie }}
              httpOnly: true
              secure: true
              sameSite: lax
    {{- end }}
    {{- if .api.enabled }}
    # The API and the Discord sign-in's callback, straight to the backend (ingressRoute.api); their paths as the
    # frontend's proxy sends them
    - match: 'Host(`{{ .host }}`) && PathRegexp(`^/(api/|signin-discord(/|$))`)'
      kind: Rule
      middlewares:
        {{- with .middlewares }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        - name: grif-backend-path
      services:
        - name: {{ $.Values.backend.service.name }}
          port: {{ $.Values.backend.port }}
    {{- end }}
  {{- with .tls.secretName }}
  tls:
    secretName: {{ . }}
  {{- end }}
{{- end }}
{{- end }}
