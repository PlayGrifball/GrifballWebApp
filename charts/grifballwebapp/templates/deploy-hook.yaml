{{- $h := .Values.deployHook -}}
{{- if $h.enabled }}
{{- $backupDir := $h.backup.directory | default (printf "/var/opt/mssql/backup/%s" .Release.Namespace) }}
{{- $bundled := and .Values.mssql.enabled (not .Values.database.host) }}
{{- $smallResources := dict "requests" (dict "cpu" "10m" "memory" "32Mi") "limits" (dict "memory" "128Mi") }}
{{- $hookAnnotations := dict "helm.sh/hook" "pre-upgrade" "helm.sh/hook-weight" "-10" "helm.sh/hook-delete-policy" "before-hook-creation" "argocd.argoproj.io/hook" "PreSync" "argocd.argoproj.io/sync-wave" "-10" "argocd.argoproj.io/hook-delete-policy" "BeforeHookCreation" }}
{{- if $h.serviceAccount.create }}
# Hooks themselves, ahead of the Job (lower weight): an upgrade's hooks run before its other objects
# are applied, and a first Argo CD sync creates nothing before its PreSync hooks.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $h.serviceAccount.name }}
  labels:
    {{- include "grif.labels" . | nindent 4 }}
    app.kubernetes.io/component: deploy-hook
  annotations:
    {{- toYaml $hookAnnotations | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $h.serviceAccount.name }}
  labels:
    {{- include "grif.labels" . | nindent 4 }}
    app.kubernetes.io/component: deploy-hook
  annotations:
    {{- toYaml $hookAnnotations | nindent 4 }}
rules:
  # Scale the app down while pending migrations are applied.
  - apiGroups: [apps]
    resources: [deployments, deployments/scale]
    resourceNames: [grif-backend, grif-frontend]
    verbs: [get, patch, update]
  # Whether SQL Server exists yet (a first Argo CD sync runs the hook before creating it).
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [grif-mssql]
    verbs: [get]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $h.serviceAccount.name }}
  labels:
    {{- include "grif.labels" . | nindent 4 }}
    app.kubernetes.io/component: deploy-hook
  annotations:
    {{- toYaml $hookAnnotations | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $h.serviceAccount.name }}
subjects:
  - kind: ServiceAccount
    name: {{ $h.serviceAccount.name }}
    namespace: {{ .Release.Namespace }}
---
{{- end }}
# Back up the database, then apply the migrations of the backend image being deployed (values.yaml,
# deployHook). Runs on every upgrade, not only image changes, so each one leaves a backup.
apiVersion: batch/v1
kind: Job
metadata:
  name: grif-deploy-hook
  labels:
    {{- include "grif.labels" . | nindent 4 }}
    app.kubernetes.io/component: deploy-hook
  annotations:
    {{- $jobAnnotations := dict "helm.sh/hook" "pre-upgrade" "helm.sh/hook-delete-policy" "before-hook-creation" "argocd.argoproj.io/hook" "PreSync" "argocd.argoproj.io/hook-delete-policy" "BeforeHookCreation" }}
    {{- toYaml (merge (deepCopy $h.annotations) $jobAnnotations) | nindent 4 }}
spec:
  # A failed backup or migration must stop the deploy, not be retried behind its back.
  backoffLimit: 0
  activeDeadlineSeconds: {{ $h.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        app: grif-deploy-hook
        {{- include "grif.labels" . | nindent 8 }}
        app.kubernetes.io/component: deploy-hook
        {{- with $h.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with $h.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ $h.serviceAccount.name }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $h.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: work
          emptyDir: {}
        - name: tmp
          emptyDir: {}
      initContainers:
        # A first Argo CD sync runs this before SQL Server exists: nothing to back up or migrate then.
        # Otherwise wait for the database.
        - name: wait-for-database
          image: {{ $h.images.kubectl }}
          imagePullPolicy: {{ $h.imagePullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              if [ "$BUNDLED" = true ]; then
                if ! out=$(kubectl -n "$NAMESPACE" get deployment grif-mssql -o name 2>&1); then
                  case "$out" in
                    *NotFound*) echo "SQL Server isn't deployed yet (first install): nothing to back up or migrate."; touch /work/skip; exit 0 ;;
                    *) echo "$out"; exit 1 ;;
                  esac
                fi
              fi
              {{- include "grif.waitForDatabaseScript" . | nindent 14 }}
          env:
            - name: BUNDLED
              value: {{ $bundled | quote }}
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: DB_HOST
              value: {{ include "grif.dbHost" . | quote }}
            - name: DB_PORT
              value: {{ include "grif.dbPort" . | quote }}
            - name: WAIT_SECONDS
              value: {{ $h.databaseWaitSeconds | quote }}
            - name: HOME
              value: /tmp
            {{- with $h.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: work
              mountPath: /work
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml $smallResources | nindent 12 }}
          securityContext:
            {{- toYaml (merge (dict "runAsNonRoot" true "runAsUser" 65534) (deepCopy $h.securityContext)) | nindent 12 }}
        # This build's migration IDs, from the backend image being deployed.
        - name: migration-list
          image: {{ include "grif.backendImage" . }}
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          command: ["cp", "/app/migrations.txt", "/work/migrations.txt"]
          volumeMounts:
            - name: work
              mountPath: /work
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              memory: 32Mi
          {{- with $h.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        # Which of them the database lacks (/work/pending.txt); /work/db-exists if the database does.
        # sqlcmd reads environment variables as scripting variables (DB_NAME, BACKUP_DIR, BACKUP_FILE),
        # written with a doubled dollar sign so Kubernetes passes them on as they are.
        - name: check-pending
          image: {{ $h.images.sqlcmd }}
          imagePullPolicy: {{ $h.imagePullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              if [ -e /work/skip ]; then exit 0; fi
              {{- if $h.scripts.checkPending }}
              {{- $h.scripts.checkPending | nindent 14 }}
              {{- else }}
              /opt/mssql-tools/bin/sqlcmd -S "$DB_HOST,$DB_PORT" -U "$DB_USER" -P "$DB_PASSWORD" -N -C -b -h -1 -W -Q "SET NOCOUNT ON;
                  IF DB_ID(N'\$$(DB_NAME)') IS NULL SELECT 'NO_DATABASE'
                  ELSE IF OBJECT_ID(N'[\$$(DB_NAME)].dbo.__EFMigrationsHistory') IS NOT NULL
                    EXEC(N'SELECT MigrationId FROM [\$$(DB_NAME)].dbo.__EFMigrationsHistory');" \
                > /work/applied.txt
              if grep -qxF NO_DATABASE /work/applied.txt; then
                echo "Database $DB_NAME doesn't exist yet: nothing to back up; the migrations create it."
                : > /work/applied.txt
              else
                touch /work/db-exists
              fi
              grep -vxF -f /work/applied.txt /work/migrations.txt > /work/pending.txt || true
              if [ -s /work/pending.txt ]; then
                echo "Pending migrations:"; cat /work/pending.txt
              else
                echo "No pending migrations: the app stays up."
              fi
              {{- end }}
          env:
            {{- include "grif.hookDbEnv" . | nindent 12 }}
            {{- with $h.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: work
              mountPath: /work
          resources:
            {{- toYaml $smallResources | nindent 12 }}
          {{- with $h.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- if $h.scaleDown }}
        # Only when something is pending: stop the app before the backup and migration. The upgrade
        # scales it back up.
        - name: scale-down
          image: {{ $h.images.kubectl }}
          imagePullPolicy: {{ $h.imagePullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              {{- if $h.scripts.scaleDown }}
              {{- $h.scripts.scaleDown | nindent 14 }}
              {{- else }}
              if [ ! -s /work/pending.txt ]; then echo "Nothing pending: not scaling down."; exit 0; fi
              kubectl -n "$NAMESPACE" scale deployment grif-backend grif-frontend --replicas=0
              kubectl -n "$NAMESPACE" wait --for=delete pod -l 'app in (grif-backend,grif-frontend)' --timeout=180s
              echo "Scaled down; the upgrade scales back up after the migration."
              {{- end }}
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: HOME
              value: /tmp
            {{- with $h.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: work
              mountPath: /work
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml $smallResources | nindent 12 }}
          # The same user as wait-for-database, which shares kubectl's cache in /tmp.
          securityContext:
            {{- toYaml (merge (dict "runAsNonRoot" true "runAsUser" 65534) (deepCopy $h.securityContext)) | nindent 12 }}
        {{- end }}
        {{- if $h.backup.enabled }}
        # SQL Server writes the file itself, so the folder is on its side.
        - name: backup
          image: {{ $h.images.sqlcmd }}
          imagePullPolicy: {{ $h.imagePullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              {{- if $h.scripts.backup }}
              {{- $h.scripts.backup | nindent 14 }}
              {{- else }}
              if [ ! -e /work/db-exists ]; then echo "No database to back up."; exit 0; fi
              export BACKUP_FILE="$BACKUP_DIR/${DB_NAME}_$(date +%Y%m%d_%H%M%S).bak"
              echo "Backing up $DB_NAME to $BACKUP_FILE"
              /opt/mssql-tools/bin/sqlcmd -S "$DB_HOST,$DB_PORT" -U "$DB_USER" -P "$DB_PASSWORD" -N -C -b \
                -Q "EXEC master.sys.xp_create_subdir N'\$$(BACKUP_DIR)';
                  BACKUP DATABASE [\$$(DB_NAME)] TO DISK = N'\$$(BACKUP_FILE)' WITH FORMAT, INIT, NAME = 'Pre-deploy backup';"
              {{- end }}
          env:
            {{- include "grif.hookDbEnv" . | nindent 12 }}
            - name: BACKUP_DIR
              value: {{ $backupDir | quote }}
            {{- with $h.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: work
              mountPath: /work
          resources:
            {{- toYaml $smallResources | nindent 12 }}
          {{- with $h.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- end }}
        {{- with $h.extraInitContainers }}
        {{- tpl (toYaml .) $ | nindent 8 }}
        {{- end }}
      containers:
        - name: migrate
          image: {{ include "grif.backendImage" . }}
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              if [ -e /work/skip ]; then echo "Nothing to migrate."; exit 0; fi
              {{- if $h.scripts.migrate }}
              {{- $h.scripts.migrate | nindent 14 }}
              {{- else }}
              exec /app/efbundle
              {{- end }}
          env:
            {{- include "grif.migrationEnv" . | nindent 12 }}
            {{- with $h.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with $h.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $h.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: work
              mountPath: /work
            - name: tmp
              mountPath: /tmp
      {{- with $h.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $h.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $h.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
