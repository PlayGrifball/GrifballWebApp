{{- if .Values.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secret.name }}
  labels:
    {{- include "grif.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- toYaml .Values.secret.stringData | nindent 2 }}
---
{{- end }}
{{- if .Values.defaultServiceAccount.manage }}
# The namespace's default ServiceAccount, without an API token mounted into pods that use it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  labels:
    {{- include "grif.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
{{- end }}
{{- with .Values.mssqlTools }}
{{- if .enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mssql-tools
  labels:
    {{- include "grif.labels" $ | nindent 4 }}
    app.kubernetes.io/component: mssql-tools
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mssql-tools
  template:
    metadata:
      labels:
        app: mssql-tools
        {{- include "grif.labels" $ | nindent 8 }}
        app.kubernetes.io/component: mssql-tools
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        # Idle; for sqlcmd through kubectl exec.
        - name: mssql-tools
          image: {{ .image }}
          command: ["sleep", "infinity"]
          {{- with .resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
{{- end }}
{{- end }}
