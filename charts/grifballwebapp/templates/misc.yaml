{{- if .Values.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secret.name }}
  labels:
    {{- include "grif.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- toYaml .Values.secret.stringData | nindent 2 }}
---
{{- end }}
{{- if .Values.defaultServiceAccount.manage }}
# The namespace's default ServiceAccount, without an API token mounted into pods that use it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  labels:
    {{- include "grif.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
{{- end }}
