suite: Database Backup scratch server
templates:
  - templates/backup-scratch.yaml
  - templates/backend.yaml
  - templates/networkpolicy.yaml
release:
  namespace: grif-x
set:
  mssql.acceptEula: true
tests:
  - it: is off by default
    template: templates/backup-scratch.yaml
    asserts:
      - hasDocuments: { count: 0 }

  - it: is PostgreSQL beside SQL Server, holding nothing, with its own password
    template: templates/backup-scratch.yaml
    set:
      backupScratch.enabled: true
    asserts:
      - equal: { path: "spec.ports[0].port", value: 5432 }
        documentIndex: 0
      - matchRegex: { path: "spec.template.spec.containers[0].image", pattern: "^docker.io/library/postgres:" }
        documentIndex: 1
      - contains:
          path: "spec.template.spec.containers[0].env"
          content: { name: POSTGRES_PASSWORD, valueFrom: { secretKeyRef: { name: grif-secrets, key: BACKUP_SCRATCH_PASSWORD } } }
        documentIndex: 1
      - contains: { path: spec.template.spec.volumes, content: { name: data, emptyDir: { sizeLimit: 4Gi } } }
        documentIndex: 1
      - equal: { path: "spec.template.spec.initContainers[0].command[2]", value: "chown -R 70:70 /data" }
        documentIndex: 1

  - it: is SQL Server beside PostgreSQL, needing its EULA accepted
    template: templates/backup-scratch.yaml
    set:
      database.provider: postgres
      postgres.enabled: true
      mssql.enabled: false
      backupScratch.enabled: true
    asserts:
      - equal: { path: "spec.ports[0].port", value: 1433 }
        documentIndex: 0
      - matchRegex: { path: "spec.template.spec.containers[0].image", pattern: "^mcr.microsoft.com/mssql/server:" }
        documentIndex: 1
      - contains: { path: "spec.template.spec.containers[0].env", content: { name: ACCEPT_EULA, value: "Y" } }
        documentIndex: 1
      - contains: { path: "spec.template.spec.containers[0].volumeMounts", content: { name: data, mountPath: /var/opt/mssql } }
        documentIndex: 1

  - it: refuses SQL Server without the EULA accepted
    template: templates/backup-scratch.yaml
    set:
      database.provider: postgres
      postgres.enabled: true
      mssql.enabled: false
      mssql.acceptEula: false
      backupScratch.enabled: true
    asserts:
      - failedTemplate: { errorMessage: "backupScratch on SQL Server needs mssql.acceptEula true (you accept its EULA)" }

  - it: takes the kind it's given, and its own resources
    template: templates/backup-scratch.yaml
    set:
      backupScratch: { enabled: true, provider: SqlServer, resources: { limits: { memory: 2Gi } } }
    asserts:
      - equal: { path: "spec.ports[0].port", value: 1433 }
        documentIndex: 0
      - equal: { path: "spec.template.spec.containers[0].resources", value: { limits: { memory: 2Gi } } }
        documentIndex: 1

  - it: takes connections from the backend only, and makes none
    template: templates/backup-scratch.yaml
    set:
      backupScratch.enabled: true
    asserts:
      - equal: { path: spec.policyTypes, value: [Ingress, Egress] }
        documentIndex: 2
      - equal: { path: "spec.ingress[0].from[0].podSelector.matchLabels.app", value: grif-backend }
        documentIndex: 2
      - notExists: { path: spec.egress }
        documentIndex: 2

  - it: lets the backend reach it
    template: templates/networkpolicy.yaml
    set:
      backupScratch.enabled: true
    documentSelector: { path: metadata.name, value: grif-backend }
    asserts:
      - contains:
          path: spec.egress
          content: { to: [{ podSelector: { matchLabels: { app: grif-backup-scratch } } }], ports: [{ protocol: TCP, port: 5432 }] }

  - it: gives the backend its connection, the password from the environment
    template: templates/backend.yaml
    documentIndex: 1
    set:
      backupScratch.enabled: true
    asserts:
      - contains:
          path: "spec.template.spec.containers[0].env"
          content: { name: SCRATCH_DB_PASSWORD, valueFrom: { secretKeyRef: { name: grif-secrets, key: BACKUP_SCRATCH_PASSWORD } } }
      - contains: { path: "spec.template.spec.containers[0].env", content: { name: DatabaseBackup__Scratch__Provider, value: Postgres } }
      - contains:
          path: "spec.template.spec.containers[0].env"
          content: { name: DatabaseBackup__Scratch__ConnectionString, value: "Host=grif-backup-scratch;Port=5432;Database=postgres;Username=postgres;Password=$(SCRATCH_DB_PASSWORD);GSS Encryption Mode=Disable" }

  - it: gives the backend SQL Server's connection beside PostgreSQL
    template: templates/backend.yaml
    documentIndex: 1
    set:
      database.provider: postgres
      postgres.enabled: true
      mssql.enabled: false
      backupScratch.enabled: true
    asserts:
      - contains: { path: "spec.template.spec.containers[0].env", content: { name: DatabaseBackup__Scratch__Provider, value: SqlServer } }
      - contains:
          path: "spec.template.spec.containers[0].env"
          content: { name: DatabaseBackup__Scratch__ConnectionString, value: "Server=grif-backup-scratch,1433;Database=master;User Id=sa;Password=$(SCRATCH_DB_PASSWORD);Encrypt=True;TrustServerCertificate=True" }
