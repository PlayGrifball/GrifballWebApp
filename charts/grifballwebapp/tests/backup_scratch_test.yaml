suite: Database Backup scratch server
templates:
  - templates/backup-scratch.yaml
  - templates/backend.yaml
  - templates/networkpolicy.yaml
  - templates/worker.yaml
release:
  namespace: grif-x
set:
  mssql.acceptEula: true
tests:
  - it: is off by default
    template: templates/backup-scratch.yaml
    asserts:
      - hasDocuments: { count: 0 }

  - it: is PostgreSQL beside SQL Server, holding nothing, with its own password
    template: templates/backup-scratch.yaml
    set:
      backupScratch.enabled: true
    asserts:
      - equal: { path: "spec.ports[0].port", value: 5432 }
        documentIndex: 0
      - matchRegex: { path: "spec.template.spec.containers[0].image", pattern: "^docker.io/library/postgres:" }
        documentIndex: 1
      - contains:
          path: "spec.template.spec.containers[0].env"
          content: { name: POSTGRES_PASSWORD, valueFrom: { secretKeyRef: { name: grif-secrets, key: BACKUP_SCRATCH_PASSWORD } } }
        documentIndex: 1
      - contains: { path: spec.template.spec.volumes, content: { name: data, emptyDir: { sizeLimit: 4Gi } } }
        documentIndex: 1
      - equal: { path: "spec.template.spec.initContainers[0].command[2]", value: "chown -R 70:70 /data" }
        documentIndex: 1

  - it: is SQL Server beside PostgreSQL, needing its EULA accepted
    template: templates/backup-scratch.yaml
    set:
      database.provider: postgres
      postgres.enabled: true
      mssql.enabled: false
      backupScratch.enabled: true
    asserts:
      - equal: { path: "spec.ports[0].port", value: 1433 }
        documentIndex: 0
      - matchRegex: { path: "spec.template.spec.containers[0].image", pattern: "^mcr.microsoft.com/mssql/server:" }
        documentIndex: 1
      - contains: { path: "spec.template.spec.containers[0].env", content: { name: ACCEPT_EULA, value: "Y" } }
        documentIndex: 1
      - contains: { path: "spec.template.spec.containers[0].volumeMounts", content: { name: data, mountPath: /var/opt/mssql } }
        documentIndex: 1

  - it: refuses SQL Server without the EULA accepted
    template: templates/backup-scratch.yaml
    set:
      database.provider: postgres
      postgres.enabled: true
      mssql.enabled: false
      mssql.acceptEula: false
      backupScratch.enabled: true
    asserts:
      - failedTemplate: { errorMessage: "backupScratch on SQL Server needs mssql.acceptEula true (you accept its EULA)" }

  - it: takes the kind it's given, and its own resources
    template: templates/backup-scratch.yaml
    set:
      backupScratch: { enabled: true, provider: SqlServer, resources: { limits: { memory: 2Gi } } }
    asserts:
      - equal: { path: "spec.ports[0].port", value: 1433 }
        documentIndex: 0
      - equal: { path: "spec.template.spec.containers[0].resources", value: { limits: { memory: 2Gi } } }
        documentIndex: 1

  - it: takes connections from the backend only, and makes none
    template: templates/backup-scratch.yaml
    set:
      backupScratch.enabled: true
    documentSelector: { path: kind, value: NetworkPolicy }
    asserts:
      - equal: { path: spec.policyTypes, value: [Ingress, Egress] }
      - equal: { path: "spec.ingress[0].from[0].podSelector.matchLabels.app", value: grif-backend }
      - notExists: { path: spec.egress }

  - it: lets the backend reach it
    template: templates/networkpolicy.yaml
    set:
      backupScratch.enabled: true
    documentSelector: { path: metadata.name, value: grif-backend }
    asserts:
      - contains:
          path: spec.egress
          content: { to: [{ podSelector: { matchLabels: { app: grif-backup-scratch } } }], ports: [{ protocol: TCP, port: 5432 }] }

  - it: gives the backend its connection, the password from the environment
    template: templates/backend.yaml
    documentIndex: 1
    set:
      backupScratch.enabled: true
    asserts:
      - contains:
          path: "spec.template.spec.containers[0].env"
          content: { name: SCRATCH_DB_PASSWORD, valueFrom: { secretKeyRef: { name: grif-secrets, key: BACKUP_SCRATCH_PASSWORD } } }
      - contains: { path: "spec.template.spec.containers[0].env", content: { name: DatabaseBackup__Scratch__Provider, value: Postgres } }
      - contains:
          path: "spec.template.spec.containers[0].env"
          content: { name: DatabaseBackup__Scratch__ConnectionString, value: "Host=grif-backup-scratch;Port=5432;Database=postgres;Username=postgres;Password=$(SCRATCH_DB_PASSWORD);GSS Encryption Mode=Disable" }

  - it: with a worker, gives the worker the scratch server (its backup job uses it) and its own address (recorded with a backup it makes)
    templates: [templates/worker.yaml, templates/backend.yaml]
    set:
      backupScratch.enabled: true
      worker.enabled: true
    asserts:
      - contains:
          path: "spec.template.spec.containers[0].env"
          content: { name: SCRATCH_DB_PASSWORD, valueFrom: { secretKeyRef: { name: grif-secrets, key: BACKUP_SCRATCH_PASSWORD } } }
        template: templates/worker.yaml
      - contains: { path: "spec.template.spec.containers[0].env", content: { name: DatabaseBackup__Scratch__Deployment, value: grif-backup-scratch } }
        template: templates/worker.yaml
      - equal: { path: spec.template.spec.serviceAccountName, value: grif-backend }
        template: templates/worker.yaml
      - notContains: { path: "spec.template.spec.containers[0].env", content: { name: DatabaseBackup__Scratch__Provider, value: Postgres } }
        template: templates/backend.yaml
        documentIndex: 1
      - notExists: { path: spec.template.spec.serviceAccountName }
        template: templates/backend.yaml
        documentIndex: 1
      - contains: { path: "spec.template.spec.containers[0].env", content: { name: POD_IP, valueFrom: { fieldRef: { fieldPath: status.podIP } } } }
        template: templates/worker.yaml
      - contains: { path: "spec.template.spec.containers[0].env", content: { name: DatabaseBackup__NodeUrl, value: "http://$(POD_IP):5295" } }
        template: templates/worker.yaml
      - notContains: { path: "spec.template.spec.containers[0].env", content: { name: DatabaseBackup__NodeUrl, value: "http://$(POD_IP):5295" } }
        template: templates/backend.yaml
        documentIndex: 1

  - it: with a worker, lets only the worker reach the scratch server and the Kubernetes API, and the backend reach the worker
    templates: [templates/networkpolicy.yaml, templates/backup-scratch.yaml]
    set:
      backupScratch.enabled: true
      worker.enabled: true
    asserts:
      - contains:
          path: spec.egress
          content: { to: [{ podSelector: { matchLabels: { app: grif-backup-scratch } } }], ports: [{ protocol: TCP, port: 5432 }] }
        template: templates/networkpolicy.yaml
        documentSelector: { path: metadata.name, value: grif-worker }
      - contains: { path: spec.egress, content: { ports: [{ protocol: TCP, port: 443 }, { protocol: TCP, port: 6443 }] } }
        template: templates/networkpolicy.yaml
        documentSelector: { path: metadata.name, value: grif-worker }
      - notContains:
          path: spec.egress
          content: { to: [{ podSelector: { matchLabels: { app: grif-backup-scratch } } }], ports: [{ protocol: TCP, port: 5432 }] }
        template: templates/networkpolicy.yaml
        documentSelector: { path: metadata.name, value: grif-backend }
      - contains: { path: spec.egress, content: { to: [{ podSelector: { matchLabels: { app: grif-worker } } }], ports: [{ protocol: TCP, port: 5295 }] } }
        template: templates/networkpolicy.yaml
        documentSelector: { path: metadata.name, value: grif-backend }
      - equal: { path: "spec.ingress[0].from[0].podSelector.matchLabels.app", value: grif-worker }
        template: templates/backup-scratch.yaml
        documentSelector: { path: kind, value: NetworkPolicy }

  - it: gives the backend SQL Server's connection beside PostgreSQL
    template: templates/backend.yaml
    documentIndex: 1
    set:
      database.provider: postgres
      postgres.enabled: true
      mssql.enabled: false
      backupScratch.enabled: true
    asserts:
      - contains: { path: "spec.template.spec.containers[0].env", content: { name: DatabaseBackup__Scratch__Provider, value: SqlServer } }
      - contains:
          path: "spec.template.spec.containers[0].env"
          content: { name: DatabaseBackup__Scratch__ConnectionString, value: "Server=grif-backup-scratch,1433;Database=master;User Id=sa;Password=$(SCRATCH_DB_PASSWORD);Encrypt=True;TrustServerCertificate=True" }

  - it: is stopped until the backend starts it, by default, which the chart and Argo CD then leave alone
    template: templates/backup-scratch.yaml
    set:
      backupScratch.enabled: true
    documentSelector: { path: kind, value: Deployment }
    asserts:
      - notExists: { path: spec.replicas }

  - it: lets the backend read the Deployment and scale it, and nothing more
    template: templates/backup-scratch.yaml
    set:
      backupScratch.enabled: true
    documentSelector: { path: kind, value: Role }
    asserts:
      - equal:
          path: rules
          value:
            - { apiGroups: [apps], resources: [deployments], resourceNames: [grif-backup-scratch], verbs: [get] }
            - { apiGroups: [apps], resources: [deployments/scale], resourceNames: [grif-backup-scratch], verbs: [get, patch] }

  - it: binds that Role to the backend ServiceAccount
    template: templates/backup-scratch.yaml
    set:
      backupScratch.enabled: true
    documentSelector: { path: kind, value: RoleBinding }
    asserts:
      - equal: { path: "subjects[0]", value: { kind: ServiceAccount, name: grif-backend, namespace: grif-x } }
      - equal: { path: roleRef.name, value: grif-backup-scratch-scaler }

  - it: runs all the time when alwaysOn, with no Kubernetes access for the backend
    template: templates/backup-scratch.yaml
    set:
      backupScratch: { enabled: true, mode: alwaysOn }
    asserts:
      - equal: { path: spec.replicas, value: 1 }
        documentSelector: { path: kind, value: Deployment }
      - hasDocuments: { count: 3 }

  - it: runs the backend as that ServiceAccount, told which Deployment to scale
    template: templates/backend.yaml
    documentIndex: 1
    set:
      backupScratch.enabled: true
    asserts:
      - equal: { path: spec.template.spec.serviceAccountName, value: grif-backend }
      - equal: { path: spec.template.spec.automountServiceAccountToken, value: true }
      - contains: { path: "spec.template.spec.containers[0].env", content: { name: DatabaseBackup__Scratch__Deployment, value: grif-backup-scratch } }

  - it: keeps the backend off the Kubernetes API when alwaysOn
    template: templates/backend.yaml
    documentIndex: 1
    set:
      backupScratch: { enabled: true, mode: alwaysOn }
    asserts:
      - notExists: { path: spec.template.spec.serviceAccountName }
      - equal: { path: spec.template.spec.automountServiceAccountToken, value: false }
      - notContains: { path: "spec.template.spec.containers[0].env", content: { name: DatabaseBackup__Scratch__Deployment, value: grif-backup-scratch } }

  - it: lets the backend reach the Kubernetes API when onDemand, where it is given
    template: templates/networkpolicy.yaml
    set:
      backupScratch.enabled: true
      networkPolicy.backend.apiServerTo: [{ ipBlock: { cidr: 10.0.0.1/32 } }]
    documentSelector: { path: metadata.name, value: grif-backend }
    asserts:
      - contains:
          path: spec.egress
          content: { ports: [{ protocol: TCP, port: 443 }, { protocol: TCP, port: 6443 }], to: [{ ipBlock: { cidr: 10.0.0.1/32 } }] }
