suite: worker (scale-out)
templates:
  - templates/worker.yaml
  - templates/backend.yaml
  - templates/networkpolicy.yaml
release:
  namespace: grif-x
set:
  mssql.acceptEula: true
tests:
  - it: is off by default, and the backend runs everything (no App__Role)
    asserts:
      - hasDocuments: { count: 0 }
        template: templates/worker.yaml
      - notContains: { path: "spec.template.spec.containers[0].env", content: { name: App__Role, value: api }, any: true }
        template: templates/backend.yaml
        documentIndex: 1

  - it: refuses more than one backend replica without a worker
    template: templates/backend.yaml
    set:
      backend.replicas: 2
    asserts:
      - failedTemplate:
          errorPattern: "backend.replicas above 1 needs worker.enabled"

  - it: refuses more than one API pod without the sticky hubs route (SignalR negotiates again)
    template: templates/backend.yaml
    set:
      worker.enabled: true
      backend.replicas: 2
    asserts:
      - failedTemplate:
          errorPattern: "ingressRoute.enabled and ingressRoute.hubs.enabled"

  - it: runs one worker pod by default, recreated, as App:Role worker, without the state volume
    template: templates/worker.yaml
    documentIndex: 0
    set:
      worker.enabled: true
      backend.replicas: 3
      ingressRoute: { enabled: true, host: grif.example }
      networkPolicy.frontend.from: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: traefik } } }]
    asserts:
      - isKind: { of: Deployment }
      - equal: { path: metadata.name, value: grif-worker }
      - equal: { path: spec.replicas, value: 1 }
      - equal: { path: spec.strategy, value: { type: Recreate } }
      - equal: { path: spec.selector.matchLabels, value: { app: grif-worker } }
      - equal: { path: spec.template.metadata.labels.app, value: grif-worker }
      - equal: { path: "spec.template.metadata.labels['app.kubernetes.io/component']", value: worker }
      - contains: { path: "spec.template.spec.containers[0].env", content: { name: App__Role, value: worker } }
      - contains: { path: spec.template.spec.volumes, content: { name: state, emptyDir: {} } }
      - equal: { path: "spec.template.spec.initContainers[0].name", value: wait-for-migrations }

  - it: runs as many workers as worker.replicas, with worker.strategy when set
    template: templates/worker.yaml
    documentIndex: 0
    set:
      worker.enabled: true
      worker.replicas: 3
      worker.strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
    asserts:
      - equal: { path: spec.replicas, value: 3 }
      - equal: { path: spec.strategy, value: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } } }

  - it: refuses fewer than one worker
    template: templates/worker.yaml
    set:
      worker.enabled: true
      worker.replicas: 0
    asserts:
      - failedTemplate:
          errorPattern: "/worker/replicas"

  - it: runs exactly one grif-discord pod, recreated, as App:Role discord, with the state volume
    template: templates/worker.yaml
    documentIndex: 1
    set:
      worker.enabled: true
      worker.replicas: 3
      backend.replicas: 3
      ingressRoute: { enabled: true, host: grif.example }
      networkPolicy.frontend.from: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: traefik } } }]
    asserts:
      - isKind: { of: Deployment }
      - equal: { path: metadata.name, value: grif-discord }
      - equal: { path: spec.replicas, value: 1 }
      - equal: { path: spec.strategy, value: { type: Recreate } }
      - equal: { path: spec.selector.matchLabels, value: { app: grif-discord } }
      - equal: { path: spec.template.metadata.labels.app, value: grif-discord }
      - equal: { path: "spec.template.metadata.labels['app.kubernetes.io/component']", value: discord }
      - contains: { path: "spec.template.spec.containers[0].env", content: { name: App__Role, value: discord } }
      - contains: { path: spec.template.spec.volumes, content: { name: state, persistentVolumeClaim: { claimName: grif-backend-state } } }
      - equal: { path: spec.template.spec.automountServiceAccountToken, value: false }
      - equal: { path: "spec.template.spec.initContainers[0].name", value: wait-for-migrations }

  - it: gives grif-discord its own resources where set, else the worker's
    template: templates/worker.yaml
    set:
      worker.enabled: true
      worker.resources: { limits: { memory: 1Gi } }
      worker.discord.resources: { limits: { memory: 256Mi } }
    asserts:
      - equal: { path: "spec.template.spec.containers[0].resources", value: { limits: { memory: 1Gi } } }
        documentIndex: 0
      - equal: { path: "spec.template.spec.containers[0].resources", value: { limits: { memory: 256Mi } } }
        documentIndex: 1

  - it: shares the backend's settings and secrets, with its own pod settings where set
    template: templates/worker.yaml
    set:
      worker.enabled: true
      backend.config.Discord.DraftChannel: "1"
      backend.secretConfig: { "Discord:Token": DiscordToken }
      backend.podLabels: { team: grif }
      backend.nodeSelector: { disk: ssd }
      worker.podLabels: { role: worker }
      worker.resources: { limits: { memory: 1Gi } }
    asserts:
      - contains: { path: "spec.template.spec.containers[0].env", content: { name: Discord__DraftChannel, value: "1" } }
      - contains:
          path: "spec.template.spec.containers[0].env"
          content: { name: Discord__Token, valueFrom: { secretKeyRef: { name: grif-secrets, key: DiscordToken } } }
      - equal: { path: spec.template.metadata.labels.team, value: grif }
      - equal: { path: spec.template.metadata.labels.role, value: worker }
      - equal: { path: spec.template.spec.nodeSelector, value: { disk: ssd } }
      - equal: { path: "spec.template.spec.containers[0].resources", value: { limits: { memory: 1Gi } } }

  - it: runs the backend as App:Role api, rolling, as many as asked, without the state volume
    template: templates/backend.yaml
    documentIndex: 1
    set:
      worker.enabled: true
      backend.replicas: 3
      ingressRoute: { enabled: true, host: grif.example }
      networkPolicy.frontend.from: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: traefik } } }]
    asserts:
      - equal: { path: spec.replicas, value: 3 }
      - equal: { path: spec.strategy, value: { type: RollingUpdate } }
      - contains: { path: "spec.template.spec.containers[0].env", content: { name: App__Role, value: api } }
      - contains: { path: spec.template.spec.volumes, content: { name: state, emptyDir: {} } }
      - equal: { path: "spec.template.spec.containers[0].resources", value: { requests: { memory: 128Mi }, limits: { memory: 512Mi } } }

  - it: keeps the Service on the API pods
    template: templates/backend.yaml
    documentIndex: 2
    set:
      worker.enabled: true
    asserts:
      - isKind: { of: Service }
      - equal: { path: spec.selector, value: { app: grif-backend } }

  - it: gives the worker the backend's egress, only the backend in (the Database Backup page's file), and lets it reach the database
    template: templates/networkpolicy.yaml
    set:
      worker.enabled: true
      networkPolicy.worker.extraEgress: [{ ports: [{ protocol: TCP, port: 9999 }] }]
    asserts:
      - hasDocuments: { count: 6 }
      - equal: { path: metadata.name, value: grif-worker }
        documentIndex: 2
      - equal: { path: spec.podSelector.matchLabels, value: { app: grif-worker } }
        documentIndex: 2
      - equal: { path: spec.ingress, value: [{ from: [{ podSelector: { matchLabels: { app: grif-backend } } }], ports: [{ protocol: TCP, port: 5295 }] }] }
        documentIndex: 2
      - equal: { path: "spec.egress[1]", value: { to: [{ podSelector: { matchLabels: { app: grif-mssql } } }], ports: [{ protocol: TCP, port: 1433 }] } }
        documentIndex: 2
      - equal: { path: "spec.egress[2].ports", value: [{ protocol: TCP, port: 443 }] }
        documentIndex: 2
      - contains: { path: spec.egress, content: { ports: [{ protocol: TCP, port: 9999 }] } }
        documentIndex: 2
      - contains: { path: "spec.ingress[0].from", content: { podSelector: { matchLabels: { app: grif-worker } } } }
        documentIndex: 3
      - contains: { path: "spec.ingress[0].from", content: { podSelector: { matchLabels: { app: grif-discord } } } }
        documentIndex: 3

  - it: gives grif-discord the backend's egress and no ingress
    template: templates/networkpolicy.yaml
    documentIndex: 5
    set:
      worker.enabled: true
      networkPolicy.discord.extraEgress: [{ ports: [{ protocol: TCP, port: 9998 }] }]
    asserts:
      - equal: { path: metadata.name, value: grif-discord }
      - equal: { path: spec.podSelector.matchLabels, value: { app: grif-discord } }
      - equal: { path: spec.policyTypes, value: [Ingress, Egress] }
      - notExists: { path: spec.ingress }
      - equal: { path: "spec.egress[1]", value: { to: [{ podSelector: { matchLabels: { app: grif-mssql } } }], ports: [{ protocol: TCP, port: 1433 }] } }
      - equal: { path: "spec.egress[2].ports", value: [{ protocol: TCP, port: 443 }] }
      - contains: { path: spec.egress, content: { ports: [{ protocol: TCP, port: 9998 }] } }
      - contains:
          path: spec.egress
          content:
            ports: [{ protocol: TCP, port: 8080 }]
            to: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: halo-gateway } } }]

  - it: lets grif-discord in only where networkPolicy.discord.extraIngress says
    template: templates/networkpolicy.yaml
    documentIndex: 5
    set:
      worker.enabled: true
      networkPolicy.discord.extraIngress: [{ from: [{ namespaceSelector: { matchLabels: { team: monitoring } } }] }]
    asserts:
      - equal: { path: spec.ingress, value: [{ from: [{ namespaceSelector: { matchLabels: { team: monitoring } } }] }] }

  - it: gives grif-discord the workers' extra rules when networkPolicy.discord doesn't set its own
    template: templates/networkpolicy.yaml
    documentIndex: 5
    set:
      worker.enabled: true
      networkPolicy.worker.extraIngress: [{ from: [{ namespaceSelector: { matchLabels: { team: monitoring } } }] }]
      networkPolicy.worker.extraEgress: [{ ports: [{ protocol: TCP, port: 3128 }] }]
    asserts:
      - equal: { path: metadata.name, value: grif-discord }
      - equal: { path: spec.ingress, value: [{ from: [{ namespaceSelector: { matchLabels: { team: monitoring } } }] }] }
      - contains: { path: spec.egress, content: { ports: [{ protocol: TCP, port: 3128 }] } }

  - it: gives grif-discord only its own extra rules where networkPolicy.discord sets them, [] meaning none
    template: templates/networkpolicy.yaml
    documentIndex: 5
    set:
      worker.enabled: true
      networkPolicy.worker.extraIngress: [{ from: [{ namespaceSelector: { matchLabels: { team: monitoring } } }] }]
      networkPolicy.worker.extraEgress: [{ ports: [{ protocol: TCP, port: 3128 }] }]
      networkPolicy.discord.extraIngress: []
      networkPolicy.discord.extraEgress: [{ ports: [{ protocol: TCP, port: 9998 }] }]
    asserts:
      - notExists: { path: spec.ingress }
      - contains: { path: spec.egress, content: { ports: [{ protocol: TCP, port: 9998 }] } }
      - notContains: { path: spec.egress, content: { ports: [{ protocol: TCP, port: 3128 }] } }

  - it: lets the worker reach the chart's PostgreSQL
    template: templates/networkpolicy.yaml
    documentIndex: 3
    set:
      worker.enabled: true
      database.provider: postgres
    asserts:
      - equal: { path: metadata.name, value: grif-postgres }
      - contains: { path: "spec.ingress[0].from", content: { podSelector: { matchLabels: { app: grif-worker } } } }

  - it: refuses a worker in Halo Direct mode (its tokens are files in one pod's working directory)
    template: templates/backend.yaml
    set:
      worker.enabled: true
      backend.replicas: 2
      backend.halo.mode: Direct
    asserts:
      - failedTemplate:
          errorPattern: "worker.enabled \\(several backend pods\\) needs backend.halo.mode Gateway"

  - it: refuses a worker when config sets HaloInfinite:Mode to Direct
    template: templates/backend.yaml
    set:
      worker.enabled: true
      backend.config: { HaloInfinite: { Mode: direct } }
    asserts:
      - failedTemplate:
          errorPattern: "needs backend.halo.mode Gateway"

  - it: gives the worker the backend's Halo gateway egress and settings (Gateway mode)
    set:
      worker.enabled: true
    asserts:
      - contains:
          path: spec.egress
          content:
            ports: [{ protocol: TCP, port: 8080 }]
            to: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: halo-gateway } } }]
        template: templates/networkpolicy.yaml
        documentIndex: 2
      - contains: { path: "spec.template.spec.containers[0].env", content: { name: HaloInfinite__Mode, value: Gateway } }
        template: templates/worker.yaml
      - contains:
          path: "spec.template.spec.containers[0].env"
          content: { name: HaloGateway__BaseUrl, value: "http://halo-gateway.halo-gateway.svc:8080/" }
        template: templates/worker.yaml
