suite: deploy hook
templates:
  - templates/deploy-hook.yaml
release:
  namespace: grif-x
set:
  mssql.acceptEula: true
tests:
  - it: creates its RBAC as hooks ahead of the Job
    asserts:
      - hasDocuments: { count: 4 }
      - equal: { path: "metadata.annotations['helm.sh/hook-weight']", value: "-10" }
        documentIndex: 0
      - equal: { path: "metadata.annotations['argocd.argoproj.io/hook']", value: PreSync }
        documentIndex: 1
      - contains:
          path: rules
          content: { apiGroups: [apps], resources: [deployments], resourceNames: [grif-mssql], verbs: [get] }
        documentIndex: 1

  - it: runs before upgrades in Helm and before syncs in Argo CD
    documentIndex: 3
    asserts:
      - isKind: { of: Job }
      - equal: { path: "metadata.annotations['helm.sh/hook']", value: pre-upgrade }
      - equal: { path: "metadata.annotations['argocd.argoproj.io/hook']", value: PreSync }
      - equal: { path: spec.backoffLimit, value: 0 }

  - it: waits, lists, checks, scales down, backs up, then migrates with the backend image
    documentIndex: 3
    set:
      backend.image: { tag: prod, digest: sha256:abc }
    asserts:
      - lengthEqual: { path: spec.template.spec.initContainers, count: 5 }
      - equal: { path: "spec.template.spec.initContainers[0].name", value: wait-for-database }
      - equal: { path: "spec.template.spec.initContainers[1].name", value: migration-list }
      - equal: { path: "spec.template.spec.initContainers[2].name", value: check-pending }
      - equal: { path: "spec.template.spec.initContainers[3].name", value: scale-down }
      - equal: { path: "spec.template.spec.initContainers[4].name", value: backup }
      - equal: { path: "spec.template.spec.initContainers[1].image", value: "ghcr.io/playgrifball/grifballwebappserver:prod@sha256:abc" }
      - equal: { path: "spec.template.spec.containers[0].image", value: "ghcr.io/playgrifball/grifballwebappserver:prod@sha256:abc" }
      - contains: { path: "spec.template.spec.initContainers[0].env", content: { name: BUNDLED, value: "true" } }
      - contains: { path: "spec.template.spec.initContainers[4].env", content: { name: BACKUP_DIR, value: /var/opt/mssql/backup/grif-x } }

  - it: skips scale-down and backup when disabled, and brings its own ServiceAccount
    set:
      deployHook: { scaleDown: false, backup: { enabled: false }, serviceAccount: { create: false, name: mine } }
    asserts:
      - hasDocuments: { count: 1 }
      - lengthEqual: { path: spec.template.spec.initContainers, count: 3 }
      - equal: { path: "spec.template.spec.initContainers[2].name", value: check-pending }
      - equal: { path: spec.template.spec.serviceAccountName, value: mine }

  - it: connects to an external database, which is never "not deployed yet"
    documentIndex: 3
    set:
      mssql.enabled: false
      database: { host: sql.example, port: 14330, user: grif, password: { secretName: db, key: pw } }
      deployHook.backup.directory: /backups/grif
    asserts:
      - contains: { path: "spec.template.spec.initContainers[0].env", content: { name: BUNDLED, value: "false" } }
      - contains: { path: "spec.template.spec.initContainers[2].env", content: { name: DB_HOST, value: sql.example } }
      - contains: { path: "spec.template.spec.initContainers[2].env", content: { name: DB_PORT, value: "14330" } }
      - contains: { path: "spec.template.spec.initContainers[2].env", content: { name: DB_USER, value: grif } }
      - contains: { path: "spec.template.spec.initContainers[2].env", content: { name: DB_PASSWORD, valueFrom: { secretKeyRef: { name: db, key: pw } } } }
      - contains: { path: "spec.template.spec.initContainers[4].env", content: { name: BACKUP_DIR, value: /backups/grif } }

  - it: can be turned off
    set:
      deployHook.enabled: false
    asserts:
      - hasDocuments: { count: 0 }

  - it: takes extra env, steps, annotations, labels and security settings
    documentIndex: 3
    set:
      deployHook:
        extraEnv: [{ name: TZ, value: UTC }]
        extraInitContainers:
          - name: notify
            image: busybox
            command: [echo, "{{ .Release.Namespace }}"]
        annotations: { argocd.argoproj.io/hook-delete-policy: HookSucceeded, team: grif }
        podAnnotations: { a: b }
        podLabels: { c: d }
        imagePullPolicy: Always
        securityContext: { readOnlyRootFilesystem: true, runAsGroup: 1000 }
        podSecurityContext: { fsGroup: 2000 }
        affinity: { nodeAffinity: {} }
    asserts:
      - contains: { path: "spec.template.spec.initContainers[2].env", content: { name: TZ, value: UTC } }
      - contains: { path: "spec.template.spec.containers[0].env", content: { name: TZ, value: UTC } }
      - equal: { path: "spec.template.spec.initContainers[5].name", value: notify }
      - equal: { path: "spec.template.spec.initContainers[5].command", value: [echo, grif-x] }
      - equal: { path: "metadata.annotations['argocd.argoproj.io/hook-delete-policy']", value: HookSucceeded }
      - equal: { path: "metadata.annotations['argocd.argoproj.io/hook']", value: PreSync }
      - equal: { path: metadata.annotations.team, value: grif }
      - equal: { path: spec.template.metadata.annotations.a, value: b }
      - equal: { path: spec.template.metadata.labels.c, value: d }
      - equal: { path: spec.template.metadata.labels.app, value: grif-deploy-hook }
      - equal: { path: "spec.template.spec.initContainers[0].imagePullPolicy", value: Always }
      - equal: { path: "spec.template.spec.initContainers[2].securityContext.runAsGroup", value: 1000 }
      - equal: { path: "spec.template.spec.initContainers[0].securityContext.runAsUser", value: 65534 }
      - equal: { path: spec.template.spec.securityContext.fsGroup, value: 2000 }
      - exists: { path: spec.template.spec.affinity.nodeAffinity }

  - it: runs a replacement script in place of a step's own
    documentIndex: 3
    set:
      deployHook.scripts: { backup: "echo custom backup", migrate: "echo custom migrate" }
    asserts:
      - matchRegex: { path: "spec.template.spec.initContainers[4].args[0]", pattern: "echo custom backup" }
      - notMatchRegex: { path: "spec.template.spec.initContainers[4].args[0]", pattern: "BACKUP DATABASE" }
      - matchRegex: { path: "spec.template.spec.containers[0].args[0]", pattern: "Nothing to migrate.*\\n.*echo custom migrate" }
      - notMatchRegex: { path: "spec.template.spec.containers[0].args[0]", pattern: "efbundle" }

  - it: runs both kubectl steps as the same non-root user (they share kubectl's cache in /tmp)
    documentIndex: 3
    asserts:
      - equal: { path: "spec.template.spec.initContainers[0].securityContext.runAsUser", value: 65534 }
      - equal: { path: "spec.template.spec.initContainers[3].name", value: scale-down }
      - equal: { path: "spec.template.spec.initContainers[3].securityContext.runAsUser", value: 65534 }
      - equal: { path: "spec.template.spec.initContainers[3].securityContext.capabilities.drop", value: [ALL] }
