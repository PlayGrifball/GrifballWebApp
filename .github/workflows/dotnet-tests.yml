name: .NET Tests

on:
  workflow_dispatch:
  pull_request:
    branches: [ "master" ]
  push:
    branches: [ "master" ]

permissions:
  contents: read
  actions: read
  checks: write

env:
  DOTNET_VERSION: '10.0.x'
  # Testcontainers configuration
  TESTCONTAINERS_REUSE_ENABLE: false
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true

jobs:
  # The whole suite once per database the app supports (Database:Provider): each test gets its own
  # database on a Testcontainers server of that kind (GrifballWebApp.Test/TestDatabase.cs).
  test:
    name: test (${{ matrix.database }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        database: [SqlServer, Postgres]
    env:
      GRIF_TEST_DATABASE: ${{ matrix.database }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: Restore dependencies
      run: dotnet restore GrifballWebApp.sln
      
    - name: Build
      run: dotnet build GrifballWebApp.Test/GrifballWebApp.Test.csproj --no-restore --configuration Release /p:DefineConstants=DOCKER_BUILD
      
    - name: Test
      run: |
        dotnet test GrifballWebApp.Test/GrifballWebApp.Test.csproj \
        --no-build \
        --configuration Release \
        --verbosity normal \
        --logger trx \
        --results-directory TestResults/ \
        --collect:"XPlat Code Coverage" \
        --settings coverlet.runsettings
      
    - name: Upload Test Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-${{ matrix.database }}
        path: TestResults/
        
    - name: Publish Test Results
      uses: dorny/test-reporter@v2
      if: always()
      with:
        name: .NET Test Results (${{ matrix.database }})
        path: TestResults/*.trx
        reporter: dotnet-trx
        fail-on-error: true
        use-actions-summary: 'false'

    - name: Upload Coverage to Codecov
      uses: codecov/codecov-action@v4
      if: always()
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: TestResults/**/coverage.cobertura.xml
        flags: backend
        name: backend-coverage-${{ matrix.database }}
        fail_ci_if_error: true

    - name: Upload Test Results to Codecov (Test Analytics)
      uses: codecov/test-results-action@v1
      if: always()
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: TestResults/*.trx
        fail_ci_if_error: true
