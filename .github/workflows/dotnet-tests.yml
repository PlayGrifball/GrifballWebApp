name: .NET Tests

on:
  workflow_dispatch:
  pull_request:
    branches: [ "master" ]
  push:
    branches: [ "master" ]

permissions:
  contents: read
  actions: read
  checks: write

env:
  DOTNET_VERSION: '10.0.x'
  # Testcontainers configuration
  TESTCONTAINERS_REUSE_ENABLE: false
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true

jobs:
  # The whole suite once per database the app supports (Database:Provider): each test gets its own
  # database on a Testcontainers server of that kind (GrifballWebApp.Test/TestDatabase.cs).
  test:
    name: test (${{ matrix.database }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        database: [SqlServer, Postgres]
    env:
      GRIF_TEST_DATABASE: ${{ matrix.database }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    # NuGet's packages, kept between runs: the same csproj files restore from the cache, not nuget.org.
    - name: Cache NuGet packages
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
        restore-keys: nuget-${{ runner.os }}-

    - name: Restore dependencies
      run: dotnet restore GrifballWebApp.slnx
      
    - name: Build
      run: dotnet build GrifballWebApp.Test/GrifballWebApp.Test.csproj --no-restore --configuration Release /p:DefineConstants=DOCKER_BUILD
      
    - name: Test
      run: |
        dotnet test GrifballWebApp.Test/GrifballWebApp.Test.csproj \
        --no-build \
        --configuration Release \
        --verbosity normal \
        --logger trx \
        --results-directory TestResults/ \
        --collect:"XPlat Code Coverage" \
        --settings coverlet.runsettings
      
    - name: Upload Test Results
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      with:
        name: test-results-${{ matrix.database }}
        path: TestResults/
        
    - name: Publish Test Results
      uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
      if: always()
      with:
        name: .NET Test Results (${{ matrix.database }})
        path: TestResults/*.trx
        reporter: dotnet-trx
        fail-on-error: true
        use-actions-summary: 'false'

    - name: Upload Coverage to Codecov
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      if: always()
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: TestResults/**/coverage.cobertura.xml
        flags: backend
        name: backend-coverage-${{ matrix.database }}
        fail_ci_if_error: true

    - name: Upload Test Results to Codecov (Test Analytics)
      uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3 # v1.2.1
      if: always()
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: TestResults/*.trx
        fail_ci_if_error: true
