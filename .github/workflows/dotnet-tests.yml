name: .NET Tests

on:
  workflow_dispatch:
  pull_request:
    branches: [ "master" ]
  push:
    branches: [ "master" ]

# Each job asks for its own permissions: none here for a job to inherit.
permissions: {}

# A newer push to a PR replaces its run still going: only the latest commit's result matters. Every other run (a push
# to master) is its own group, so none waits for or replaces another.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_VERSION: '10.0.x'
  # Testcontainers configuration
  TESTCONTAINERS_REUSE_ENABLE: false
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true

jobs:
  # What the PR changed (.github/scripts/changed-areas.sh): a PR that leaves the .NET code alone skips the suite
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.areas.outputs.backend }}
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        sparse-checkout: .github/scripts
    - name: What changed
      id: areas
      env:
        GH_TOKEN: ${{ github.token }}
        PR: ${{ github.event.pull_request.number }}
      run: .github/scripts/changed-areas.sh

  # Every test project built once, for the test legs below to run (each used to build its own: the same compile four
  # times). The bin and obj folders go over as one tarball (tar keeps file modes, and zstd packs it better than the
  # artifact's zip); the legs restore the same NuGet cache, which the obj folders' NuGet imports point into.
  build:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      # Skipped step by step, as the test legs are, so they don't skip as a whole (and keep their check names)
      RUN: ${{ needs.changes.outputs.backend }}
      # Every test project: the legs' lists below
      TEST_PROJECTS: GrifballWebApp.Integration.Test GrifballWebApp.Domain.Test GrifballWebApp.Application.Test GrifballWebApp.Infrastructure.Test GrifballWebApp.Server.Test GrifballWebApp.Seeder.Test GrifballWebApp.Convert.Test GrifballWebApp.Analyzers.Test GrifballWebApp.Architecture.Test

    steps:
    - name: Checkout code
      if: env.RUN == 'true'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
    - name: Setup .NET
      if: env.RUN == 'true'
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    # NuGet's packages, kept between runs: the same csproj files restore from the cache, not nuget.org.
    - name: Cache NuGet packages
      if: env.RUN == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
        restore-keys: nuget-${{ runner.os }}-

    - name: Restore dependencies
      if: env.RUN == 'true'
      run: dotnet restore GrifballWebApp.slnx
      
    - name: Build
      if: env.RUN == 'true'
      run: |
        for project in $TEST_PROJECTS; do
          dotnet build "$project/$project.csproj" --no-restore --configuration Release /p:DefineConstants=DOCKER_BUILD
        done
      
    - name: Pack the build
      if: env.RUN == 'true'
      run: find . -type d \( -name bin -o -name obj \) -prune -not -path './grifballwebapp.client/*' -print0 | tar --null -T - -I 'zstd -T0 -3' -cf "$RUNNER_TEMP/build.tar.zst"

    - name: Upload the build
      if: env.RUN == 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: dotnet-build
        path: ${{ runner.temp }}/build.tar.zst
        # Already compressed
        compression-level: 0
        retention-days: 1
        if-no-files-found: error

  # The integration suite once per database the app supports (Database:Provider): each test gets its own
  # database on a Testcontainers server of that kind (GrifballWebApp.Integration.Test/TestDatabase.cs). The unit
  # tests, one project per layer (Domain, Application, Infrastructure, Server), one per host app beside the server
  # (Seeder, Convert), the analyzers' tests (Analyzers) and the architecture tests, touch no database: they run once, as the Unit leg.
  # Each leg runs the build job's binaries: nothing builds here.
  test:
    name: test (${{ matrix.database }})
    needs: [changes, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # dorny/test-reporter publishes the results as a check run (checks: write) and reads the run's artifacts (actions: read)
    permissions:
      contents: read
      actions: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        database: [SqlServer, Postgres, Sqlite]
        projects: [GrifballWebApp.Integration.Test]
        include:
        - database: Unit
          projects: GrifballWebApp.Domain.Test GrifballWebApp.Application.Test GrifballWebApp.Infrastructure.Test GrifballWebApp.Server.Test GrifballWebApp.Seeder.Test GrifballWebApp.Convert.Test GrifballWebApp.Analyzers.Test GrifballWebApp.Architecture.Test
    env:
      # Read by the integration tests alone (the Unit leg has no database)
      GRIF_TEST_DATABASE: ${{ matrix.database }}
      # The leg's test projects: names, space-separated (each is <name>/<name>.csproj)
      TEST_PROJECTS: ${{ matrix.projects }}
      # Skipped step by step, not as a job, so the check keeps its name (a skipped matrix job reports under its
      # unexpanded name) and passes
      RUN: ${{ needs.changes.outputs.backend }}
    
    steps:
    - name: Nothing to test
      if: env.RUN != 'true'
      run: "echo 'The PR changes no .NET code: the suite is skipped'"

    - name: Checkout code
      if: env.RUN == 'true'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup .NET
      if: env.RUN == 'true'
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    # The packages the build restored (the build job saved them under this key), for the imports in its obj folders
    - name: Restore the NuGet cache
      if: env.RUN == 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
        restore-keys: nuget-${{ runner.os }}-

    - name: Download the build
      if: env.RUN == 'true'
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: dotnet-build
        path: ${{ runner.temp }}

    - name: Unpack the build
      if: env.RUN == 'true'
      run: tar -I zstd -xf "$RUNNER_TEMP/build.tar.zst"

    - name: Test
      if: env.RUN == 'true'
      # Every project runs, a failing one included; the step fails after them if any did. One trx file per project.
      run: |
        status=0
        for project in $TEST_PROJECTS; do
          dotnet test "$project/$project.csproj" \
          --no-build \
          --configuration Release \
          --verbosity normal \
          --logger "trx;LogFileName=$project.trx" \
          --results-directory TestResults/ \
          --collect:"XPlat Code Coverage" \
          --settings coverlet.runsettings || status=1
        done
        exit $status
      
    - name: Upload Test Results
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always() && env.RUN == 'true'
      with:
        name: test-results-${{ matrix.database }}
        path: TestResults/
        
    - name: Publish Test Results
      uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
      if: always() && env.RUN == 'true'
      # The report only: the test step above already fails the job on a failing test. GitHub sometimes answers the
      # report's own update with 404 seconds after creating its check run, which would fail a job whose tests passed.
      continue-on-error: true
      with:
        name: .NET Test Results (${{ matrix.database }})
        path: TestResults/*.trx
        reporter: dotnet-trx
        fail-on-error: true
        use-actions-summary: 'false'

    - name: Upload Coverage to Codecov
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      if: always() && env.RUN == 'true'
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: TestResults/**/coverage.cobertura.xml
        flags: backend
        name: backend-coverage-${{ matrix.database }}
        fail_ci_if_error: true

    - name: Upload Test Results to Codecov (Test Analytics)
      uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3 # v1.2.1
      if: always() && env.RUN == 'true'
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: TestResults/*.trx
        fail_ci_if_error: true
