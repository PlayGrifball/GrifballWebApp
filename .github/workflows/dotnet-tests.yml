name: .NET Tests

on:
  workflow_dispatch:
  pull_request:
    branches: [ "master" ]
  push:
    branches: [ "master" ]

permissions:
  contents: read
  actions: read
  checks: write

# A newer push to a PR replaces its run still going: only the latest commit's result matters. Every other run (a push
# to master) is its own group, so none waits for or replaces another.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_VERSION: '10.0.x'
  # Testcontainers configuration
  TESTCONTAINERS_REUSE_ENABLE: false
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true

jobs:
  # What the PR changed (.github/scripts/changed-areas.sh): a PR that leaves the .NET code alone skips the suite
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.areas.outputs.backend }}
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        sparse-checkout: .github/scripts
    - name: What changed
      id: areas
      env:
        GH_TOKEN: ${{ github.token }}
        PR: ${{ github.event.pull_request.number }}
      run: .github/scripts/changed-areas.sh


  # The whole suite once per database the app supports (Database:Provider): each test gets its own
  # database on a Testcontainers server of that kind (GrifballWebApp.Test/TestDatabase.cs). SQL Server's run is the
  # slow one (its server starts slower, its tests run slower), so it is split between two jobs side by side by test
  # class: A-O, and everything else (the second shard's filter is exactly the first's opposite, so a new class always
  # runs, once). The test (SqlServer) job below puts the two back under the one check name.
  test:
    name: ${{ matrix.shards > 1 && format('test ({0}, {1}/{2})', matrix.database, matrix.shard, matrix.shards) || format('test ({0})', matrix.database) }}
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { database: SqlServer, shard: 1, shards: 2 }
          - { database: SqlServer, shard: 2, shards: 2 }
          - { database: Postgres, shard: 1, shards: 1 }
    env:
      GRIF_TEST_DATABASE: ${{ matrix.database }}
      # Skipped step by step, not as a job, so the check keeps its name (a skipped matrix job reports under its
      # unexpanded name) and passes
      RUN: ${{ needs.changes.outputs.backend }}
      # The test classes of the first shard, by their name's first letter (about half of SQL Server's test time)
      SHARD_LETTERS: ABCDEFGHIJKLMNO
    
    steps:
    - name: Nothing to test
      if: env.RUN != 'true'
      run: "echo 'The PR changes no .NET code: the suite is skipped'"

    - name: Checkout code
      if: env.RUN == 'true'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
    - name: Setup .NET
      if: env.RUN == 'true'
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    # NuGet's packages, kept between runs: the same csproj files restore from the cache, not nuget.org.
    - name: Cache NuGet packages
      if: env.RUN == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
        restore-keys: nuget-${{ runner.os }}-

    - name: Restore dependencies
      if: env.RUN == 'true'
      run: dotnet restore GrifballWebApp.slnx
      
    - name: Build
      if: env.RUN == 'true'
      run: dotnet build GrifballWebApp.Test/GrifballWebApp.Test.csproj --no-restore --configuration Release /p:DefineConstants=DOCKER_BUILD
      
    - name: Test
      if: env.RUN == 'true'
      env:
        SHARD: ${{ matrix.shard }}
        SHARDS: ${{ matrix.shards }}
      run: |
        filter=()
        if [ "$SHARDS" -gt 1 ]; then
          # Shard 1: a class starting with one of the letters. Shard 2: none of them (the same terms, negated)
          terms=$(echo "$SHARD_LETTERS" | fold -w1 | sed 's/^/FullyQualifiedName~GrifballWebApp.Test./')
          if [ "$SHARD" = 1 ]; then expr=$(echo "$terms" | paste -sd '|'); else expr=$(echo "$terms" | sed 's/~/!~/' | paste -sd '&'); fi
          filter=(--filter "$expr")
          echo "Shard $SHARD/$SHARDS: $expr"
        fi
        dotnet test GrifballWebApp.Test/GrifballWebApp.Test.csproj \
        --no-build \
        --configuration Release \
        --verbosity normal \
        --logger trx \
        --results-directory TestResults/ \
        --collect:"XPlat Code Coverage" \
        --settings coverlet.runsettings \
        "${filter[@]}"
      
    - name: Upload Test Results
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always() && env.RUN == 'true'
      with:
        name: test-results-${{ matrix.database }}-${{ matrix.shard }}
        path: TestResults/
        
    # A split database's results are published together, by its test job below
    - name: Publish Test Results
      uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
      if: always() && env.RUN == 'true' && matrix.shards == 1
      with:
        name: .NET Test Results (${{ matrix.database }})
        path: TestResults/*.trx
        reporter: dotnet-trx
        fail-on-error: true
        use-actions-summary: 'false'

    - name: Upload Coverage to Codecov
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      if: always() && env.RUN == 'true'
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: TestResults/**/coverage.cobertura.xml
        flags: backend
        name: backend-coverage-${{ matrix.database }}-${{ matrix.shard }}
        fail_ci_if_error: true

    - name: Upload Test Results to Codecov (Test Analytics)
      uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3 # v1.2.1
      if: always() && env.RUN == 'true'
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: TestResults/*.trx
        fail_ci_if_error: true

    # That this shard passed, for the test (SqlServer) job (a matrix job's result is only known for all its jobs together)
    - name: Mark the shard passed
      if: success() && matrix.shards > 1
      run: mkdir -p shard-ok && touch "shard-ok/${{ matrix.database }}-${{ matrix.shard }}"

    - name: Upload the mark
      if: success() && matrix.shards > 1
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: shard-ok-${{ matrix.database }}-${{ matrix.shard }}
        path: shard-ok/
        retention-days: 1

  # SQL Server's two shards under their one check name, their results published together
  test-sqlserver:
    name: test (SqlServer)
    needs: [changes, test]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUN: ${{ needs.changes.outputs.backend }}

    steps:
    - name: Download the shards' marks
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      continue-on-error: true
      with:
        pattern: shard-ok-SqlServer-*
        path: shard-ok
        merge-multiple: true

    - name: Download the shards' results
      if: env.RUN == 'true'
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      continue-on-error: true
      with:
        pattern: test-results-SqlServer-*
        path: TestResults
        merge-multiple: true

    - name: Publish Test Results
      if: env.RUN == 'true' && hashFiles('TestResults/*.trx') != ''
      uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
      with:
        name: .NET Test Results (SqlServer)
        path: TestResults/*.trx
        reporter: dotnet-trx
        fail-on-error: true
        use-actions-summary: 'false'

    - name: Both shards passed
      run: |
        passed=$(find shard-ok -type f 2>/dev/null | wc -l)
        if [ "$passed" != 2 ]; then
          echo "::error::$passed of SQL Server's 2 test shards passed: see the test (SqlServer, n/2) jobs"
          exit 1
        fi
