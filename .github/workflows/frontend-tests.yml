        SHEET_TEAM: ${{ steps.sheet_team.outputs.artifact-url }}
        SHEET_TEAM_HISTORY: ${{ steps.sheet_team_history.outputs.artifact-url }}
        SHEET_MATCH_DETAILS: ${{ steps.sheet_match_details.outputs.artifact-url }}
        SHEET_PLAYER_GRADES: ${{ steps.sheet_player_grades.outputs.artifact-url }}
        SHEET_LATE_LEAGUE: ${{ steps.sheet_late_league.outputs.artifact-url }}
        SHEET_LATE_LEAGUE_SEASON: ${{ steps.sheet_late_league_season.outputs.artifact-url }}
        SHEET_THEME_DIALOG: ${{ steps.sheet_theme_dialog.outputs.artifact-url }}
        SHEET_HISTORICAL_IMPORT: ${{ steps.sheet_historical_import.outputs.artifact-url }}
        SHEET_JOBS: ${{ steps.sheet_jobs.outputs.artifact-url }}
        SHEET_TELEMETRY: ${{ steps.sheet_telemetry.outputs.artifact-url }}
        SHEET_DATABASE_BACKUP: ${{ steps.sheet_database_backup.outputs.artifact-url }}
        SHEET_INFINITE_CLIENT: ${{ steps.sheet_infinite_client.outputs.artifact-url }}
        SHEET_EXCEL: ${{ steps.sheet_excel.outputs.artifact-url }}
        SHEET_RESCHEDULE_REQUEST: ${{ steps.sheet_reschedule_request.outputs.artifact-url }}
        SHEET_NOT_FOUND: ${{ steps.sheet_not_found.outputs.artifact-url }}
