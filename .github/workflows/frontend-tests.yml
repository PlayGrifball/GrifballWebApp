            commissioner-dashboard seasons leaderboards season-teams season-teams-archive draft-board team \
            team-history match-details player-grades late-league late-league-season theme-dialog historical-import \
            jobs telemetry database-backup infinite-client excel reschedule-request not-found toolbar-signed-in; do
          var="SHEET_$(echo "$page" | tr 'a-z-' 'A-Z_')"
          # A sheet that was not made (its test failed before its first screenshot) has no link
          if [ -n "${!var}" ]; then
            links="${links}[${page}](${!var}) · "
          fi
        done
        markdown="${links}[all, full size (zip)]($ALL)"
        echo "$markdown" >> "$GITHUB_STEP_SUMMARY"
        echo "markdown=$markdown" >> "$GITHUB_OUTPUT"

    - name: Every shard passed
      env:
        RESULT: ${{ needs.e2e-shard.result }}
      run: |
        if [ "$RESULT" != "success" ]; then
          echo "::error::An end-to-end shard did not pass ($RESULT): see the e2e (Playwright, n/3) jobs"
          exit 1
        fi

  # On a PR, one comment with the screenshots, which each run updates in place
  report:
    name: Screenshots comment
    needs: e2e
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # The comment
      pull-requests: write

    steps:
    - name: Comment on the PR
      env:
        GH_TOKEN: ${{ github.token }}
        PR: ${{ github.event.pull_request.number }}
        SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        SCREENSHOTS: ${{ needs.e2e.outputs.screenshots }}
      run: |
        marker='<!-- layout-screenshots -->'
        body="$marker
        ### Screenshots

        Each page on a desktop (1920x1080), laptop (1280x720), tablet in landscape (1024x768) and portrait (768x1024), and phone in landscape (820x300) and portrait (360x640), as of $SHA:
        ${SCREENSHOTS:-_No screenshots: see the e2e job._}

        Each page opens as one picture in the browser (signed in to GitHub). Kept for 30 days."
        # Only on PRs from this repo: a fork's PR gets a read-only token
        if [ -z "$PR" ] || [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
          echo "$body" >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi
        existing=$(gh api "repos/${{ github.repository }}/issues/$PR/comments" --paginate \
          --jq "[.[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\")))][0].id // empty" | head -n1)
        if [ -n "$existing" ]; then
          gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$existing" -f body="$body" > /dev/null
        else
          gh pr comment "$PR" -R "${{ github.repository }}" --body "$body"
        fi
