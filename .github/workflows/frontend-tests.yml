name: Frontend Tests

on:
  workflow_dispatch:
  pull_request:
    branches: [ "master" ]
  push:
    branches: [ "master" ]

# Each job asks for its own permissions: none here for a job to inherit.
permissions: {}

# A newer push to a PR replaces its run still going: only the latest commit's result matters. Every other run (a push
# to master) is its own group, so none waits for or replaces another.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '24.x'

jobs:
  # What the PR changed (.github/scripts/changed-areas.sh): a PR that leaves the client alone skips its unit tests,
  # and its end-to-end tests (they run the built client against e2e/mockApi.mts, never the .NET backend). Lighthouse
  # runs weekly and by hand instead: lighthouse.yml.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      frontend: ${{ steps.areas.outputs.frontend }}
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        sparse-checkout: .github/scripts
    - name: What changed
      id: areas
      env:
        GH_TOKEN: ${{ github.token }}
        PR: ${{ github.event.pull_request.number }}
      run: .github/scripts/changed-areas.sh

  # SonarCloud's JavaScript and TypeScript rules (eslint-plugin-sonarjs) over the client, as errors: what `npm run lint`
  # shows locally (eslint.config.mjs). Fails the PR on any finding.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    permissions:
      contents: read
    env:
      # Skipped step by step, so the check keeps its name and passes
      RUN: ${{ needs.changes.outputs.frontend }}

    defaults:
      run:
        working-directory: ./grifballwebapp.client

    steps:
    - name: Nothing to lint
      if: env.RUN != 'true'
      # Nothing is checked out: the job's default directory, the client's, isn't there
      working-directory: .
      run: "echo 'The PR changes nothing in the client: lint is skipped'"

    - name: Checkout code
      if: env.RUN == 'true'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Setup Node.js
      if: env.RUN == 'true'
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: grifballwebapp.client/package-lock.json

    # ESLint needs no package's install script
    - name: Install dependencies
      if: env.RUN == 'true'
      run: npm ci --ignore-scripts

    - name: Lint
      if: env.RUN == 'true'
      run: npm run lint

    # The client's API calls and models are generated from openapi.json (ng-openapi-gen.json), which the server's tests
    # hold equal to the document it serves: a file in src/generated that differs from what the generator makes fails here
    - name: Generated API client is up to date
      if: env.RUN == 'true'
      run: |
        npm run generate:api
        git add -N src/generated
        git diff --exit-code --stat -- src/generated || { echo '::error::src/generated differs from openapi.json: run npm run generate:api and commit the result'; exit 1; }

  # The production build, once: the end-to-end shards all test this one (each used to build its own)
  build:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # Skipped step by step, as the end-to-end shards are, so they don't skip as a whole (and keep their check names)
      RUN: ${{ needs.changes.outputs.frontend }}

    defaults:
      run:
        working-directory: ./grifballwebapp.client

    steps:
    - name: Nothing to build
      if: env.RUN != 'true'
      # Nothing is checked out: the job's default directory, the client's, isn't there
      working-directory: .
      run: "echo 'The PR changes nothing in the client: the build is skipped'"

    - name: Checkout code
      if: env.RUN == 'true'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Setup Node.js
      if: env.RUN == 'true'
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: grifballwebapp.client/package-lock.json

    - name: Install dependencies
      if: env.RUN == 'true'
      run: npm ci --ignore-scripts

    # build-manifest.json beside the built files, as the image has it (Dockerfile): e2e/build-manifest.spec.ts
    - name: Build
      if: env.RUN == 'true'
      run: npm run build && node build-manifest.mjs

    - name: Upload the build
      if: env.RUN == 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: client-build
        path: grifballwebapp.client/dist/
        retention-days: 1

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # dorny/test-reporter publishes the results as a check run (checks: write) and reads the run's artifacts (actions: read)
    permissions:
      contents: read
      actions: read
      checks: write
    needs: changes
    env:
      # Skipped step by step, so the check keeps its name and passes
      RUN: ${{ needs.changes.outputs.frontend }}
    
    defaults:
      run:
        working-directory: ./grifballwebapp.client
    
    steps:
    - name: Nothing to test
      if: env.RUN != 'true'
      # Nothing is checked out: the job's default directory, the client's, isn't there
      working-directory: .
      run: "echo 'The PR changes nothing in the client: its unit tests are skipped'"

    - name: Checkout code
      if: env.RUN == 'true'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
    - name: Setup Node.js
      if: env.RUN == 'true'
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: grifballwebapp.client/package-lock.json
        
    - name: Install dependencies
      if: env.RUN == 'true'
      run: npm ci --ignore-scripts
      
    - name: Run tests with coverage
      if: env.RUN == 'true'
      run: npm run test:ci
      
    - name: Upload Test Results
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always() && env.RUN == 'true'
      with:
        name: frontend-test-results
        path: grifballwebapp.client/test-results/

    - name: Upload Coverage
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always() && env.RUN == 'true'
      with:
        name: frontend-coverage
        path: grifballwebapp.client/coverage/
        
    - name: Publish Test Results
      uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
      if: always() && env.RUN == 'true'
      # The report only: the test step above already fails the job on a failing test. GitHub sometimes answers the
      # report's own update with 404 seconds after creating its check run, which would fail a job whose tests passed.
      continue-on-error: true
      with:
        name: Frontend Test Results
        path: grifballwebapp.client/test-results/*.xml
        reporter: java-junit
        fail-on-error: true
        use-actions-summary: 'false'
        
    - name: Upload Coverage to Codecov
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      if: always() && env.RUN == 'true'
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: grifballwebapp.client/coverage/lcov.info
        flags: frontend
        name: frontend-coverage
        fail_ci_if_error: false

  # The end-to-end tests, split between jobs side by side (Playwright's --shard; each job runs 4 workers).
  # Includes the layout test (e2e/layout.spec.ts): every key page at six screen sizes, screenshotted;
  # and the accessibility test (e2e/a11y.spec.ts): axe on every page and every dialog, menu and picker.
  e2e-shard:
    name: e2e (Playwright, ${{ matrix.shard }}/3)
    needs: [changes, build]
    runs-on: ubuntu-latest
    # Microsoft's Playwright image (https://playwright.dev/docs/docker): Chromium and its system libraries come
    # preinstalled, so no job installs them. Installing them from the runner's apt mirror took 5 to 11 minutes in about
    # one job in ten and ran jobs out of time. Its version must be @playwright/test's (package-lock.json), or Playwright
    # can't find its browser; Renovate updates both in the same PR. --user 1001 is the runner's user, so the workspace
    # stays writable; --ipc=host and --init as Playwright recommends (Chromium can run out of shared memory without).
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001 --ipc=host --init
    timeout-minutes: 25
    env:
      # Skipped step by step, so the check keeps its name and passes
      RUN: ${{ needs.changes.outputs.frontend }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    defaults:
      run:
        # In a container, steps run with sh unless told otherwise; the scripts here use bash (${!var} and the like)
        shell: bash
        working-directory: ./grifballwebapp.client

    steps:
    - name: Nothing to test
      if: env.RUN != 'true'
      # Nothing is checked out: the job's default directory, the client's, isn't there
      working-directory: .
      run: "echo 'The PR changes nothing in the client: its end-to-end tests are skipped'"

    - name: Checkout code
      if: env.RUN == 'true'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Setup Node.js
      if: env.RUN == 'true'
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: grifballwebapp.client/package-lock.json

    - name: Install dependencies
      if: env.RUN == 'true'
      run: npm ci --ignore-scripts

    - name: Download the build
      if: env.RUN == 'true'
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: client-build
        path: grifballwebapp.client/dist

    - name: Run this shard's end-to-end tests
      if: env.RUN == 'true'
      run: npx playwright test --shard=${{ matrix.shard }}/3

    # For the e2e job's contact sheets, even when a test failed (the pictures may show why)
    - name: Upload this shard's screenshots
      if: ${{ env.RUN == 'true' && !cancelled() && hashFiles('grifballwebapp.client/screenshots/*/*.png') != '' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: e2e-screenshots-${{ matrix.shard }}
        path: grifballwebapp.client/screenshots/
        retention-days: 1

    - name: Upload Playwright traces and report
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: env.RUN == 'true' && failure()
      with:
        name: playwright-traces-${{ matrix.shard }}
        path: |
          grifballwebapp.client/e2e-results/
          grifballwebapp.client/playwright-report/
        retention-days: 7

  # The shards' result under the one check name, and their screenshots as contact sheets
  e2e:
    name: e2e (Playwright)
    needs: [changes, e2e-shard]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # Microsoft's Playwright image (https://playwright.dev/docs/docker): Chromium and its system libraries come
    # preinstalled, so no job installs them. Installing them from the runner's apt mirror took 5 to 11 minutes in about
    # one job in ten and ran jobs out of time. Its version must be @playwright/test's (package-lock.json), or Playwright
    # can't find its browser; Renovate updates both in the same PR. --user 1001 is the runner's user, so the workspace
    # stays writable; --ipc=host and --init as Playwright recommends (Chromium can run out of shared memory without).
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001 --ipc=host --init
    timeout-minutes: 10
    env:
      RUN: ${{ needs.changes.outputs.frontend }}
    permissions:
      contents: read
    outputs:
      # Markdown links to the screenshot contact sheets, for the report job
      screenshots: ${{ steps.links.outputs.markdown }}

    defaults:
      run:
        # In a container, steps run with sh unless told otherwise; the scripts here use bash (${!var} and the like)
        shell: bash
        working-directory: ./grifballwebapp.client

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Setup Node.js
      if: env.RUN == 'true'
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: grifballwebapp.client/package-lock.json

    - name: Install dependencies
      if: env.RUN == 'true'
      run: npm ci --ignore-scripts

    - name: Download the shards' screenshots
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      continue-on-error: true
      with:
        pattern: e2e-screenshots-*
        path: grifballwebapp.client/screenshots
        merge-multiple: true

    # One picture per page with all its screen sizes. Even when a test failed, since the pictures
    # may show why.
    - name: Make the screenshot contact sheets
      id: sheets
      if: ${{ !cancelled() && hashFiles('grifballwebapp.client/screenshots/*/*.png') != '' }}
      run: node e2e/contact-sheets.mjs

    # Unzipped, so each opens straight in the browser. One file per upload is the limit for that.
    - name: Upload the home screenshots
      id: sheet_home
      if: ${{ !cancelled() && steps.sheets.outcome == 'success' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        path: grifballwebapp.client/screenshots/home.png
        archive: false
        retention-days: 30

    - name: Upload the home-signed-out screenshots
      id: sheet_home_signed_out
      if: ${{ !cancelled() && steps.sheets.outcome == 'success' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
