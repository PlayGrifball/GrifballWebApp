name: Lighthouse

# Lighthouse over every page of the client, on a schedule and by hand rather than on every pull request: some 70
# runner-minutes a run. Pull requests still get the end-to-end accessibility checks (e2e/a11y.spec.ts) from
# frontend-tests.yml. To measure a branch before merging: gh workflow run lighthouse.yml --ref <branch>.
on:
  workflow_dispatch:
  # Weekly, on master
  schedule:
    - cron: '40 10 * * 0'

# Each job asks for its own permissions: none here for a job to inherit.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24.x'
  # Lighthouse CI, run with npx (see the lighthouse job). Not LHCI_*: lhci reads those as options.
  LIGHTHOUSE_CI_VERSION: '0.15.1'

jobs:
  # The production build, once: every Lighthouse job measures this one
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    defaults:
      run:
        working-directory: ./grifballwebapp.client

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: grifballwebapp.client/package-lock.json

    - name: Install dependencies
      run: npm ci --ignore-scripts

    # build-manifest.json beside the built files, as the image has it (Dockerfile): e2e/build-manifest.spec.ts
    - name: Build
      run: npm run build && node build-manifest.mjs

    - name: Upload the build
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: client-build
        path: grifballwebapp.client/dist/
        retention-days: 1

  # Lighthouse on the production build, run by its own server (pages rendered on the server) with the
  # mocked API (e2e/mockApi.mts, e2e/serve.mjs), with the mobile and the desktop settings: as a
  # visitor who is not logged in, and, side by side, signed in as a commissioner and admin (their
  # pages too; see lighthouserc.cjs). Every page, the 404 page too: accessibility, best practices and
  # SEO must score 100, performance 98 on desktop and 80 on mobile.
  # Every page of the site is too many for one job (some 45 seconds each), so each session's pages
  # are split between jobs (LIGHTHOUSE_SHARD), side by side.
  lighthouse:
    name: ${{ format('Lighthouse ({0}{1}/{2})', matrix.session == 'signed-in' && 'signed in, ' || '', matrix.shard, matrix.shards) }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Some 7 pages a signed-out job, some 9 a signed-in one (lighthouserc.cjs)
          - { session: signed-out, shard: 1, shards: 4 }
          - { session: signed-out, shard: 2, shards: 4 }
          - { session: signed-out, shard: 3, shards: 4 }
          - { session: signed-out, shard: 4, shards: 4 }
          - { session: signed-in, shard: 1, shards: 5 }
          - { session: signed-in, shard: 2, shards: 5 }
          - { session: signed-in, shard: 3, shards: 5 }
          - { session: signed-in, shard: 4, shards: 5 }
          - { session: signed-in, shard: 5, shards: 5 }
    env:
      LIGHTHOUSE_SHARD: ${{ matrix.shard }}/${{ matrix.shards }}

    defaults:
      run:
        working-directory: ./grifballwebapp.client

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: grifballwebapp.client/package-lock.json

    - name: Install dependencies
      run: npm ci --ignore-scripts

    - name: Download the build
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: client-build
        path: grifballwebapp.client/dist

    # Else the signed-in scores would be a visitor's: the server must render every page for the user
    - name: Check the pages render signed in
      if: matrix.session == 'signed-in'
      run: node e2e/lighthouse-signed-in.mjs

    # Configured in lighthouserc.cjs. The reports go to Lighthouse's temporary public storage
    # (kept for a few days), linked from the scores.
    - name: Run Lighthouse
      env:
        LIGHTHOUSE_SESSION: ${{ matrix.session }}
      run: |
        lhci="npx --yes @lhci/cli@${{ env.LIGHTHOUSE_CI_VERSION }}"
        session="${LIGHTHOUSE_SESSION/-/ }"
        failed=0
        : > lighthouse.md
        for preset in mobile desktop; do
          LIGHTHOUSE_PRESET=$preset $lhci collect
          # The 404 page in a run of its own, added to the others (lighthouserc.cjs: notFoundAudits)
          if node -e "process.exit(require('./lighthouserc.cjs').hasNotFoundPage ? 0 : 1)"; then
            LIGHTHOUSE_PRESET=$preset LIGHTHOUSE_NOT_FOUND=1 $lhci collect --additive
          fi
          $lhci upload || echo "::warning::The $preset reports could not be uploaded"
          # The table to the file; the warnings (stderr) to the log, where GitHub picks them up
          { node e2e/lighthouse-summary.mjs "${preset^}" >> lighthouse.md; } 2>&1
          LIGHTHOUSE_PRESET=$preset $lhci assert || failed=1
          mv .lighthouseci "lighthouse-$LIGHTHOUSE_SESSION-$preset"
        done
        { echo "### Lighthouse, ${session} (pages ${LIGHTHOUSE_SHARD})"; echo; cat lighthouse.md; } >> "$GITHUB_STEP_SUMMARY"
        exit $failed

    # The tables, for the summary job
    - name: Upload the Lighthouse scores
      if: ${{ !cancelled() && hashFiles('grifballwebapp.client/lighthouse.md') != '' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: lighthouse-scores-${{ matrix.session }}-${{ matrix.shard }}
        path: grifballwebapp.client/lighthouse.md
        retention-days: 1

    - name: Upload the Lighthouse reports
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: ${{ !cancelled() }}
      with:
        name: lighthouse-${{ matrix.session }}-${{ matrix.shard }}
        path: grifballwebapp.client/lighthouse-*/
        retention-days: 30

  # The shards' tables merged into one per session and preset, on the run's summary page and, for a run on a PR's
  # branch, in a comment on the PR (its own, updated in place by later runs)
  summary:
    name: Lighthouse summary
    needs: lighthouse
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # The comment
      pull-requests: write

    steps:
    # For e2e/lighthouse-merge.mjs
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        sparse-checkout: grifballwebapp.client/e2e
        sparse-checkout-cone-mode: false

    # One table per job (none when a job did not get that far)
    - name: Download the Lighthouse scores
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      continue-on-error: true
      with:
        pattern: lighthouse-scores-*
        path: lighthouse

    - name: Summary
      run: |
        for session in signed-out signed-in; do
          files=$(ls lighthouse/lighthouse-scores-$session-*/lighthouse.md 2>/dev/null || true)
          [ -n "$files" ] || continue
          label="${session/-/ }"
          echo "### ${label^}"
          echo
          # shellcheck disable=SC2086 # one path per shard job, without spaces
          node grifballwebapp.client/e2e/lighthouse-merge.mjs $files
          echo
        done > scores.md
        cat scores.md >> "$GITHUB_STEP_SUMMARY"

    # A run started by hand knows its branch, not its PR: the open PR from that branch, if there is one
    - name: Comment on the PR
      if: github.ref != 'refs/heads/master'
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        BRANCH: ${{ github.ref_name }}
        SHA: ${{ github.sha }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        set -euo pipefail
        pr=$(gh pr list -R "$REPO" --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
        [ -n "$pr" ] || { echo "No open PR from $BRANCH: no comment"; exit 0; }
        marker='<!-- lighthouse-scores -->'
        body="$marker
        ### Lighthouse

        As of $SHA ([the run]($RUN_URL)):

        $(cat scores.md 2>/dev/null || true)"
        [ -s scores.md ] || body="$body
        _No scores: see the Lighthouse jobs._"
        existing=$(gh api "repos/$REPO/issues/$pr/comments" --paginate \
          --jq "[.[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\")))][0].id // empty" | head -n1)
        if [ -n "$existing" ]; then
          gh api -X PATCH "repos/$REPO/issues/comments/$existing" -f body="$body" > /dev/null
        else
          gh pr comment "$pr" -R "$REPO" --body "$body"
        fi
