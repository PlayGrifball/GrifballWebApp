name: PostgreSQL periods image

# PostgreSQL with the periods extension (docker/postgres-periods), which the Helm chart runs for row
# history (database.history.enabled, postgres.historyImage). Pull requests: built for both platforms
# and the amd64 image tried (the extension created, a table versioned, a change kept). master: then
# pushed to ghcr.io/playgrifball/postgres-periods as :18-alpine (the chart's default) and :sha-<commit>,
# and signed keyless with cosign, as docker-publish.yml signs the app's images. Only when the image's
# files change: it doesn't follow the app's releases.
on:
  push:
    branches: [ "master" ]
    paths: [ "docker/postgres-periods/**", ".github/workflows/postgres-periods.yml" ]
  pull_request:
    branches: [ "master" ]
    paths: [ "docker/postgres-periods/**", ".github/workflows/postgres-periods.yml" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Lowercase: image references are.
  IMAGE_NAME: playgrifball/postgres-periods

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Keyless signing outside pull requests.
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@59acb6260d9c0ba8f4a2f9d9b48431a222b68e20 #v3.5.0
        with:
          cosign-release: 'v2.2.4'

      # Emulation for the arm64 build, which compiles the extension (a few seconds natively).
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226 # v3.0.0

      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d # v3.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@96383f45573cb7f253c731d3b3ab81c87ef81934 # v5.0.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # :18-alpine follows the Dockerfile's PostgreSQL major (its base image's tag).
          tags: |
            type=raw,value=18-alpine
            type=sha

      - name: Build the amd64 image to try it
        uses: docker/build-push-action@0565240e2d4ab88bba5387d719585280857ece09 # v5.0.0
        with:
          context: docker/postgres-periods
          platforms: linux/amd64
          load: true
          push: false
          tags: postgres-periods:try
          cache-from: type=gha,scope=postgres-periods
          cache-to: type=gha,scope=postgres-periods,mode=max

      - name: Try it
        run: |
          set -euo pipefail
          # As the chart runs it: uid 70, read-only root.
          docker run -d --name pg --user 70 --read-only --tmpfs /var/lib/postgresql --tmpfs /var/run/postgresql \
            --tmpfs /tmp -e POSTGRES_PASSWORD=try postgres-periods:try
          for _ in $(seq 60); do docker exec pg pg_isready -q -h 127.0.0.1 && break; sleep 1; done
          docker exec -i pg psql -X -q -v ON_ERROR_STOP=1 -U postgres <<'SQL'
          CREATE EXTENSION periods CASCADE;
          CREATE TABLE t (id int PRIMARY KEY, v text);
          SELECT periods.add_system_time_period('t', 'PeriodStart', 'PeriodEnd');
          SELECT periods.add_system_versioning('t');
          INSERT INTO t VALUES (1, 'old');
          UPDATE t SET v = 'new';
          DO $$ BEGIN
            IF (SELECT count(*) FROM t_history WHERE v = 'old') <> 1 THEN RAISE EXCEPTION 'No history row'; END IF;
          END $$;
          \echo The old row is in t_history.
          SQL
          docker rm -f pg

      - name: Build and push
        id: build-and-push
        uses: docker/build-push-action@0565240e2d4ab88bba5387d719585280857ece09 # v5.0.0
        with:
          context: docker/postgres-periods
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=postgres-periods
          cache-to: type=gha,scope=postgres-periods,mode=max

      - name: Sign the published image
        if: ${{ github.event_name != 'pull_request' }}
        env:
          # https://docs.github.com/en/actions/security-guides/security-hardening-for-github-actions#using-an-intermediate-environment-variable
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: echo "${TAGS}" | xargs -I {} cosign sign --yes {}@${DIGEST}
