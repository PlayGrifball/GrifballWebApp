name: SonarCloud

on:
  workflow_dispatch:
  pull_request:
    branches: [ "master" ]
  push:
    branches: [ "master" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
  # dotnet-sonarscanner, a NuGet tool
  SONAR_SCANNER_VERSION: '12.1.0'
  # SonarCloud > project > Information
  SONAR_ORGANIZATION: playgrifball
  SONAR_PROJECT_KEY: PlayGrifball_GrifballWebApp

jobs:
  # The client's unit tests with coverage, for the analysis below: here rather than taken from frontend-tests.yml, which
  # skips them on a PR that leaves the client alone, while every PR is analysed (and new code's coverage includes the
  # client). The analysis waits for it. frontend-tests.yml is what gates on the test results.
  client-coverage:
    name: Client coverage
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./grifballwebapp.client
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '24.x'
        cache: 'npm'
        cache-dependency-path: grifballwebapp.client/package-lock.json

    - name: Install dependencies
      run: npm ci --ignore-scripts

    # As the .NET tests below: coverage even when a test fails (frontend-tests.yml fails the PR for it)
    - name: Run tests with coverage
      continue-on-error: true
      run: npm run test:ci

    # Karma writes each file's path from the client's folder (SF:src/app/...); Sonar reads them from the repo's root
    - name: Paths from the repo root
      run: sed -i 's#^SF:src/#SF:grifballwebapp.client/src/#' coverage/lcov.info

    - name: Upload coverage
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: sonar-client-lcov
        path: grifballwebapp.client/coverage/lcov.info
        if-no-files-found: error
        retention-days: 1

  analysis:
    name: Analysis
    # Runs even when the client job fails (an npm blip, no lcov): the C# analysis doesn't hang on the client's coverage
    needs: client-coverage
    # A fork PR gets no SONAR_TOKEN
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # Full history: Sonar uses blame to tell new code from old
        fetch-depth: 0
        persist-credentials: false

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Cache NuGet packages
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
        restore-keys: nuget-${{ runner.os }}-

    - name: Cache Sonar analyzers
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.sonar/cache
        key: sonar-${{ runner.os }}-${{ env.SONAR_SCANNER_VERSION }}
        restore-keys: sonar-${{ runner.os }}-

    # Missing when the client job failed: the analysis goes on, with no client coverage
    - name: Download client coverage
      continue-on-error: true
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: sonar-client-lcov
        path: client-coverage

    - name: Install scanner
      run: dotnet tool install --global dotnet-sonarscanner --version "$SONAR_SCANNER_VERSION"

    # The client isn't an MSBuild project here; scanAll picks up its TypeScript anyway, and its coverage is the
    # client-coverage job's (Karma's lcov, its paths from the repo root). Karma covers src/app (every file in it, through
    # generate-coverage-imports.js), so the client's coverage leaves out the rest: the specs, the end-to-end and smoke
    # tests, the build and test configuration, and the browser and server entry points in src.
    # Ignored: docker:S6471 (runs as root) for the client's image alone. Its server listens on port 80, as nginx
    # did, which takes root (grifballwebapp.client/Dockerfile); the chart runs it with no privilege escalation and
    # a read-only root filesystem. Moving it to a port above 1024 takes the chart and the image together.
    # No coverage for .github/scripts: CI's own scripts, tested by .github/scripts/tests/run.sh, which reports none.
    # Not analysed: the migrations EF writes. DiscordInterfaces/DiscordInteractionContextGen.cs, which DiscordInterfaceSourceGen
    # writes, is: an issue in it is fixed in the generator, and the file regenerated.
    - name: Begin analysis
      run: >
        dotnet sonarscanner begin
        /k:"$SONAR_PROJECT_KEY"
        /o:"$SONAR_ORGANIZATION"
        /d:sonar.token="$SONAR_TOKEN"
        /d:sonar.host.url=https://sonarcloud.io
        /d:sonar.scanner.scanAll=true
        /d:sonar.exclusions="**/GrifballWebApp.Migrations.*/Migrations/**,client-coverage/**"
        /d:sonar.coverage.exclusions="**/DiscordInterfaces/**,**/DiscordInterfaceSourceGen/**,.github/scripts/**,grifballwebapp.client/*,grifballwebapp.client/src/*,grifballwebapp.client/e2e/**,grifballwebapp.client/smoke/**,grifballwebapp.client/**/*.spec.ts"
        /d:sonar.cs.opencover.reportsPaths="TestResults/**/coverage.opencover.xml"
        /d:sonar.javascript.lcov.reportPaths=client-coverage/lcov.info
        /d:sonar.issue.ignore.multicriteria=clientroot
        /d:sonar.issue.ignore.multicriteria.clientroot.ruleKey=docker:S6471
        /d:sonar.issue.ignore.multicriteria.clientroot.resourceKey=grifballwebapp.client/Dockerfile

    # As in dotnet-tests.yml: the integration test project builds every backend project (the unit test projects
    # included, for their helpers), and DOCKER_BUILD leaves out the client. The architecture tests, the Convert app's
    # unit tests and the analyzers' tests, which no other project references, build on their own.
    - name: Build
      run: |
        dotnet build GrifballWebApp.Integration.Test/GrifballWebApp.Integration.Test.csproj --configuration Release /p:DefineConstants=DOCKER_BUILD
        dotnet build GrifballWebApp.Architecture.Test/GrifballWebApp.Architecture.Test.csproj --configuration Release /p:DefineConstants=DOCKER_BUILD
        dotnet build GrifballWebApp.Convert.Test/GrifballWebApp.Convert.Test.csproj --configuration Release /p:DefineConstants=DOCKER_BUILD
        dotnet build GrifballWebApp.Analyzers.Test/GrifballWebApp.Analyzers.Test.csproj --configuration Release /p:DefineConstants=DOCKER_BUILD

    # Coverage for the quality gate from every test project. dotnet-tests.yml is what gates on test results.
    # The unit tests (one project per layer and per host app) and the architecture tests: each runs (and reports its coverage), a failing one included
    - name: Test (Unit)
      continue-on-error: true
      run: |
        status=0
        for project in GrifballWebApp.Domain.Test GrifballWebApp.Application.Test GrifballWebApp.Infrastructure.Test GrifballWebApp.Server.Test GrifballWebApp.Seeder.Test GrifballWebApp.Convert.Test GrifballWebApp.Analyzers.Test GrifballWebApp.Architecture.Test; do
          dotnet test "$project/$project.csproj" \
          --no-build \
          --configuration Release \
          --results-directory TestResults/ \
          --collect:"XPlat Code Coverage" \
          --settings coverlet.runsettings \
          -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover || status=1
        done
        exit $status

    # The integration tests on SQLite only (no container)
    - name: Test (Integration)
      continue-on-error: true
      env:
        GRIF_TEST_DATABASE: Sqlite
      run: |
        dotnet test GrifballWebApp.Integration.Test/GrifballWebApp.Integration.Test.csproj \
        --no-build \
        --configuration Release \
        --results-directory TestResults/ \
        --collect:"XPlat Code Coverage" \
        --settings coverlet.runsettings \
        -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

    - name: End analysis
      run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

    # The quality gate is SonarCloud's; this holds a PR to zero issues and hotspots without it. SonarCloud analyses the
    # upload in a background task: the script waits for it, then fails on any open issue, any hotspot to review, or a
    # new_violations above 0, one annotation each.
    - name: No SonarCloud issues
      if: github.event_name == 'pull_request'
      env:
        PR: ${{ github.event.pull_request.number }}
      run: .github/scripts/sonar-pr-issues.sh

  # SonarCloud's JavaScript and TypeScript rules (eslint-plugin-sonarjs) over the client, as warnings: what
  # `npm run lint` shows locally. The analysis above is what fails a PR.
  client-lint:
    name: Client lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./grifballwebapp.client
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '24.x'
        cache: 'npm'
        cache-dependency-path: grifballwebapp.client/package-lock.json

    # ESLint needs no package's install script
    - name: Install dependencies
      run: npm ci --ignore-scripts

    - name: Lint
      run: npm run lint
