name: Docker

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

on:
  #schedule:
  #  - cron: '40 3 * * *'
  push:
    branches: [ "master" ]
    # Publish semver tags as releases.
    #tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ "master" ]
    # labeled: adding the preview label publishes the PR's images straight away, without waiting for a push.
    types: [ opened, synchronize, reopened, labeled ]
  workflow_dispatch:

env:
  # Use docker.io for Docker Hub if empty
  REGISTRY: ghcr.io
  # github.repository as <account>/<repo>
  #IMAGE_NAME: ${{ github.repository }}
  IMAGE_NAME_FRONTEND: PlayGrifball/grifballwebappclient
  IMAGE_NAME_BACKEND: PlayGrifball/grifballwebappserver

# Images are signed and released only from master (a push to it, or a run started by hand on it):
# github.ref is refs/heads/master for nothing else. They're pushed from master and for preview PRs
# (PUBLISH, below); other pull requests, and runs started by hand on another branch, build without
# logging in or pushing.
jobs:
  build-frontend:
    # Other labels don't change the build, so don't rebuild for them.
    if: ${{ github.event.action != 'labeled' || github.event.label.name == 'preview' }}
    runs-on: ubuntu-latest
    env:
      # PR preview environments (https://grif-preview<slot>.grifball.xyz): a PR from a branch of this repo with the preview label
      # pushes its images as sha-<first 7 of the PR head commit> and pr-<N>. Fork PRs, and PRs without the label, only
      # build: no login, no push. preview-cleanup.yml deletes a PR's images when it closes or loses the label.
      PUBLISH: ${{ github.ref == 'refs/heads/master' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'preview')) }}
      # On pull_request, tag sha- with the PR head commit rather than GitHub's merge commit.
      DOCKER_METADATA_PR_HEAD_SHA: true
      # What is pushed: both architectures from master; amd64 only for a preview, which runs on the homelab's amd64 nodes
      # (k1-k3; k0, the arm64 one, is tainted for the control plane), so its images are ready in about a third of the time.
      PLATFORMS: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    permissions:
      contents: read
      packages: write
      pull-requests: read  # re-check the preview label before pushing
      # This is used to complete the identity challenge
      # with sigstore/fulcio when running outside of PRs.
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          # PRs build their head commit, matching the sha- tag. Empty means the default (the pushed commit).
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || '' }}

      # Install the cosign tool, only from master
      # https://github.com/sigstore/cosign-installer
      - name: Install cosign
        if: github.ref == 'refs/heads/master'
        uses: sigstore/cosign-installer@59acb6260d9c0ba8f4a2f9d9b48431a222b68e20 # v3.5.0
        with:
          cosign-release: 'v2.2.4'

      # Emulation for the arm64 image's few RUN steps (apk add); the .NET and Node builds run natively
      # and target arm64 (see the Dockerfiles). Skipped on PRs where only amd64 is built.
      - name: Set up QEMU
        if: github.event_name != 'pull_request'
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      # Set up BuildKit Docker container builder to be able to build
      # multi-platform images and export cache
      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226 # v3.0.0

      # Login against a Docker registry: from master, and for preview PRs (PUBLISH)
      # https://github.com/docker/login-action
      - name: Log into registry ${{ env.REGISTRY }}
        if: env.PUBLISH == 'true'
        uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d # v3.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract metadata (tags, labels) for Docker
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata for frontend
        id: meta
        uses: docker/metadata-action@96383f45573cb7f253c731d3b3ab81c87ef81934 # v5.0.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}
          # Only the immutable sha- tag here (plus pr-<N> on preview PRs). :latest moves in the release job, once every image
          # in this run has built and pushed - never a partial set.
          tags: |
            type=sha
            type=ref,event=pr

      # Build frontend without pushing first to populate builder cache and allow preview-label.yml to complete
      - name: Build Docker image for frontend
        uses: docker/build-push-action@0565240e2d4ab88bba5387d719585280857ece09 # v5.0.0
        with:
          context: grifballwebapp.client
          platforms: ${{ env.PLATFORMS }}
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=min,scope=frontend

      # preview-label.yml may have removed the label since this run started (over the cap), and a label removed by
      # GITHUB_TOKEN doesn't trigger preview-cleanup.yml. Check after building and just before pushing.
      - name: Check the preview label is still on the PR
        id: still-labelled
        if: env.PUBLISH == 'true' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if gh api "repos/$REPO/pulls/$PR" --jq '.labels[].name' | grep -qx preview; then
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::The preview label was removed from #$PR during this run; building without pushing"
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi

      # Push frontend image (re-uses local builder cache from build step above)
      - name: Push Docker image for frontend
        id: push
        if: env.PUBLISH == 'true' && steps.still-labelled.outputs.push != 'false'
        uses: docker/build-push-action@0565240e2d4ab88bba5387d719585280857ece09 # v5.0.0
        with:
          context: grifballwebapp.client
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=frontend

      # Sign the resulting Docker image digest, only from master.
      # This will only write to the public Rekor transparency log when the Docker
      # repository is public to avoid leaking data.
      # https://github.com/sigstore/cosign
      - name: Sign the published Docker image for frontend
        if: ${{ github.ref == 'refs/heads/master' }}
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: echo "${TAGS}" | xargs -I {} cosign sign --yes {}@${DIGEST}

  build-backend:
    # Other labels don't change the build, so don't rebuild for them.
    if: ${{ github.event.action != 'labeled' || github.event.label.name == 'preview' }}
    runs-on: ubuntu-latest
    env:
      # PR preview environments (https://grif-preview<slot>.grifball.xyz): a PR from a branch of this repo with the preview label
      # pushes its images as sha-<first 7 of the PR head commit> and pr-<N>. Fork PRs, and PRs without the label, only
      # build: no login, no push. preview-cleanup.yml deletes a PR's images when it closes or loses the label.
      PUBLISH: ${{ github.ref == 'refs/heads/master' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'preview')) }}
      # On pull_request, tag sha- with the PR head commit rather than GitHub's merge commit.
      DOCKER_METADATA_PR_HEAD_SHA: true
      # What is pushed: both architectures from master; amd64 only for a preview, which runs on the homelab's amd64 nodes
      # (k1-k3; k0, the arm64 one, is tainted for the control plane), so its images are ready in about a third of the time.
      PLATFORMS: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    permissions:
      contents: read
      packages: write
      pull-requests: read  # re-check the preview label before pushing
      # This is used to complete the identity challenge
      # with sigstore/fulcio when running outside of PRs.
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          # PRs build their head commit, matching the sha- tag. Empty means the default (the pushed commit).
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || '' }}

      # Install the cosign tool, only from master
      # https://github.com/sigstore/cosign-installer
      - name: Install cosign
        if: github.ref == 'refs/heads/master'
        uses: sigstore/cosign-installer@59acb6260d9c0ba8f4a2f9d9b48431a222b68e20 # v3.5.0
        with:
          cosign-release: 'v2.2.4'

      # Emulation for the arm64 image's few RUN steps (apk add); the .NET and Node builds run natively
      # and target arm64 (see the Dockerfiles). Skipped on PRs where only amd64 is built.
      - name: Set up QEMU
        if: github.event_name != 'pull_request'
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      # Set up BuildKit Docker container builder to be able to build
      # multi-platform images and export cache
      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226 # v3.0.0

      # Login against a Docker registry: from master, and for preview PRs (PUBLISH)
      # https://github.com/docker/login-action
      - name: Log into registry ${{ env.REGISTRY }}
        if: env.PUBLISH == 'true'
        uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d # v3.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract metadata (tags, labels) for Docker
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata for backend
        id: meta
        uses: docker/metadata-action@96383f45573cb7f253c731d3b3ab81c87ef81934 # v5.0.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}
          # Only the immutable sha- tag here (plus pr-<N> on preview PRs). :latest moves in the release job, once every image
          # in this run has built and pushed - never a partial set.
          tags: |
            type=sha
            type=ref,event=pr

      # Build backend without pushing first to populate builder cache and allow preview-label.yml to complete
      - name: Build Docker image for backend
        uses: docker/build-push-action@0565240e2d4ab88bba5387d719585280857ece09 # v5.0.0
        with:
          context: .
          file: GrifballWebApp.Server/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=min,scope=backend

      # preview-label.yml may have removed the label since this run started (over the cap), and a label removed by
      # GITHUB_TOKEN doesn't trigger preview-cleanup.yml. Check after building and just before pushing.
      - name: Check the preview label is still on the PR
        id: still-labelled
        if: env.PUBLISH == 'true' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if gh api "repos/$REPO/pulls/$PR" --jq '.labels[].name' | grep -qx preview; then
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::The preview label was removed from #$PR during this run; building without pushing"
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi

      # Push backend image (re-uses local builder cache from build step above)
      - name: Push Docker image for backend
        id: push
        if: env.PUBLISH == 'true' && steps.still-labelled.outputs.push != 'false'
        uses: docker/build-push-action@0565240e2d4ab88bba5387d719585280857ece09 # v5.0.0
        with:
          context: .
          file: GrifballWebApp.Server/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=backend

      # Sign the resulting Docker image digest, only from master.
      # This will only write to the public Rekor transparency log when the Docker
      # repository is public to avoid leaking data.
      # https://github.com/sigstore/cosign
      - name: Sign the published Docker image for backend
        if: ${{ github.ref == 'refs/heads/master' }}
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: echo "${TAGS}" | xargs -I {} cosign sign --yes {}@${DIGEST}

      # Master builds both amd64 and arm64; verify the arm64 backend image with a smoke test before release.
      # Skipped on pull requests to keep preview and check runs fast.
      - name: Build the arm64 backend image to run it
        if: github.ref == 'refs/heads/master'
        uses: docker/build-push-action@0565240e2d4ab88bba5387d719585280857ece09 # v5.0.0
        with:
          context: .
          file: GrifballWebApp.Server/Dockerfile
          platforms: linux/arm64
          load: true
          push: false
          tags: backend-arm64
          cache-from: type=gha,scope=backend

      - name: Smoke-test the arm64 backend image
        if: github.ref == 'refs/heads/master'
        run: |
          set -euo pipefail
          docker run --rm --platform linux/arm64 --entrypoint sh backend-arm64 -c \
            'set -e; uname -m; dotnet --list-runtimes; sqlcmd --version; /app/efbundle --help | head -n 3'

  # Moves :test and :latest to this run's images, all or nothing: it runs only after every build
  # above succeeded, so a failed build leaves them on the previous complete set. The homelab's
  # ArgoCD Image Updater follows :test (and :staging, :prod) by digest. Retagging is metadata only
  # (no rebuild, no re-upload), and backend goes first: it carries the migrations bundle, and the backend/frontend pair only
  # has to stay API-compatible for the seconds between the two.
  release:
    needs: [build-frontend, build-backend]
    if: ${{ !failure() && !cancelled() && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226 # v3.0.0

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d # v3.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Point test and latest at this run's images
        env:
          BACKEND: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}
          FRONTEND: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}
          BACKEND_DIGEST: ${{ needs.build-backend.outputs.digest }}
          FRONTEND_DIGEST: ${{ needs.build-frontend.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "$BACKEND_DIGEST" && test -n "$FRONTEND_DIGEST"
          # Image references are lowercase; IMAGE_NAME_* keep the org's capitalisation.
          BACKEND="${BACKEND,,}"; FRONTEND="${FRONTEND,,}"
          # :test is what the homelab's grif-test deploys; :latest is kept for anyone else following
          # the newest build. Staging and prod move only through the Promote workflows.
          for tag in test latest; do
            docker buildx imagetools create -t "$BACKEND:$tag" "$BACKEND@$BACKEND_DIGEST"
            docker buildx imagetools create -t "$FRONTEND:$tag" "$FRONTEND@$FRONTEND_DIGEST"
          done

  # A preview's images are pushed: tell the homelab's Argo CD to look at this PR now rather than at its next poll, so the
  # preview deploys (or moves to this commit) straight away. The ApplicationSet controller's webhook takes a GitHub-style
  # pull_request event and refreshes the pull request generators for this repo - nothing else; it reads the PR itself
  # from GitHub. It is only reachable inside the cluster, so this runs on the org's in-cluster runners (grif-k8s), which
  # have no Kubernetes token and need none. Best effort: a failure here only means waiting for the poll (30 s).
  refresh-preview:
    needs: [build-frontend, build-backend]
    if: ${{ !failure() && !cancelled() && github.event_name == 'pull_request' && needs.build-frontend.outputs.digest != '' && needs.build-backend.outputs.digest != '' }}
    runs-on: grif-k8s
    permissions: {}
    timeout-minutes: 2
    continue-on-error: true
    steps:
      - name: Refresh the homelab's preview ApplicationSet
        env:
          OWNER: ${{ github.repository_owner }}
          NAME: ${{ github.event.repository.name }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          payload=$(printf '{"action":"synchronize","number":%s,"repository":{"name":"%s","owner":{"login":"%s"},"url":"https://api.github.com/repos/%s/%s"}}' \
            "$PR" "$NAME" "$OWNER" "$OWNER" "$NAME")
          curl -fsS --max-time 20 -X POST \
            -H 'Content-Type: application/json' -H 'X-GitHub-Event: pull_request' \
            --data "$payload" http://argocd-applicationset-controller.argocd.svc.cluster.local:7000/api/webhook
          echo "Asked Argo CD to refresh the previews for #$PR"
