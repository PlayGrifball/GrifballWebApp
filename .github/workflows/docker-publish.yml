name: Docker

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

on:
  #schedule:
  #  - cron: '40 3 * * *'
  push:
    branches: [ "master" ]
    # Publish semver tags as releases.
    #tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ "master" ]
    # labeled: adding the preview label publishes the PR's images straight away, without waiting for a push.
    types: [ opened, synchronize, reopened, labeled ]
  workflow_dispatch:

env:
  # Use docker.io for Docker Hub if empty
  REGISTRY: ghcr.io
  # github.repository as <account>/<repo>
  #IMAGE_NAME: ${{ github.repository }}
  IMAGE_NAME_FRONTEND: PlayGrifball/grifballwebappclient
  IMAGE_NAME_BACKEND: PlayGrifball/grifballwebappserver
  # PR preview environments (https://grif-preview<slot>.grifball.xyz): a PR from a branch of this repo with the preview label
  # pushes its images as sha-<first 7 of the PR head commit> and pr-<N>. Fork PRs, and PRs without the label, only
  # build: no login, no push. preview-cleanup.yml deletes a PR's images when it closes or loses the label.
  PUBLISH: ${{ github.ref == 'refs/heads/master' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'preview')) }}
  # On pull_request, tag sha- with the PR head commit rather than GitHub's merge commit.
  DOCKER_METADATA_PR_HEAD_SHA: true
  # What is pushed: both architectures from master; amd64 only for a preview, which runs on the homelab's amd64 nodes
  # (k1-k3; k0, the arm64 one, is tainted for the control plane), so its images are ready in about a third of the time.
  PLATFORMS: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
  # The BuildKit that builds the images. Part of what makes a build reproducible: docs/reproducible-builds.md
  BUILDKIT: image=moby/buildkit:v0.34.2@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe

# A newer push to a PR replaces its build still going (a label or reopen doesn't: it may be what publishes the preview)
# Every other run (a push to master) is its own group, so each commit still gets its images.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' }}

# Images are signed and released only from master (a push to it, or a run started by hand on it):
# github.ref is refs/heads/master for nothing else. They're pushed from master and for preview PRs
# (PUBLISH, below); other pull requests, and runs started by hand on another branch, build without
# logging in or pushing. A pull request builds only when it has to (the changes job): with the preview label, or when
# it changes what the images are built from.
jobs:
  # The backend image installs its Alpine packages from the lock's own immutable release, apk-<lock hash>
  # (GrifballWebApp.Server/apk.lock, docs/reproducible-builds.md), published here before anything builds if it isn't
  # yet: Alpine's mirrors drop a version once a newer one is out. Fork PRs can't make releases; their lock is master's.
  # apk-check (every build, read only) finds the lock's release; apk-archive runs only when it isn't published yet.
  # Skipped with the builds (changes.outputs.build), and build-backend with it.
  apk-check:
    needs: changes
    if: ${{ needs.changes.outputs.build == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      published: ${{ steps.check.outputs.published }}
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || '' }}
          sparse-checkout: |
            .github/scripts
            GrifballWebApp.Server/apk.lock
            GrifballWebApp.Server/Dockerfile
          sparse-checkout-cone-mode: false

      - name: Is the lock's release published?
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/apk-archive.sh --check

  apk-archive:
    needs: apk-check
    if: ${{ needs.apk-check.outputs.published == 'false' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # One run at a time makes a lock's release (two would both draft it); only builds of that lock wait here
    concurrency:
      group: apk-archive-${{ needs.apk-check.outputs.tag }}
      cancel-in-progress: false
    permissions:
      contents: write  # the lock's release
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || '' }}
          sparse-checkout: |
            .github/scripts
            GrifballWebApp.Server/apk.lock
            GrifballWebApp.Server/Dockerfile
          sparse-checkout-cone-mode: false

      - name: Archive the lock's packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The new release's tag points at a master commit (on a PR, its base): GitHub's signed merge commits, so
          # the tag shows as Verified; a PR's own commits may be unsigned.
          TARGET: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
        run: .github/scripts/apk-archive.sh

  build-frontend:
    needs: changes
    if: ${{ needs.changes.outputs.build == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    permissions:
      contents: read
      packages: write
      pull-requests: read  # re-check the preview label before pushing
      # This is used to complete the identity challenge
      # with sigstore/fulcio when running outside of PRs.
      id-token: write
      attestations: write  # the build provenance (actions/attest-build-provenance)

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # PRs build their head commit, matching the sha- tag. Empty means the default (the pushed commit).
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || '' }}

      # Install the cosign tool, only from master
      # https://github.com/sigstore/cosign-installer
      - name: Install cosign
        if: github.ref == 'refs/heads/master'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.4'

      # Emulation for the arm64 image's few RUN steps (apk add); the .NET and Node builds run natively
      # and target arm64 (see the Dockerfiles). Skipped on PRs where only amd64 is built.
      - name: Set up QEMU
        if: github.event_name != 'pull_request'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      # Set up BuildKit Docker container builder to be able to build
      # multi-platform images and export cache
      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # Pinned: BuildKit packs the layers, and another version may pack the same files into other bytes
          # (docs/reproducible-builds.md).
          driver-opts: ${{ env.BUILDKIT }}

      # Login against a Docker registry: from master, and for preview PRs (PUBLISH)
      # https://github.com/docker/login-action
      - name: Log into registry ${{ env.REGISTRY }}
        if: env.PUBLISH == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # What the image is built from, beside the files: the commit (its labels) and its time, which BuildKit gives
      # every file and the image itself (SOURCE_DATE_EPOCH, rewrite-timestamp) in place of the time of the build.
      # The same commit then builds the same image wherever it's built (docs/reproducible-builds.md). No cache
      # from other runs: a layer kept from an earlier commit's build would keep that commit's time. (It saved
      # little: the backend's build reruns from its source copy on every commit anyway.)
      - name: The commit the image is built from
        id: source
        run: |
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "epoch=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"

      # Extract metadata (tags, labels) for Docker
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata for frontend
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}
          # Only the immutable sha- tag here (plus pr-<N> on preview PRs). :test moves in the release job, once every image
          # in this run has built and pushed - never a partial set.
          tags: |
            type=sha
            type=ref,event=pr

      # Build frontend without pushing first (the push re-uses this builder's layers) and allow preview-label.yml to complete
      - name: Build Docker image for frontend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: grifballwebapp.client
          platforms: ${{ env.PLATFORMS }}
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            SOURCE_DATE_EPOCH=${{ steps.source.outputs.epoch }}
            SOURCE_REVISION=${{ steps.source.outputs.revision }}
          # No BuildKit provenance or metadata-action labels: both hold the time of the build. The image's labels
          # are the Dockerfile's, and its provenance is GitHub's attestation (below).
          provenance: false

      # preview-label.yml may have removed the label since this run started (over the cap), and a label removed by
      # GITHUB_TOKEN doesn't trigger preview-cleanup.yml. Check after building and just before pushing.
      - name: Check the preview label is still on the PR
        id: still-labelled
        if: env.PUBLISH == 'true' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if gh api "repos/$REPO/pulls/$PR" --jq '.labels[].name' | grep -qx preview; then
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::The preview label was removed from #$PR during this run; building without pushing"
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi

      # Push frontend image (re-uses local builder cache from build step above)
      - name: Push Docker image for frontend
        id: push
        if: env.PUBLISH == 'true' && steps.still-labelled.outputs.push != 'false'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: grifballwebapp.client
          platforms: ${{ env.PLATFORMS }}
          outputs: type=image,push=true,rewrite-timestamp=true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            SOURCE_DATE_EPOCH=${{ steps.source.outputs.epoch }}
            SOURCE_REVISION=${{ steps.source.outputs.revision }}
          # No BuildKit provenance or metadata-action labels: both hold the time of the build. The image's labels
          # are the Dockerfile's, and its provenance is GitHub's attestation (below).
          provenance: false

      # Sign the resulting Docker image digest, only from master.
      # This will only write to the public Rekor transparency log when the Docker
      # repository is public to avoid leaking data.
      # https://github.com/sigstore/cosign
      - name: Sign the published Docker image for frontend
        if: ${{ github.ref == 'refs/heads/master' }}
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: echo "${TAGS}" | xargs -I {} cosign sign --yes {}@${DIGEST}

      # The signature the homelab checks (its Kyverno policy verify-signatures-grif): keyless, from this workflow on
      # master. Verifying it here fails the run, before release moves :test, if a cosign upgrade signs differently.
      - name: Verify the frontend image's signature
        if: ${{ github.ref == 'refs/heads/master' }}
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          image=$(echo "${TAGS}" | head -n 1)
          cosign verify "${image%:*}@${DIGEST}" \
            --certificate-identity https://github.com/PlayGrifball/GrifballWebApp/.github/workflows/docker-publish.yml@refs/heads/master \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null

      # GitHub's build provenance for the image (SLSA): signed with this run's identity and logged in Sigstore's
      # public Rekor log, it ties the digest to this repo, commit and workflow. Anyone can check it:
      #   gh attestation verify oci://ghcr.io/playgrifball/grifballwebappclient@<digest> -R PlayGrifball/GrifballWebApp
      - name: Attest the frontend image's build provenance
        if: ${{ github.ref == 'refs/heads/master' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/playgrifball/grifballwebappclient
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      # The client's build manifest (browser/build-manifest.json: every file the site sends to browsers, by sha256),
      # from the image just pushed, attested on its own: verify-site.mjs checks a live site against it.
      - name: Extract the client's build manifest
        if: ${{ github.ref == 'refs/heads/master' }}
        env:
          IMAGE: ${{ env.REGISTRY }}/playgrifball/grifballwebappclient@${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          id=$(docker create --platform linux/amd64 "$IMAGE")
          docker cp "$id:/app/browser/build-manifest.json" build-manifest.json
          docker rm "$id" > /dev/null
          jq -e '.files | length > 0' build-manifest.json > /dev/null

      - name: Attest the client's build manifest
        if: ${{ github.ref == 'refs/heads/master' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: build-manifest.json

  build-backend:
    needs: [apk-check, apk-archive]
    # Skipped with apk-check, when the run builds nothing (changes.outputs.build). apk-archive is skipped when the lock's
    # release is published already, and on fork PRs.
    if: ${{ !cancelled() && needs.apk-check.result == 'success' && needs.apk-archive.result != 'failure' }}
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    permissions:
      contents: read
      packages: write
      pull-requests: read  # re-check the preview label before pushing
      # This is used to complete the identity challenge
      # with sigstore/fulcio when running outside of PRs.
      id-token: write
      attestations: write  # the build provenance (actions/attest-build-provenance)

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # PRs build their head commit, matching the sha- tag. Empty means the default (the pushed commit).
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || '' }}

      # Install the cosign tool, only from master
      # https://github.com/sigstore/cosign-installer
      - name: Install cosign
        if: github.ref == 'refs/heads/master'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.4'

      # Emulation for the arm64 image's few RUN steps (apk add); the .NET and Node builds run natively
      # and target arm64 (see the Dockerfiles). Skipped on PRs where only amd64 is built.
      - name: Set up QEMU
        if: github.event_name != 'pull_request'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      # Set up BuildKit Docker container builder to be able to build
      # multi-platform images and export cache
      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # Pinned: BuildKit packs the layers, and another version may pack the same files into other bytes
          # (docs/reproducible-builds.md).
          driver-opts: ${{ env.BUILDKIT }}

      # Login against a Docker registry: from master, and for preview PRs (PUBLISH)
      # https://github.com/docker/login-action
      - name: Log into registry ${{ env.REGISTRY }}
        if: env.PUBLISH == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # What the image is built from, beside the files: the commit (its labels) and its time, which BuildKit gives
      # every file and the image itself (SOURCE_DATE_EPOCH, rewrite-timestamp) in place of the time of the build.
      # The same commit then builds the same image wherever it's built (docs/reproducible-builds.md). No cache
      # from other runs: a layer kept from an earlier commit's build would keep that commit's time. (It saved
      # little: the backend's build reruns from its source copy on every commit anyway.)
      - name: The commit the image is built from
        id: source
        run: |
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "epoch=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"

      # Extract metadata (tags, labels) for Docker
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata for backend
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}
          # Only the immutable sha- tag here (plus pr-<N> on preview PRs). :test moves in the release job, once every image
          # in this run has built and pushed - never a partial set.
          tags: |
            type=sha
            type=ref,event=pr

      # master's migration IDs into the build context (.master-migrations), which the image carries at
      # /app/master-migrations: a preview's migration Job resets its database only when what it has that the
      # image lacks is none of master's (charts/grifballwebapp). origin/master is in the full clone above.
      # On master, the commit being built is master: its own list, so the image depends on the commit alone
      # (origin/master may have moved on since the push) and can be rebuilt from it (reproducible.yml).
      - name: Master's migration list
        env:
          REF: ${{ github.ref == 'refs/heads/master' && 'HEAD' || 'origin/master' }}
        run: .github/scripts/master-migrations.sh .master-migrations "$(git rev-parse "$REF")"

      # Build backend without pushing first (the push re-uses this builder's layers) and allow preview-label.yml to complete
      - name: Build Docker image for backend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: GrifballWebApp.Server/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            SOURCE_DATE_EPOCH=${{ steps.source.outputs.epoch }}
            SOURCE_REVISION=${{ steps.source.outputs.revision }}
          # No BuildKit provenance or metadata-action labels: both hold the time of the build. The image's labels
          # are the Dockerfile's, and its provenance is GitHub's attestation (below).
          provenance: false

      # preview-label.yml may have removed the label since this run started (over the cap), and a label removed by
      # GITHUB_TOKEN doesn't trigger preview-cleanup.yml. Check after building and just before pushing.
      - name: Check the preview label is still on the PR
        id: still-labelled
        if: env.PUBLISH == 'true' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if gh api "repos/$REPO/pulls/$PR" --jq '.labels[].name' | grep -qx preview; then
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::The preview label was removed from #$PR during this run; building without pushing"
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi

      # Push backend image (re-uses local builder cache from build step above)
      - name: Push Docker image for backend
        id: push
        if: env.PUBLISH == 'true' && steps.still-labelled.outputs.push != 'false'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: GrifballWebApp.Server/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          outputs: type=image,push=true,rewrite-timestamp=true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            SOURCE_DATE_EPOCH=${{ steps.source.outputs.epoch }}
            SOURCE_REVISION=${{ steps.source.outputs.revision }}
          # No BuildKit provenance or metadata-action labels: both hold the time of the build. The image's labels
          # are the Dockerfile's, and its provenance is GitHub's attestation (below).
          provenance: false

      # Sign the resulting Docker image digest, only from master.
      # This will only write to the public Rekor transparency log when the Docker
      # repository is public to avoid leaking data.
      # https://github.com/sigstore/cosign
      - name: Sign the published Docker image for backend
        if: ${{ github.ref == 'refs/heads/master' }}
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: echo "${TAGS}" | xargs -I {} cosign sign --yes {}@${DIGEST}

      # The signature the homelab checks (its Kyverno policy verify-signatures-grif): keyless, from this workflow on
      # master. Verifying it here fails the run, before release moves :test, if a cosign upgrade signs differently.
      - name: Verify the backend image's signature
        if: ${{ github.ref == 'refs/heads/master' }}
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          image=$(echo "${TAGS}" | head -n 1)
          cosign verify "${image%:*}@${DIGEST}" \
            --certificate-identity https://github.com/PlayGrifball/GrifballWebApp/.github/workflows/docker-publish.yml@refs/heads/master \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null

      # GitHub's build provenance for the image (SLSA): signed with this run's identity and logged in Sigstore's
      # public Rekor log, it ties the digest to this repo, commit and workflow. Anyone can check it:
      #   gh attestation verify oci://ghcr.io/playgrifball/grifballwebappserver@<digest> -R PlayGrifball/GrifballWebApp
      - name: Attest the backend image's build provenance
        if: ${{ github.ref == 'refs/heads/master' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/playgrifball/grifballwebappserver
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      # Master builds both amd64 and arm64; verify the arm64 backend image with a smoke test before release.
      # Skipped on pull requests to keep preview and check runs fast.
      - name: Build the arm64 backend image to run it
        if: github.ref == 'refs/heads/master'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: GrifballWebApp.Server/Dockerfile
          platforms: linux/arm64
          load: true
          push: false
          tags: backend-arm64

      - name: Smoke-test the arm64 backend image
        if: github.ref == 'refs/heads/master'
        run: |
          set -euo pipefail
          docker run --rm --platform linux/arm64 --entrypoint sh backend-arm64 -c \
            'set -e; uname -m; dotnet --list-runtimes; sqlcmd --version; /app/efbundle --help | head -n 3; test -f /usr/share/zoneinfo/America/New_York'

  # What the PR changed (.github/scripts/changed-areas.sh), and so what this run builds. build: a pull request builds its
  # images only with the preview label (they're its preview's) or when it changes what they're built from (images=true:
  # the Dockerfiles, the package and project files, this workflow); anything else is a check of app code the test
  # workflows already run, and master builds both images on every push. Not a pull request (master, a manual run):
  # always. The arm64 check runs only for images=true; master builds and smoke-tests arm64 on every push, before the
  # release.
  changes:
    # Other labels don't change the build, so don't rebuild for them (the jobs below need this one, so they skip too).
    if: ${{ github.event.action != 'labeled' || github.event.label.name == 'preview' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      images: ${{ steps.areas.outputs.images }}
      build: ${{ github.event_name != 'pull_request' || steps.areas.outputs.images == 'true' || contains(github.event.pull_request.labels.*.name, 'preview') }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: What changed
        id: areas
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: .github/scripts/changed-areas.sh

  # On PRs, build arm64 in a separate parallel job so any arm64 breakage is caught without delaying preview deployment.
  check-arm64:
    needs: changes
    # Other labels don't change the build, so don't rebuild for them.
    if: ${{ github.event_name == 'pull_request' && (github.event.action != 'labeled' || github.event.label.name == 'preview') }}
    runs-on: ubuntu-latest
    env:
      # Skipped step by step, so the check keeps its name and passes
      RUN: ${{ needs.changes.outputs.images }}
    permissions:
      contents: read
    steps:
      - name: Nothing to check
        if: env.RUN != 'true'
        run: "echo 'The PR changes nothing the images are built from: the arm64 check is skipped'"

      - name: Checkout repository
        if: env.RUN == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # PRs build their head commit, matching the sha- tag. Empty means the default (the pushed commit).
          ref: ${{ github.event.pull_request.head.sha || '' }}

      # Emulation for the arm64 image's few RUN steps (apk add); the .NET and Node builds run natively
      # and target arm64 (see the Dockerfiles).
      - name: Set up QEMU
        if: env.RUN == 'true'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      # Set up BuildKit Docker container builder to be able to build
      # multi-platform images and export cache
      - name: Set up Docker Buildx
        if: env.RUN == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # Pinned: BuildKit packs the layers, and another version may pack the same files into other bytes
          # (docs/reproducible-builds.md).
          driver-opts: ${{ env.BUILDKIT }}

      # master's migration IDs into the build context (.master-migrations), which the image carries at
      # /app/master-migrations: a preview's migration Job resets its database only when what it has that the
      # image lacks is none of master's (charts/grifballwebapp). origin/master is in the full clone above.
      - name: Master's migration list
        if: env.RUN == 'true'
        run: .github/scripts/master-migrations.sh .master-migrations origin/master

      # Build the arm64 frontend image to check that it compiles
      - name: Build the arm64 frontend image
        if: env.RUN == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: grifballwebapp.client
          platforms: linux/arm64
          push: false

      # The arm64 backend's native pieces actually run: .NET, the migrations bundle (built for
      # linux-musl-arm64) and sqlcmd. Under QEMU.
      - name: Build the arm64 backend image to run it
        if: env.RUN == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: GrifballWebApp.Server/Dockerfile
          platforms: linux/arm64
          load: true
          push: false
          tags: backend-arm64

      - name: Smoke-test the arm64 backend image
        if: env.RUN == 'true'
        run: |
          set -euo pipefail
          docker run --rm --platform linux/arm64 --entrypoint sh backend-arm64 -c \
            'set -e; uname -m; dotnet --list-runtimes; sqlcmd --version; /app/efbundle --help | head -n 3'

  # Moves :test to this run's images, all or nothing: it runs only after every build
  # above succeeded, so a failed build leaves it on the previous complete set. The homelab's
  # ArgoCD Image Updater follows :test (and :staging, :prod) by digest. Retagging is metadata only
  # (no rebuild, no re-upload), and backend goes first: it carries the migrations bundle, and the backend/frontend pair only
  # has to stay API-compatible for the seconds between the two.
  # :test only moves forward: master's runs go side by side and finish in any order, and a run (or a rerun) of an older
  # commit finishing last would otherwise put :test back on older images. No concurrency group (a pending job there is
  # cancelled by the next, which may be the newest commit's): each run moves :test only to a newer commit, then checks
  # again that no older run's retag landed after its own, so the newest commit's images end up on :test.
  release:
    needs: [build-frontend, build-backend]
    if: ${{ !failure() && !cancelled() && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read  # compare commits
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # Pinned: BuildKit packs the layers, and another version may pack the same files into other bytes
          # (docs/reproducible-builds.md).
          driver-opts: ${{ env.BUILDKIT }}

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Point test at this run's images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
          BACKEND: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}
          FRONTEND: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}
          BACKEND_DIGEST: ${{ needs.build-backend.outputs.digest }}
          FRONTEND_DIGEST: ${{ needs.build-frontend.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "$BACKEND_DIGEST" && test -n "$FRONTEND_DIGEST"
          # Image references are lowercase; IMAGE_NAME_* keep the org's capitalisation.
          BACKEND="${BACKEND,,}"; FRONTEND="${FRONTEND,,}"
          # The commit :test has now: its images' revision label
          current() {
            docker buildx imagetools inspect "$BACKEND:test" --format '{{json .Image}}' \
              | jq -r 'if has("config") then . else to_entries[0].value end | .config.Labels["org.opencontainers.image.revision"] // empty'
          }
          # :test is what the homelab's grif-test deploys. Staging, prod and :latest (prod's images, the
          # Helm chart's default tag) move only through the Promote workflows. Moved only to a newer commit,
          # and moved again if an older run's retag lands after this one's (it saw :test before this did).
          for attempt in 1 2 3 4 5; do
            on=$(current)
            if [ -n "$on" ] && [ "$on" != "$COMMIT" ]; then
              # ahead: this commit comes after :test's; behind or diverged: it doesn't
              status=$(gh api "repos/$REPO/compare/$on...$COMMIT" --jq .status)
              if [ "$status" != ahead ]; then
                if [ "$attempt" = 1 ]; then
                  echo "::notice:::test stays on ${on:0:7}: this run's ${COMMIT:0:7} is $status of it"
                  echo "### :test stays on \`${on:0:7}\` (this run's \`${COMMIT:0:7}\` is $status of it)" >> "$GITHUB_STEP_SUMMARY"
                fi
                exit 0
              fi
            elif [ "$attempt" != 1 ]; then
              exit 0  # still this run's
            fi
            docker buildx imagetools create -t "$BACKEND:test" "$BACKEND@$BACKEND_DIGEST"
            docker buildx imagetools create -t "$FRONTEND:test" "$FRONTEND@$FRONTEND_DIGEST"
            sleep 20
          done

  # A preview's images are pushed: tell the homelab's Argo CD to look at this PR now rather than at its next poll, so the
  # preview deploys (or moves to this commit) straight away. The ApplicationSet controller's webhook takes a GitHub-style
  # pull_request event and refreshes the pull request generators for this repo - nothing else; it reads the PR itself
  # from GitHub. It is only reachable inside the cluster, so this runs on the org's in-cluster runners (grif-k8s), which
  # have no Kubernetes token and need none. Best effort: a failure here only means waiting for the poll (30 s).
  refresh-preview:
    needs: [build-frontend, build-backend]
    if: ${{ !failure() && !cancelled() && github.event_name == 'pull_request' && needs.build-frontend.outputs.digest != '' && needs.build-backend.outputs.digest != '' }}
    runs-on: grif-k8s
    permissions: {}
    timeout-minutes: 2
    continue-on-error: true
    steps:
      - name: Refresh the homelab's preview ApplicationSet
        env:
          OWNER: ${{ github.repository_owner }}
          NAME: ${{ github.event.repository.name }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          payload=$(printf '{"action":"synchronize","number":%s,"repository":{"name":"%s","owner":{"login":"%s"},"url":"https://api.github.com/repos/%s/%s"}}' \
            "$PR" "$NAME" "$OWNER" "$OWNER" "$NAME")
          curl -fsS --max-time 20 -X POST \
            -H 'Content-Type: application/json' -H 'X-GitHub-Event: pull_request' \
            --data "$payload" http://argocd-applicationset-controller.argocd.svc.cluster.local:7000/api/webhook
          echo "Asked Argo CD to refresh the previews for #$PR"
