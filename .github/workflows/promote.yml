name: Promote

# Moves an environment's image tag to the images another environment runs: :test -> :staging, or
# :staging -> :prod, and :latest with prod (the latest release; the Helm chart's default tag). A
# metadata-only retag, so the promoted environment gets exactly the bytes that ran before it. The
# homelab's ArgoCD Image Updater follows :staging and :prod by digest and deploys the new images
# through the pre-deploy hook (database backup, then migrations). Then a GitHub release records the
# promotion (.github/scripts/env-release.sh): <to>-<date>, at the images' commit, with their digests;
# prod's is the latest release, staging's are pre-releases. Called by promote-to-staging.yml and
# promote-to-prod.yml.
on:
  workflow_call:
    inputs:
      from:
        description: Tag to copy from
        required: true
        type: string
      to:
        description: Tag to move
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_FRONTEND: PlayGrifball/grifballwebappclient
  IMAGE_NAME_BACKEND: PlayGrifball/grifballwebappserver

jobs:
  promote:
    runs-on: ubuntu-latest
    # A hung job fails after this rather than GitHub's 6 hours (a few minutes usually)
    timeout-minutes: 30
    permissions:
      contents: write  # the release
      packages: write
    # One promotion of an environment at a time; a second waits rather than racing it.
    concurrency:
      group: promote-${{ inputs.to }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Point ${{ inputs.to }} at the images ${{ inputs.from }} runs
        id: promote
        env:
          FROM: ${{ inputs.from }}
          TO: ${{ inputs.to }}
          BACKEND: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}
          FRONTEND: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}
        run: |
          set -euo pipefail
          BACKEND="${BACKEND,,}"; FRONTEND="${FRONTEND,,}"
          # Resolve both digests first, so the pair comes from one moment even if CI moves :$FROM.
          backend_digest=$(docker buildx imagetools inspect "$BACKEND:$FROM" --format '{{.Manifest.Digest}}')
          frontend_digest=$(docker buildx imagetools inspect "$FRONTEND:$FROM" --format '{{.Manifest.Digest}}')
          test -n "$backend_digest" && test -n "$frontend_digest"
          # Backend first: it carries the migrations bundle.
          docker buildx imagetools create -t "$BACKEND:$TO" "$BACKEND@$backend_digest"
          docker buildx imagetools create -t "$FRONTEND:$TO" "$FRONTEND@$frontend_digest"
          if [ "$TO" = prod ]; then
            docker buildx imagetools create -t "$BACKEND:latest" "$BACKEND@$backend_digest"
            docker buildx imagetools create -t "$FRONTEND:latest" "$FRONTEND@$frontend_digest"
          fi
          echo "backend=$BACKEND@$backend_digest" >> "$GITHUB_OUTPUT"
          echo "frontend=$FRONTEND@$frontend_digest" >> "$GITHUB_OUTPUT"
          {
            echo "### :$FROM promoted to :$TO"
            echo "- backend \`$backend_digest\`"
            echo "- frontend \`$frontend_digest\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Release ${{ inputs.to }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TO: ${{ inputs.to }}
          FROM: ${{ inputs.from }}
          BACKEND: ${{ steps.promote.outputs.backend }}
          FRONTEND: ${{ steps.promote.outputs.frontend }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ACTOR: ${{ github.actor }}
        run: .github/scripts/env-release.sh "$TO" "$BACKEND" "$FRONTEND"
