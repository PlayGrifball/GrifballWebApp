name: Preview label

# Gatekeeper for PR preview environments (behind Authentik). The `preview` label opts a PR in: docker-publish then
# pushes its images, and the homelab deploys them. When the label is added, this either allows it or removes it again
# and comments why:
#  - previews are for PRs from branches of this repository only, never forks;
#  - at most MAX_PREVIEWS open PRs can carry the label at once.
# An allowed preview also gets one of MAX_PREVIEWS slots, as a preview-slot-<N> label: the homelab deploys only PRs
# with both labels, at https://grif-preview<N>.grifball.xyz, with slot N's own Discord bot and test server. The URL
# is commented once and the comment updated if the slot changes. preview-cleanup.yml frees the slot when the
# `preview` label is removed. The `preview` and `preview-slot-1`..`preview-slot-<MAX_PREVIEWS>` labels must exist
# in the repository (Issues > Labels).
#
# Two triggers, each handling only its own kind of PR:
#  - pull_request, for same-repo PRs. Its token can write for them.
#  - pull_request_target, for fork PRs only, because pull_request gives forks a read-only token, so it could not
#    remove the label. This is the safe use of pull_request_target: the job runs this file from master, never checks
#    out or runs the PR's code, only calls the GitHub API, and passes every PR-controlled value through env.
on:
  pull_request:
    branches: [ "master" ]
    types: [ labeled, reopened ]
  pull_request_target:
    branches: [ "master" ]
    types: [ labeled, reopened ]

permissions: {}

# Same-repo runs one at a time across all PRs, so two PRs labelled together can't take the same slot. Fork runs only
# remove the label, so they stay per PR.
concurrency:
  group: preview-label-${{ github.event_name == 'pull_request' && 'slots' || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  same-repo:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      ((github.event.action == 'labeled' && github.event.label.name == 'preview') ||
       (github.event.action == 'reopened' && contains(github.event.pull_request.labels.*.name, 'preview')))
    runs-on: ubuntu-latest
    permissions:
      # Read open PRs' labels, remove the label, comment. Labels and comments on PRs go through the issues API.
      pull-requests: write
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      MAX_PREVIEWS: 3
    steps:
      - name: Allow the preview and give it a slot, or remove the label if over the cap
        run: |
          set -euo pipefail
          # Open PRs with the preview label, each with the preview-slot-<N> labels it carries. The label is already on
          # this PR, so it counts itself.
          gh api "repos/$REPO/pulls?state=open&per_page=100" --paginate \
            --jq '.[] | select(any(.labels[]; .name == "preview")) | "\(.number) \([.labels[].name | select(startswith("preview-slot-"))] | join(" "))"' \
            > previews.txt
          mapfile -t labeled < <(cut -d' ' -f1 previews.txt)
          echo "Open PRs with the preview label: ${labeled[*]:-none}"

          # Slots held by the other previews, and the ones on this PR.
          declare -A taken=()
          mine=()
          while read -r n slots; do
            for s in $slots; do
              if [ "$n" = "$PR" ]; then mine+=("$s"); else taken[$s]=1; fi
            done
          done < previews.txt

          if [ "${#labeled[@]}" -gt "$MAX_PREVIEWS" ]; then
            others=""
            for n in "${labeled[@]}"; do [ "$n" = "$PR" ] || others="$others #$n"; done
            for s in preview "${mine[@]}"; do
              gh api -X DELETE "repos/$REPO/issues/$PR/labels/$s" > /dev/null
            done
            gh api "repos/$REPO/issues/$PR/comments" -F body=@- > /dev/null <<EOF
          The \`preview\` label was removed: at most $MAX_PREVIEWS open PRs can have a preview environment at once, and${others} already do. Remove the label from one of those (or close it), then add it here again.
          EOF
            echo "::notice::Over the cap of $MAX_PREVIEWS previews; removed the label from #$PR"
            exit 0
          fi

          # Each slot is one of the homelab's preview servers: host grif-preview<N>.grifball.xyz, with its own Discord bot
          # and test server. Keep this PR's slot unless another preview holds it too (reopened after its slot was
          # reused), else take the lowest free one.
          slot=""
          for s in "${mine[@]}"; do
            if [ -z "$slot" ] && [ -z "${taken[$s]:-}" ]; then slot=$s; fi
          done
          if [ -z "$slot" ]; then
            for i in $(seq 1 "$MAX_PREVIEWS"); do
              if [ -z "${taken[preview-slot-$i]:-}" ]; then slot="preview-slot-$i"; break; fi
            done
          fi
          if [ -z "$slot" ]; then
            echo "::error::Every preview slot is held by another PR"
            exit 1
          fi
          for s in "${mine[@]}"; do
            if [ "$s" != "$slot" ]; then gh api -X DELETE "repos/$REPO/issues/$PR/labels/$s" > /dev/null; fi
          done
          gh api "repos/$REPO/issues/$PR/labels" -f "labels[]=$slot" > /dev/null
          n=${slot#preview-slot-}
          echo "::notice::#$PR has $slot"

          # One URL comment per PR, updated if the slot changes, not reposted on every push or re-label.
          marker='<!-- preview-environment-url -->'
          body=$(cat <<EOF
          $marker
          Preview environment: https://grif-preview$n.grifball.xyz (Authentik login), preview slot $n.

          It runs this PR's images (\`sha-<first 7 of the head commit>\`), rebuilt on every push, against a copy of the test database with this PR's migrations applied. Discord runs against the slot's own test server, **GrifballWebAppPreview$n**, with its own bot; Halo Infinite and Google are off in previews. Remove the \`preview\` label or close the PR to tear it down; its images are deleted then too.
          EOF
          )
          existing=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq ".[] | select(.body | contains(\"$marker\")) | .id" | head -n 1)
          if [ -z "$existing" ]; then
            gh api "repos/$REPO/issues/$PR/comments" -f body="$body" > /dev/null
          elif [ "$(gh api "repos/$REPO/issues/comments/$existing" --jq .body)" != "$body" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$existing" -f body="$body" > /dev/null
          else
            echo "URL comment already up to date"
          fi

  fork:
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.head.repo.full_name != github.repository &&
      ((github.event.action == 'labeled' && github.event.label.name == 'preview') ||
       (github.event.action == 'reopened' && contains(github.event.pull_request.labels.*.name, 'preview')))
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - name: Remove the label from a fork PR
        run: |
          set -euo pipefail
          gh api -X DELETE "repos/$REPO/issues/$PR/labels/preview" > /dev/null
          gh api "repos/$REPO/issues/$PR/comments" -F body=@- > /dev/null <<EOF
          The \`preview\` label was removed: preview environments are only for PRs from branches of $REPO, not forks, because a preview publishes images with this repository's credentials.
          EOF
